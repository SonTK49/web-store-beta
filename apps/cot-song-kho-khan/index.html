<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Đổi Đời Vé Số</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3e4;--paper:#fffaf0;--ink:#2a1b12;--muted:#8b7562;--line:#ead9bf;--red:#c8102e;--gold:#f4b400;--gold2:#ffd966;--green:#18864b;--shadow:0 6px 18px rgba(80,40,10,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:15px}
body{background:radial-gradient(circle at 15% 0%,#fff3d6 0,transparent 45%),var(--bg);min-height:100vh}
#app{max-width:520px;margin:0 auto;padding-bottom:86px}
h1,h2,h3,.disp{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.2}
h2{font-size:22px;margin-bottom:8px}
#top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#a50d24,#d92b2b 55%,#ef6a2a);color:#fff;padding:10px 14px 12px;border-radius:0 0 20px 20px;box-shadow:var(--shadow)}
.top-row{display:flex;align-items:center;gap:10px}
.ava{width:46px;height:46px;border-radius:50%;background:#ffffff2e;display:grid;place-items:center;font-size:27px;border:2px solid var(--gold2);position:relative;cursor:pointer;flex:none}
.ava .crown{position:absolute;top:-13px;font-size:17px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{opacity:.92;font-size:12px}
.xu{font-family:'Baloo 2',sans-serif;font-size:25px;font-weight:800;color:var(--gold2);text-align:right;line-height:1;position:relative}
.xu small{display:block;font-size:11px;color:#fff;opacity:.85;font-family:'Be Vietnam Pro';font-weight:500}
.xu.neg{color:#ffc4c4}
.fx{position:absolute;right:0;top:-4px;color:#fff;font-size:15px;animation:fx 1.4s forwards;pointer-events:none}
@keyframes fx{to{transform:translateY(-22px);opacity:0}}
.top-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;gap:8px}
.pill{background:#00000026;border-radius:99px;padding:3px 10px;white-space:nowrap}
#view{padding:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 0 var(--line)}
.card h3{font-size:18px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 14px 'Be Vietnam Pro',sans-serif;background:#efe2cc;color:var(--ink);cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(180deg,#e53935,#b71c1c);color:#fff;box-shadow:0 3px 0 #7f0f12}
.btn.gold{background:linear-gradient(180deg,#ffd54f,#f4b400);color:#4a2c00;box-shadow:0 3px 0 #b07f00}
.btn.green{background:linear-gradient(180deg,#2eb872,#18864b);color:#fff;box-shadow:0 3px 0 #0e5a31}
.btn:disabled{opacity:.42;box-shadow:none;cursor:not-allowed;transform:none}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%;margin-top:12px}
.inp{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);font:500 15px 'Be Vietnam Pro',sans-serif;background:#fff;color:var(--ink);outline:none}
.inp:focus{border-color:#e0a24a}
.lbl{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:500}
nav#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:#fffaf0f2;backdrop-filter:blur(8px);border-top:1px solid var(--line)}
nav .inner{display:flex;max-width:520px;width:100%}
nav button{flex:1;border:0;background:none;padding:7px 0 10px;font:600 11px 'Be Vietnam Pro',sans-serif;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;position:relative}
nav button span{font-size:22px;filter:grayscale(.7);transition:transform .15s}
nav button.on{color:var(--red)}
nav button.on span{filter:none;transform:translateY(-2px) scale(1.08)}
.ndot{position:absolute;top:3px;left:55%;background:var(--red);color:#fff;font:700 10px 'Be Vietnam Pro';border-radius:99px;padding:1px 5px;font-style:normal}
.ndot:empty{display:none}
/* ===== scenes ===== */
.scn{position:relative;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line);container-type:size;user-select:none;-webkit-user-select:none;background:#cde7ff;box-shadow:var(--shadow);isolation:isolate}
.scn .wall,.scn .floor{position:absolute;left:0;right:0}
.scn .wall{top:0;bottom:30%}
.scn .floor{bottom:0;height:30%}
.scn .o{position:absolute;line-height:1;font-size:calc(var(--s,10)*1cqmin);transform:translateX(-50%);white-space:nowrap;z-index:2}
.scn .tap{cursor:pointer}
.scn .tap:hover{filter:drop-shadow(0 0 .5cqmin #fff) drop-shadow(0 0 1.2cqmin #ffc107)}
.scn .face{display:inline-block}
.scn .flip{transform:scaleX(-1)}
.scn .ch{transition:left 1.3s ease-in-out,bottom 1.3s ease-in-out;z-index:3}
.scn .ch.walk{z-index:5}
.scn .walk .face{animation:hop .28s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-.9cqmin)}}
.scn .sky{position:absolute;inset:0;transition:background 2s}
.scn .sun{position:absolute;right:10%;top:8%;font-size:6cqmin;line-height:1;z-index:1}
.scn .win{position:absolute;border:1cqmin solid #fff;border-radius:.8cqmin;overflow:hidden;box-shadow:0 .5cqmin 0 #0002;cursor:pointer;z-index:1}
.scn .win .bar{position:absolute;left:50%;top:0;bottom:0;width:.7cqmin;margin-left:-.35cqmin;background:#fff;z-index:3}
.scn .city{position:absolute;left:0;right:0;bottom:0;height:62%}
.scn .bld{position:absolute;bottom:0;background-color:#62748c;background-image:radial-gradient(#ffffff38 28%,transparent 34%);background-size:1.7cqmin 1.7cqmin;transition:background-color 2s}
.scn.nt .bld{background-color:#1d2747;background-image:radial-gradient(#ffd75e 28%,transparent 34%)}
.scn .wire{position:absolute;left:-5%;right:-5%;height:14%;border-bottom:.35cqmin solid #222;border-radius:0 0 50% 50%;z-index:2}
.scn .river{position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(#69a7dd,#2f6ca3)}
.scn .hill{position:absolute;left:-10%;right:-10%;bottom:0;height:55%;background:radial-gradient(ellipse 60% 70% at 25% 100%,#74c160 98%,transparent 100%),radial-gradient(ellipse 60% 80% at 80% 100%,#5aa84a 98%,transparent 100%)}
.scn .pool{position:absolute;left:25%;width:50%;bottom:4%;height:16%;background:linear-gradient(#81d4fa,#0288d1);border-radius:50%;border:.5cqmin solid #eee}
.scn .tree{position:absolute;bottom:14%;font-size:9cqmin;line-height:1;transform:translateX(-50%)}
.scn.nt .hill,.scn.nt .river,.scn.nt .pool,.scn.nt .tree{filter:brightness(.5)}
.scn .rain{position:absolute;inset:-20% 0 0;pointer-events:none;z-index:7;opacity:.55;background-image:linear-gradient(100deg,transparent 0 46%,#ffffffbb 48%,transparent 50%);background-size:3cqmin 6cqmin;animation:rain .35s linear infinite}
@keyframes rain{to{background-position:-1.2cqmin 6cqmin}}
.scn .ngt{position:absolute;inset:0;background:#0a1238;opacity:0;transition:opacity 2s;pointer-events:none;z-index:6}
.scn .lmp{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity 1.5s;background:radial-gradient(circle at 50% 0,#ffe7a0 0,#ffe7a055 25%,transparent 60%);mix-blend-mode:screen}
.scn .clk{position:absolute;width:9cqmin;height:9cqmin;border-radius:50%;background:#fff;border:.7cqmin solid #6d4c41;transform:translateX(-50%);cursor:pointer;z-index:1;box-shadow:0 .4cqmin 0 #0002}
.scn .clk i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:#333;border-radius:1cqmin}
.scn .clk .hh{width:.7cqmin;height:2.4cqmin;margin-left:-.35cqmin}
.scn .clk .mh{width:.45cqmin;height:3.4cqmin;margin-left:-.22cqmin;background:#c62828}
.scn .blk{position:absolute;transform:translateX(-50%);border-radius:.8cqmin .8cqmin 0 0;z-index:1}
.scn .desk{position:absolute;transform:translateX(-50%);width:17%;height:15%;bottom:9%;z-index:4;background:linear-gradient(#a1887f 0 20%,#6d4c41 20% 30%,transparent 30%)}
.scn .desk.mine{background:linear-gradient(#ffcc80 0 20%,#c17900 20% 30%,transparent 30%)}
.scn .desk:before,.scn .desk:after{content:'';position:absolute;top:28%;bottom:0;width:6%;background:#5d4037}
.scn .desk:before{left:6%}.scn .desk:after{right:6%}
.scn .mon{z-index:5}
.scn .cw{transition:opacity .6s}
.scn .cw.away{opacity:0;pointer-events:none}
.scn .st{z-index:5;animation:bubm 2s ease-in-out infinite;pointer-events:none}
@keyframes bubm{50%{transform:translate(-50%,-.6cqmin)}}
.scn .door{position:absolute;transform:translateX(-50%);background:linear-gradient(90deg,#8d6e63,#795548);border:.6cqmin solid #5d4037;border-bottom:0;border-radius:1cqmin 1cqmin 0 0;z-index:1}
.scn .door:after{content:'';position:absolute;right:14%;top:52%;width:1.4cqmin;height:1.4cqmin;border-radius:50%;background:#ffd54f}
.scn .board{position:absolute;background:#fff;border:.6cqmin solid #90a4ae;border-radius:.6cqmin;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 clamp(9px,2.3cqmin,14px)/1.3 'Be Vietnam Pro',sans-serif;color:#37474f;text-align:center;cursor:pointer;z-index:1}
.scn .board b{color:#c62828;font-size:1.2em}
.scn .counter{position:absolute;background:linear-gradient(#cfd8dc 0 18%,#90a4ae 18%);border-radius:.6cqmin .6cqmin 0 0;z-index:1}
.scn .jam,.scn .ring{animation:shake .25s infinite}
@keyframes shake{25%{transform:translateX(-56%) rotate(-5deg)}75%{transform:translateX(-44%) rotate(5deg)}}
.scn .glow{filter:drop-shadow(0 0 1.4cqmin #7fd3ff) drop-shadow(0 0 .6cqmin #fff)}
.scn .spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scn .typing{animation:typ .16s steps(2) infinite}
@keyframes typ{50%{transform:translate(-50%,-.5cqmin)}}
.scn .bub{position:absolute;transform:translateX(-50%);background:#fff;color:#2a1b12;border-radius:1.8cqmin;padding:.9cqmin 1.6cqmin;font:600 clamp(10.5px,2.7cqmin,15px)/1.35 'Be Vietnam Pro',sans-serif;max-width:min(58cqw,300px);width:max-content;box-shadow:0 .6cqmin 1.8cqmin #0004;z-index:9;pointer-events:none;animation:bIn .25s cubic-bezier(.3,1.5,.5,1);text-align:center}
.scn .bub:after{content:'';position:absolute;left:50%;top:100%;margin-left:-1cqmin;border:1cqmin solid transparent;border-top-color:#fff}
@keyframes bIn{from{transform:translateX(-50%) scale(.5);opacity:0}}
.scn .flt{position:absolute;transform:translateX(-50%);font:800 clamp(13px,3.6cqmin,22px) 'Baloo 2',sans-serif;color:#18864b;text-shadow:0 0 3px #fff,0 0 6px #fff;z-index:9;pointer-events:none;animation:flt 1.4s forwards;white-space:nowrap}
@keyframes flt{to{transform:translate(-50%,-7cqmin);opacity:0}}
.scn .task{position:absolute;transform:translateX(-50%);background:#fff;border:.45cqmin solid #f4b400;border-radius:1.4cqmin;padding:.7cqmin 1.3cqmin;font:700 clamp(10px,2.5cqmin,14px) 'Be Vietnam Pro',sans-serif;color:#2a1b12;white-space:nowrap;cursor:pointer;z-index:8;box-shadow:0 .5cqmin 0 #c79100;animation:bIn .3s}
.scn .task:active{transform:translateX(-50%) scale(.93)}
.scn .task .tb{height:.9cqmin;min-height:3px;background:#eee;border-radius:9px;margin-top:.5cqmin;overflow:hidden}
.scn .task .tb i{display:block;height:100%;background:#2eb872;transition:width .15s}
.scn .hud{position:absolute;left:1.8cqmin;right:1.8cqmin;top:1.8cqmin;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;z-index:8;pointer-events:none}
.scn .hud>span{background:#000000a8;color:#fff;font:600 clamp(10.5px,2.6cqmin,14px) 'Be Vietnam Pro',sans-serif;padding:.7cqmin 1.7cqmin;border-radius:99px;white-space:nowrap}
.scn .enb{display:inline-block;width:8cqmin;min-width:30px;height:1.2cqmin;min-height:5px;background:#ffffff40;border-radius:9px;vertical-align:middle;overflow:hidden;margin-left:3px}
.scn .enb i{display:block;height:100%;width:0;background:#9be15d;transition:width .5s}
.scn .cap{position:absolute;left:0;right:0;bottom:0;padding:3cqmin 2.4cqmin 1.4cqmin;background:linear-gradient(transparent,#000000b0);color:#fff;font:500 clamp(10.5px,2.6cqmin,14px)/1.35 'Be Vietnam Pro',sans-serif;z-index:8;pointer-events:none;text-shadow:0 1px 2px #000}
.scn .trip{display:inline-block;position:relative;width:14cqmin;min-width:50px;height:.6cqmin;min-height:3px;background:#ffffff55;border-radius:9px;margin:0 4px;vertical-align:middle}
.scn .trip i{position:absolute;top:50%;left:0;width:1.8cqmin;height:1.8cqmin;min-width:8px;min-height:8px;border-radius:50%;background:#ffd54f;transform:translate(-50%,-50%);transition:left .9s linear}
.scn .strip{position:absolute;left:0;width:200%;display:flex;animation:scroll linear infinite;z-index:1}
.scn .strip>div{position:relative;flex:1;height:100%}
@keyframes scroll{to{transform:translateX(-50%)}}
.scn .far{bottom:31%;height:44%;animation-duration:45s}
.scn .mid{bottom:30%;height:20%;animation-duration:14s}
.scn .mid>div{display:flex;justify-content:space-around;align-items:flex-end;font-size:11cqmin;line-height:1}
.scn .walkway{position:absolute;left:0;right:0;bottom:24%;height:7%;z-index:1;background:repeating-linear-gradient(90deg,#d8d0c3 0 5%,#cbc2b4 5% 10%);background-size:200% 100%;animation:roadmv 6s linear infinite}
.scn .road{position:absolute;left:0;right:0;bottom:0;height:24%;background:#4a4a52;z-index:1}
.scn .lane{position:absolute;left:0;right:0;bottom:11.5%;height:1.1%;z-index:2;background:repeating-linear-gradient(90deg,#fff 0 4%,transparent 4% 10%);background-size:200% 100%;animation:roadmv 1.6s linear infinite}
@keyframes roadmv{from{background-position:0 0}to{background-position:100% 0}}
.scn.sc-commute .cap{bottom:auto;top:8.5cqmin;background:none;padding:1cqmin 2.4cqmin}
.scn .bobf{display:inline-block;animation:bobf .3s ease-in-out infinite alternate}
@keyframes bobf{from{transform:scaleX(-1)}to{transform:scaleX(-1) translateY(-.6cqmin)}}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2eb872,#9be15d);width:0;transition:width .6s}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:14px}
.kv b{text-align:right}
.kv .sep{grid-column:1/-1;border-top:1px dashed var(--line);margin:3px 0}
/* tickets */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vt{position:relative;background:linear-gradient(160deg,#ffe6ee,#ffd0dd);border:2px solid #eaa3b9;border-radius:10px;padding:7px 8px 7px 16px;cursor:pointer;overflow:hidden;user-select:none}
.vt:before{content:'';position:absolute;left:4px;top:6px;bottom:6px;border-left:3px dotted #e48fa9}
.vt .h{font-size:9px;font-weight:700;color:#a3123d;letter-spacing:.4px;text-transform:uppercase}
.vt .d{font-size:10.5px;color:#7a3a4b}
.vt .n{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:27px;letter-spacing:3px;color:#7a0d2c;line-height:1.1}
.vt.sel{background:linear-gradient(160deg,#fff4c2,#ffe08a);border-color:#e0b100;box-shadow:0 0 0 3px #f4b40066}
.vt.sel:after{content:'✓';position:absolute;right:7px;top:6px;background:var(--green);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px;font-weight:700}
.vt .pretty{position:absolute;right:6px;bottom:5px;font-size:10px;background:var(--gold);color:#4a2c00;border-radius:6px;padding:0 5px;font-weight:700}
.npc{display:flex;gap:10px;align-items:flex-end;margin-top:10px}
.npcf{font-size:44px;line-height:1}
.bubble{background:#fff;border:1.5px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:13.5px;flex:1}
.buybar{position:sticky;bottom:72px;margin-top:12px;background:#2a1b12;color:#fff;border-radius:14px;padding:8px 8px 8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:var(--shadow);z-index:5}
.buybar .btn:not(.pri){background:#ffffff22;color:#fff}
.ng{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.ng button{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:700 14px 'Baloo 2',sans-serif;color:var(--ink);cursor:pointer;padding:0}
.ng button.on{background:var(--pc);color:#fff;border-color:var(--pc);transform:scale(1.07)}
.ng.sp{grid-template-columns:repeat(6,1fr);max-width:300px}
.ng.sp button.on{background:var(--gold);border-color:var(--gold);color:#4a2c00}
.m3pick{display:flex;gap:12px;justify-content:center;margin:12px 0}
.m3d{display:flex;flex-direction:column;align-items:center;gap:4px}
.m3d span{font:800 46px 'Baloo 2',sans-serif;width:64px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:14px;color:var(--pc)}
.m3d button{border:0;background:#efe2cc;border-radius:10px;width:52px;height:30px;font-size:14px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font:600 13px 'Be Vietnam Pro',sans-serif;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip small{color:var(--muted);font-weight:500}
.favs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.fav{display:inline-flex;align-items:center}
.fav .chip{padding:5px 10px;font-size:12px;border-radius:99px 0 0 99px;background:#fff8e1;border-color:#f3d27a}
.fav .x{border:1.5px solid #f3d27a;border-left:0;background:#fff8e1;border-radius:0 99px 99px 0;padding:5px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.jpb{text-align:right;font-size:11px;color:var(--pc);line-height:1.3;flex:none}
.jpb b{font-family:'Baloo 2',sans-serif;font-size:16px}
details.pz{margin-top:12px;font-size:13px}
details.pz summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.pz .kv{font-size:13px;margin-top:8px}
.tkl{display:flex;flex-wrap:wrap;gap:6px}
.tkn{font:800 17px 'Baloo 2',sans-serif;background:#ffe6ee;border:1.5px solid #eaa3b9;color:#7a0d2c;border-radius:8px;padding:1px 8px;letter-spacing:1.5px}
.tkn.m3t{background:#e0f2f1;border-color:#80cbc4;color:#00695c}
.tkv{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 6px}
.tkv em{font-style:normal;font-size:11px;color:var(--muted);margin-left:3px}
.ball{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffffff99 0 12%,transparent 14%),var(--bc,var(--pc,#e53935));color:#fff;font:800 13px 'Baloo 2',sans-serif;box-shadow:inset -3px -4px 0 #0003;flex:none}
.ball.big{width:44px;height:44px;font-size:19px}
.ball.spb{outline:2px dashed #ffffffaa;outline-offset:2px}
.ball.hit{box-shadow:inset -3px -4px 0 #0003,0 0 0 3px #ffd54f,0 0 14px #ffd54f}
.ball.dim{opacity:.4}
/* modal */
#modalWrap{position:fixed;inset:0;background:#2a1b12a0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#modalWrap.hidden{display:none}
.modal{background:var(--paper);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 24px;animation:up .25s}
@media(min-width:560px){#modalWrap{align-items:center}.modal{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.avb{font-size:28px;width:50px;height:50px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer}

/* ===== v4 characters ===== */
.chr{display:block;width:.5em;height:1em;overflow:visible}
.chr g{transform-box:view-box}
.chr .arm.l{transform-origin:10px 27.5px}.chr .arm.r{transform-origin:30px 27.5px}
.chr .lg.l{transform-origin:16.8px 49px}.chr .lg.r{transform-origin:23.2px 49px}
.chr .hd{transform-origin:20px 24px;animation:headI 4s ease-in-out infinite}.chr .bd{transform-origin:20px 48px}
.chr .eye,.chr .mouth{transform-box:fill-box;transform-origin:center}
.chr .eye{animation:blink 4.4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes headI{50%{transform:rotate(3deg) translateY(.4px)}}
.walk .chr .lg.l{animation:stepA .5s ease-in-out infinite}.walk .chr .lg.r{animation:stepA .5s ease-in-out -.25s infinite}
@keyframes stepA{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2.6px) scaleY(.88)}}
.walk .chr .arm.l{animation:swing .5s ease-in-out infinite alternate}.walk .chr .arm.r{animation:swing .5s ease-in-out -.5s infinite alternate}
@keyframes swing{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
.walk .chr .bd,.walk .chr .hd{animation:bobw .25s ease-in-out infinite alternate}
@keyframes bobw{to{transform:translateY(-1.3px)}}
.type .chr .arm.l{animation:typL .2s ease-in-out infinite alternate}.type .chr .arm.r{animation:typR .2s ease-in-out infinite alternate}
@keyframes typL{from{transform:rotate(-40deg)}to{transform:rotate(-28deg)}}
@keyframes typR{from{transform:rotate(28deg)}to{transform:rotate(40deg)}}
.wave .chr .arm.r,.chr.wave .arm.r{animation:wave .35s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-155deg)}to{transform:rotate(-120deg)}}
.talk .chr .mouth{animation:talkm .15s infinite alternate}
@keyframes talkm{to{transform:scaleY(2.4) scaleX(.8)}}
.sleep .chr{transform:rotate(-90deg)}.sleep .chr .eye{animation:none;transform:scaleY(.12)}
.ride .chr .lg.l{transform:rotate(28deg)}.ride .chr .lg.r{transform:rotate(-28deg)}.ride .chr .arm.l{transform:rotate(-32deg)}.ride .chr .arm.r{transform:rotate(32deg)}

function beep(f=600,d=.08,type='sine',v=.07){if(!S||!S.set.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function jingle(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.09),i*120))}
function coinSnd(){beep(988,.06,'square',.03);setTimeout(()=>beep(1318,.1,'square',.03),70)}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function toast(msg,ms=2800){const box=$('#toasts');while(box.children.length>=3)box.firstChild.remove();const t=document.createElement('div');t.className='toast';t.innerHTML=msg;box.appendChild(t);setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity=0;setTimeout(()=>t.remove(),300)},ms)}
function floatXu(n){const b=$('#xuBox');if(!b)return;const s=document.createElement('span');s.className='fx';s.textContent='+'+fmt(n);b.appendChild(s);setTimeout(()=>s.remove(),1400)}
const cf=$('#confetti'),cfx=cf.getContext('2d');let parts=[],cfRun=false;
function confetti(n=120){cf.width=innerWidth;cf.height=innerHeight;const cols=['#e53935','#ffd54f','#43a047','#1e88e5','#d81b60','#ff9800'];for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(rnd()-.5)*120,y:innerHeight*.35,vx:(rnd()-.5)*15,vy:-rnd()*15-4,r:4+rnd()*5,c:cols[ri(6)],a:rnd()*6,va:(rnd()-.5)*.3,life:130+ri(60)});if(!cfRun){cfRun=true;requestAnimationFrame(cfStep)}}
function cfStep(){cfx.clearRect(0,0,cf.width,cf.height);parts=parts.filter(p=>p.life-->0&&p.y<cf.height+20);for(const p of parts){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cfx.save();cfx.translate(p.x,p.y);cfx.rotate(p.a);cfx.fillStyle=p.c;cfx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cfx.restore()}if(parts.length)requestAnimationFrame(cfStep);else{cfRun=false;cfx.clearRect(0,0,cf.width,cf.height)}}

/* ================= time engine ================= */
function tick(){
  if(!S)return;
  const now=Date.now();let dt=now-S.lastReal;if(dt<0)dt=0;S.lastReal=now;
  // coins (real time, offline capped)
  S.coinAcc+=Math.min(dt,OFF_CAP);let gained=0;
  while(S.coinAcc>=COIN_MS){S.coinAcc-=COIN_MS;gained+=coinGain()}
  if(gained){S.xu+=gained;if(dt>GAP)toast(`🪙 Trong lúc vắng mặt bạn tích được <b>+${fmt(gained)} xu</b>`,4000);else{floatXu(gained);coinSnd()}}
  // free draws (each real even hour)
  const sl=slotOf(now);
  if(sl>S.lastSlot){const cap=freeCap();if(S.free<cap){const b=S.free;S.free=Math.min(cap,S.free+(sl-S.lastSlot));if(S.free>b)toast(`🎁 Nhận <b>${S.free-b}</b> lượt mở thưởng miễn phí!`)}S.lastSlot=sl}
  // game clock: 1 real second = 1 game minute; pauses while away unless at work
  let gm=dt/1000;
  if(dt>GAP){gm=(S.g.st==='commute'||S.g.st==='work')?Math.min(gm,Math.max(0,S.g.end-S.g.t)):0}
  if(gm>0)advance(gm);
  extraTick();if(netWorth()>=1e6)badge('millionaire');
  updateLive();
  if(++tickN%5===0)save();
}
function advance(gm){
  const g=S.g;let guard=0;
  while(gm>1e-9&&guard++<200){
    let next=nextMonthStart(g.t);
    if(g.st==='commute')next=Math.min(next,g.arrive);
    if(g.st==='work')next=Math.min(next,g.end);
    const step=Math.max(0,Math.min(gm,next-g.t));
    g.t+=step;gm-=step;
    if(g.st==='work')S.en-=step*.09;else if(g.st==='commute')S.en-=step*.03;else{const hh=mod1440(g.t)/60;if(hh>=22||hh<6)S.en+=step*.25}
    S.en=Math.max(0,Math.min(100,S.en));
    dayRoll(Math.floor(g.t/1440));
    if(g.st==='commute'&&g.t>=g.arrive-1e-9){
      g.st='work';
      if(mod1440(g.arrive)>480){g.mLate++;toast('😓 Đến công ty trễ giờ! Mất thưởng chuyên cần tháng này');addLog('Đi làm trễ giờ')}
      else{toast('💼 Đã đến công ty, làm việc thôi!');track('ontime')}
    }
    if(g.st==='work'&&g.t>=g.end-1e-9){g.st='home';g.mWorked++;S.st.workDays=(S.st.workDays||0)+1;track('work');toast(`✅ Xong ca làm! Ngày công tháng này: <b>${g.mWorked}</b>`);addLog('Hoàn thành 1 ngày công');beep(880,.12,'triangle')}
    if(monthKey(g.t)!==g.mk){payday(g.mk);g.mk=monthKey(g.t);g.mWorked=0;g.mLate=0;g.mTasks=0;g.mPraise=0;g.mScold=0}
    if(step===0&&gm>0&&g.st==='home'&&monthKey(g.t)===g.mk&&next-g.t<=0)break;
  }
}
function payday(mk){
  const y=Math.floor(mk/12),m=mk%12+1,W=workdaysIn(mk),worked=Math.min(S.g.mWorked,W),late=S.g.mLate;
  const sal=Math.round(salaryOf()*worked/Math.max(1,W));
  const ccOk=S.job.on&&worked>=W&&late===0,cc=ccOk?CC_BASE+bestVeh().cc:0;
  const kpi=S.job.on?kpiOf(S.g):0,fi=S.fam.stage>=2?4000:0;
  const items=upkeepItems(),up=items.reduce((s,x)=>s+x[1],0);
  const cr=careerReview(worked,W,ccOk);
  const net=sal+cc+kpi+fi-up;
  S.xu+=net;S.st.sal+=sal+cc+kpi;S.st.upk+=up;
  if(sal>0)badge('first_salary');if(ccOk)badge('full_month');if(S.xu<0)badge('broke');
  addLog(`Lãnh lương tháng ${m}/${y}: ${net>=0?'+':''}${fmt(net)} xu`);
  const P=S.fam.pi>=0?PARTNERS[S.fam.pi]:null;
  modal(`<h2>💵 Phiếu lương tháng ${m}/${y}</h2>
   <div class="kv">${S.job.on?`<span>Lương ${RANKS[S.job.rank].n} (${worked}/${W} ngày công)</span><b style="color:var(--green)">+${fmt(sal)}</b>
   <span>Thưởng chuyên cần${ccOk?'':(late?` (trễ ${late} lần)`:' (thiếu công)')}</span><b style="color:var(--green)">${cc?'+'+fmt(cc):'0'}</b>
   <span>Thưởng KPI (${S.g.mTasks} việc, 👍${S.g.mPraise} 👎${S.g.mScold})</span><b style="color:var(--green)">${kpi?'+'+fmt(kpi):'0'}</b>`:'<span>🏪 Đang làm chủ, không có lương</span><b>0</b>'}
   ${fi?`<span>💑 Lương ${P&&P.cfg.g==='f'?'vợ':'chồng'} góp vào</span><b style="color:var(--green)">+${fmt(fi)}</b>`:''}
   <span class="sep"></span>${items.map(x=>`<span>${x[0]}</span><b style="color:var(--red)">−${fmt(x[1])}</b>`).join('')}
   <span class="sep"></span><span><b>Thực nhận</b></span><b style="font-size:18px;color:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'+':''}${fmt(net)} xu</b></div>${cr}
   ${S.xu<0?'<p style="color:var(--red);font-weight:600">⚠️ Bạn đang âm xu! Phải trả hết nợ mới mua vé được.</p>':''}
   <button class="btn pri block" data-a="closeModal">Nhận lương</button>`);
  if(net>0){sfx.cash();setTimeout(jingle,300)}
  save();
}
function canWork(){
  const g=S.g;
  if(!S.job.on)return{ok:false,msg:'Bạn đã nghỉ việc để làm chủ. Muốn đi làm lại thì nộp đơn ở thẻ Công việc.'};
  if(g.st==='out')return{ok:false,msg:'Đang dạo phố, về nhà trước đã nha.'};
  if(g.st==='commute')return{ok:false,msg:'Đang trên đường đi làm…'};
  if(g.st==='work')return{ok:false,msg:'Đang làm việc…'};
  const wd=gDate(g.t).getUTCDay();
  if(wd===0||wd===6)return{ok:false,msg:'Cuối tuần được nghỉ 🎉 Ra phố dạo chơi hoặc bấm ngủ để qua ngày.'};
  {const ev=curEvent();if(ev&&ev.off)return{ok:false,msg:`${ev.e} Nghỉ ${ev.n}! Ra phố chơi lễ thôi.`}}
  const day=Math.floor(g.t/1440);
  if(g.worked===day)return{ok:false,msg:'Hôm nay đã đi làm rồi. Nghỉ ngơi, mua vé số thôi!'};
  const m=g.t-day*1440;
  if(m<300)return{ok:false,msg:'Còn sớm quá, từ 5:00 mới đi làm được.'};
  if(m>=660)return{ok:false,msg:'Đã quá 11:00, hôm nay coi như nghỉ làm 😅'};
  return{ok:true,msg:''};
}

function genResult(p){

function evalKT(num,r){
  const lines=[];for(const z of KT_PRIZES)for(const x of r[z.k])if(num.endsWith(x))lines.push({name:z.name,val:z.val,big:z.k==='db'});

  if(num!==db&&num.slice(1)===db.slice(1)){lines.push({name:'Phụ Đặc Biệt',val:50000});kk=true}
  if(num[0]===db[0]){let d=0;for(let i=1;i<6;i++)if(num[i]!==db[i])d++;if(d===1){lines.push({name:'Khuyến Khích',val:6000});kk=true}}
  let diff=0;for(let i=0;i<6;i++)if(num[i]!==db[i])diff++;
  return{lines,near:diff===1,jp:num===db,kk};
}
function evalV(p,t,r,set){
  const lines=[];let near=false,jp1=0,jp2=0,kk=false;
  if(p==='lotto'){const m=t.nums.filter(x=>set.has(x)).length,s=t.sp===r.sp;
    if(m===5&&s)jp1=1;else if(m===5){lines.push({name:'Giải Nhất',val:10000});near=true}
    else if(m===4&&s)lines.push({name:'Giải Nhì',val:5000});else if(m===4)lines.push({name:'Giải Ba',val:500});
    else if(m===3&&s)lines.push({name:'Giải Tư',val:100});else if(m===3)lines.push({name:'Giải Năm',val:30});

  const pz=p==='mega'?{5:['Giải Nhất',10000],4:['Giải Nhì',300],3:['Giải Ba',30]}:{5:['Giải Nhất',40000],4:['Giải Nhì',500],3:['Giải Ba',50]};
  for(const c of(t.nums.length>6?combos(t.nums,6):[t.nums])){const m=c.filter(x=>set.has(x)).length;
    if(m===6)jp1++;else if(m===5&&p==='power'&&c.includes(r.sp)){jp2++;near=true}

function settle(p,r,tk){

    if(p==='mega'){n=Math.round((4e5+rnd()*8e5)*(1+D.jp/4e7));const T=C(45,6);b1=poisson(n/T);tiers=[['Giải Nhất',poisson(n*234/T)],['Giải Nhì',poisson(n*11115/T)],['Giải Ba',poisson(n*182780/T)]]}
    else if(p==='power'){n=Math.round((6e5+rnd()*1e6)*(1+D.j1/15e7));const T=C(55,6);b1=poisson(n/T);b2=poisson(n*6/T);tiers=[['Jackpot 2',b2+pJ2],['Giải Nhất',poisson(n*288/T)],['Giải Nhì',poisson(n*17640/T)],['Giải Ba',poisson(n*368480/T)]]}

      tiers=[['Giải Nhất',poisson(n/T*(1-q))],['Giải Nhì',poisson(n*150/T*q)],['Giải Ba',poisson(n*150/T*(1-q))],['Giải Tư',poisson(n*4350/T*q)],['Giải Năm',poisson(n*4350/T*(1-q))],['Khuyến khích',poisson(n*(1-4501/T)*q)]]}

    tiers.unshift([jpName,w1]);

class Drum{
  constructor(cv){this.cv=cv;this.c=cv.getContext('2d');this.R=cv.width/2;this.balls=[];this.run=false;this.rot=0}
  set(nums,col){this.br=nums.length>40?21:nums.length>20?24:30;this.balls=nums.map(n=>{const a=rnd()*6.283,d=rnd()*(this.R-60);return{n,x:Math.cos(a)*d,y:Math.sin(a)*d,vx:(rnd()-.5)*12,vy:(rnd()-.5)*12,c:col}})}
  remove(n){this.balls=this.balls.filter(b=>b.n!==n)}
  start(){this.run=true;const f=()=>{if(!this.run)return;this.step();this.draw();requestAnimationFrame(f)};f()}
  stop(){this.run=false}
  step(){const R=this.R-14-this.br;for(const b of this.balls){b.vy+=.6;b.vx+=(rnd()-.5)*1.6;b.vy+=(rnd()-.5)*1.6;b.x+=b.vx;b.y+=b.vy;const d=Math.hypot(b.x,b.y);
    if(d>R){const nx=b.x/d,ny=b.y/d,dot=b.vx*nx+b.vy*ny;b.vx-=2*dot*nx;b.vy-=2*dot*ny;b.vx+=-ny*5;b.vy+=nx*5;b.x=nx*R;b.y=ny*R}
    const sp=Math.hypot(b.vx,b.vy);if(sp>20){b.vx*=20/sp;b.vy*=20/sp}}}
  draw(){const c=this.c,R=this.R;c.clearRect(0,0,R*2,R*2);c.save();c.translate(R,R);
    const g=c.createRadialGradient(-R*.3,-R*.3,R*.1,0,0,R);g.addColorStop(0,'#ffffff38');g.addColorStop(1,'#ffffff0a');c.fillStyle=g;c.beginPath();c.arc(0,0,R-8,0,7);c.fill();c.lineWidth=14;c.strokeStyle='#ffd54f';c.stroke();
    this.rot+=.03;c.strokeStyle='#ffd54f44';c.lineWidth=5;for(let i=0;i<6;i++){const a=this.rot+i*Math.PI/3;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*(R-14),Math.sin(a)*(R-14));c.stroke()}
    c.textAlign='center';c.textBaseline='middle';c.font=`800 ${Math.round(this.br*.85)}px "Baloo 2",sans-serif`;
    for(const b of this.balls){c.beginPath();c.arc(b.x,b.y,this.br,0,7);c.fillStyle=b.c;c.fill();c.beginPath();c.arc(b.x,b.y,this.br*.64,0,7);c.fillStyle='#fff';c.fill();c.fillStyle='#222';c.fillText(pad(b.n),b.x,b.y+2)}
    c.beginPath();c.arc(-R*.35,-R*.4,R*.18,0,7);c.fillStyle='#ffffff14';c.fill();c.restore()}
}

function initScratch(box,onDone){
  const cv=document.createElement('canvas');box.appendChild(cv);
  const b=box.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,b.width*dpr);cv.height=Math.max(1,b.height*dpr);
  const c=cv.getContext('2d');c.scale(dpr,dpr);
  const g=c.createLinearGradient(0,0,b.width,b.height);g.addColorStop(0,'#b0b0b0');g.addColorStop(.5,'#ececec');g.addColorStop(1,'#9a9a9a');c.fillStyle=g;c.fillRect(0,0,b.width,b.height);
  c.fillStyle='#777';c.font='700 11px "Be Vietnam Pro",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('🪙 CÀO Ở ĐÂY',b.width/2,b.height/2);
  c.globalCompositeOperation='destination-out';
  let down=false,moves=0,done=false;
  const check=()=>{const d=c.getImageData(0,0,cv.width,cv.height).data;let cl=0,tot=0;for(let i=3;i<d.length;i+=64){tot++;if(d[i]===0)cl++}if(cl/tot>.5)finish()};
  const scr=e=>{const r=cv.getBoundingClientRect();c.beginPath();c.arc(e.clientX-r.left,e.clientY-r.top,15,0,7);c.fill();if(++moves%5===0)check()};
  const finish=()=>{if(done)return;done=true;cv.style.transition='opacity .3s';cv.style.opacity=0;setTimeout(()=>cv.remove(),300);onDone()};
  cv.addEventListener('pointerdown',e=>{down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}scr(e)});
  cv.addEventListener('pointermove',e=>{if(down)scr(e)});
  cv.addEventListener('pointerup',()=>{down=false;check()});cv.addEventListener('pointercancel',()=>{down=false});
  return{finish};
}

const WIDE_MQ=matchMedia('(orientation:landscape) and (min-width:700px)');
const dayIdx=()=>Math.floor(S.g.t/1440);
const hourF=()=>mod1440(S.g.t)/60;
const isNight=h=>h<5||h>=19;
const sleepHr=h=>h>=22||h<5;
function wxOf(d){let x=Math.imul(d+12345,2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;const r=(x%1000)/1000,mo=gDate(d*1440).getUTCMonth();return mo>=4&&mo<=9?(r<.42?0:r<.66?1:2):(r<.6?0:r<.9?1:2)}
const WX=[['☀️','Trời nắng đẹp'],['⛅','Trời nhiều mây'],['🌧️','Trời mưa']];
function rainDelay(v=bestVeh()){return wxOf(dayIdx())!==2?0:(v.id==='oto'||v.id==='sieuxe')?5:v.id==='bus'?10:15}
function skyOf(h,wx){if(isNight(h))return'linear-gradient(#0b1a3a,#26407a)';if(wx===2)return'linear-gradient(#7d8ea3,#c3ccd8)';if(h<7)return'linear-gradient(#f59e6b,#ffe1a8)';if(h>=17)return'linear-gradient(#ff8261,#ffd49a)';return wx===1?'linear-gradient(#8fb6dc,#dde9f5)':'linear-gradient(#4ea3ef,#cde7ff)'}
function seeded(seed){let r=Math.abs(Math.floor(seed))%233280;return()=>{r=(r*9301+49297)%233280;return r/233280}}
function skyline(seed,h1=30,h2=95){const R=seeded(seed);let s='',x=-2;while(x<100){const w=7+R()*11,h=h1+R()*(h2-h1);s+=`<i class="bld" style="left:${x.toFixed(1)}%;width:${w.toFixed(1)}%;height:${h.toFixed(0)}%"></i>`;x+=w+R()*3}return`<div class="city">${s}</div>`}
function sunIcon(){const h=hourF(),wx=wxOf(dayIdx());return isNight(h)?'🌙':wx===2?'🌧️':wx===1?'⛅':'☀️'}
function winView(kind){
  if(kind==='alley')return skyline(7,55,100)+'<div class="wire" style="top:14%"></div><div class="wire" style="top:28%"></div>';
  if(kind==='river')return skyline(21,15,55)+'<div class="river"></div>';
  if(kind==='garden')return'<div class="hill"></div><div class="pool"></div><span class="tree" style="left:12%">🌴</span><span class="tree" style="left:86%">🌳</span>';
  return skyline(kind==='city2'?33:13,25,85);
}
const rainHTML=()=>wxOf(dayIdx())===2?'<div class="rain"></div>':'';
const winHTML=(st,kind)=>`<div class="win" data-a="sc" data-o="window" style="${st}"><div class="sky"></div><span class="sun"></span>${winView(kind)}<div class="bar"></div>${rainHTML()}</div>`;
const clockHTML=st=>`<div class="clk" data-a="sc" data-o="clock" style="${st}"><i class="hh"></i><i class="mh"></i></div>`;
const hudHTML=loc=>`<div class="ngt" id="scN"></div><div class="lmp" id="scL"></div><div class="hud"><span id="scLoc">${loc}</span><span>⚡<span class="enb"><i id="enBar"></i></span> <b id="enV"></b></span></div><div class="cap" id="scCap"></div>`;

const SC={el:null,key:'',mode:''};
function sceneMode(){const st=S.g.st;return st==='work'?'office':st==='commute'?'commute':st==='out'?'street':'home'}
function sceneUpdate(){
  if(FP.on||ui.tab!=='home'||!SC.el||!SC.el.isConnected)return;
  const m=sceneMode(),k=[m,bestHouse().id,bestVeh().id,wxOf(dayIdx()),m==='commute'?S.g.dep:'',S.avatar].join('|');
  if(k!==SC.key){
    SC.key=k;SC.mode=m;SC.el.className='scn sc-'+m;
    SC.el.innerHTML=m==='office'?buildOffice():m==='commute'?buildCommute():m==='street'?buildStreet():buildHome();
    if(m==='office'){renderTasks();const O=offState();O.lunch=null;O.capT=S.g.t+12;cap('💼 Vào làm! Việc mới sẽ hiện trên màn hình của bạn, chạm để xử lý. Mệt thì ra máy ☕.')}
  }
  scCommon(m);
  if(m==='office')offLive();else if(m==='home')homeLive();else if(m==='street')streetLive();else comLive();
}
function scCommon(m){
  const el=SC.el,h=hourF(),wx=wxOf(dayIdx()),sky=skyOf(h,wx),nt=isNight(h);
  el.classList.toggle('nt',nt);
  el.querySelectorAll('.sky').forEach(s=>{if(s.dataset.v!==sky){s.dataset.v=sky;s.style.background=sky}});
  const si=sunIcon();el.querySelectorAll('.sun').forEach(s=>{if(s.textContent!==si)s.textContent=si});
  const mm=mod1440(S.g.t);el.querySelectorAll('.clk').forEach(c=>{c.children[0].style.transform=`rotate(${(mm/60%12)*30}deg)`;c.children[1].style.transform=`rotate(${(mm%60)*6}deg)`});
  const dim=nt?.5:(h<6.5||h>=17.5)?.15:0;let no=0,lo=0;
  if(m==='commute')no=dim;
  else if(m==='office'){no=dim*.35;lo=nt?.45:0}
  else if(sleepHr(h)){no=.62}
  else{no=dim*.55;lo=nt?.8:0}
  const N=$('#scN'),L=$('#scL');if(N)N.style.opacity=no;if(L)L.style.opacity=lo;
  const e=Math.round(S.en);setT('#enV',String(e));
  const b=$('#enBar');if(b){b.style.width=e+'%';b.style.background=e<20?'#ff5252':e<45?'#ffc107':'#9be15d'}
}
function say(x,b,text,ms=3200,key){
  if(!SC.el)return;if(key)SC.el.querySelectorAll(`.bub[data-k="${key}"]`).forEach(e=>e.remove());
  const d=document.createElement('div');d.className='bub';if(key)d.dataset.k=key;
  d.style.left=x+'%';d.style.bottom=b+'%';d.innerHTML=text;SC.el.appendChild(d);const half=d.offsetWidth/SC.el.clientWidth*50+1.5;d.style.left=Math.max(half,Math.min(100-half,x))+'%';setTimeout(()=>d.remove(),ms);
}
function fly(x,b,text,col){if(!SC.el)return;const d=document.createElement('div');d.className='flt';d.style.left=x+'%';d.style.bottom=b+'%';if(col)d.style.color=col;d.textContent=text;SC.el.appendChild(d);setTimeout(()=>d.remove(),1400)}
const cap=t=>setT('#scCap',t);
const meEl=()=>$('#me');
function walkTo(x,b,cb){
  const me=meEl();if(!me){cb&&cb();return}
  const cur=parseFloat(me.style.left)||50,ms=Math.max(450,Math.abs(x-cur)*26);
  me.style.transition=`left ${ms}ms ease-in-out,bottom ${ms}ms ease-in-out`;me.classList.add('walk');
  me.style.left=x+'%';if(b!=null)me.style.bottom=b+'%';
  setTimeout(()=>{me.classList.remove('walk');cb&&cb()},ms);
}
function addEn(n,x,b){S.en=Math.max(0,Math.min(100,S.en+n));if(x!=null)fly(x,b,(n>0?'+':'')+n+' ⚡',n>0?'#e69500':'#c62828');setT('#enV',String(Math.round(S.en)))}

function fpBindInput(){
  if(FP.bound)return;FP.bound=true;const cv=$('#fpCanvas');
  cv.addEventListener('pointerdown',e=>{
    if(!FP.on)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}
    if(e.pointerType!=='mouse'&&FP.joy.id==null&&e.clientX<innerWidth*.45&&e.clientY>innerHeight*.3){FP.joy={id:e.pointerId,cx:e.clientX,cy:e.clientY,x:0,y:0};showJoy(e.clientX,e.clientY);return}
    if(FP.look.id==null)FP.look={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()};
  });
  cv.addEventListener('pointermove',e=>{
    if(e.pointerId===FP.joy.id){let dx=e.clientX-FP.joy.cx,dy=e.clientY-FP.joy.cy;const d=Math.hypot(dx,dy),m=50;if(d>m){dx*=m/d;dy*=m/d}FP.joy.x=dx/m;FP.joy.y=dy/m;knob(dx,dy);return}
    if(e.pointerId===FP.look.id){const dx=e.clientX-FP.look.x,dy=e.clientY-FP.look.y;FP.look.x=e.clientX;FP.look.y=e.clientY;const k=e.pointerType==='mouse'?.0042:.0065;
      FP.yaw-=dx*k;FP.pitch=clamp(FP.pitch-dy*k,-1.25,1.25);if(FP.mode==='commute'){FP.yaw=clamp(FP.yaw,-1.4,1.4);FP.pitch=clamp(FP.pitch,-.6,.5)}
      if(Math.hypot(e.clientX-FP.look.sx,e.clientY-FP.look.sy)>8)FP.dragging=true}
  });
  const up=e=>{
    if(e.pointerId===FP.joy.id){FP.joy={id:null,x:0,y:0};resetJoy();return}
    if(e.pointerId===FP.look.id){const L=FP.look;FP.look={id:null};FP.dragging=false;if(Math.hypot(e.clientX-L.sx,e.clientY-L.sy)<8&&performance.now()-L.t<400)fpTap(e.clientX,e.clientY)}
  };

    if(!FP.on||modalOpts)return;FP.keys[e.code]=true;
    if(FP.sit){if(e.code==='KeyE'||e.code==='Escape'){fpStand();e.preventDefault();return}
      if(/^(Key|Digit|Space)/.test(e.code)&&!e.repeat){const O=offState();if(O.tasks[0])fpDoTask(O.tasks[0].id);e.preventDefault()}return}

  });
  window.addEventListener('keyup',e=>{FP.keys[e.code]=false});
  window.addEventListener('blur',()=>{FP.keys={}});
  $('#fpAct').addEventListener('click',fpInteract);
  $('#fpHorn').addEventListener('click',fpHorn);
  $('#fpTasks').addEventListener('click',e=>{const b=e.target.closest('[data-fpt]');if(b)fpDoTask(b.dataset.fpt)});
}

function fpCollide(nx,nz){
  const r=.3,B=FP.bounds;nx=clamp(nx,B.x1,B.x2);nz=clamp(nz,B.z1,B.z2);
  for(const o of FP.obst){const cx=clamp(nx,o.x1,o.x2),cz=clamp(nz,o.z1,o.z2),dx=nx-cx,dz=nz-cz,d=Math.hypot(dx,dz);
    if(d<r){if(d>1e-6){nx=cx+dx/d*r;nz=cz+dz/d*r}else{const l=nx-o.x1,rr=o.x2-nx,t=nz-o.z1,b=o.z2-nz,m=Math.min(l,rr,t,b);if(m===l)nx=o.x1-r;else if(m===rr)nx=o.x2+r;else if(m===t)nz=o.z1-r;else nz=o.z2+r}}}
  return[nx,nz];
}
function fpWalkFrame(dt){
  FP.roll=0;
  if(FP.sit){FP.cam.position.set(FP.pos.x,FP.eye,FP.pos.z);return}
  const K=modalOpts?{}:FP.keys;let f=0,s=0;
  if(K.KeyW||K.ArrowUp)f+=1;if(K.KeyS||K.ArrowDown)f-=1;if(K.KeyA)s-=1;if(K.KeyD)s+=1;
  if(K.ArrowLeft)FP.yaw+=1.9*dt;if(K.ArrowRight)FP.yaw-=1.9*dt;
  f-=FP.joy.y;s+=FP.joy.x;const len=Math.hypot(f,s);if(len>1){f/=len;s/=len}
  const sp=(K.ShiftLeft||K.ShiftRight)?4:2.4,sy=Math.sin(FP.yaw),cy=Math.cos(FP.yaw);
  const [nx,nz]=fpCollide(FP.pos.x+(-sy*f+cy*s)*sp*dt,FP.pos.z+(-cy*f-sy*s)*sp*dt);FP.pos.x=nx;FP.pos.z=nz;
  const mv=len>.05;FP.bob=(FP.bob||0)+(mv?dt*9:0);
  FP.cam.position.set(nx,FP.eye+(mv?Math.sin(FP.bob)*.035:0),nz);
}

function prettyNum(){const r=rnd();
  if(r<.02)return String(ri(10)).repeat(6);
  if(r<.07)return digits(1)+String(ri(10)).repeat(5);
  const t=ri(7);
  if(t===0){const s=ri(5);return range(s,s+5).join('')}

  sdPick:()=>{const sel=new Set(),draw=()=>{$('#sdGrid').innerHTML=range(1,45).map(n=>`<button class="${sel.has(n)?'on':''}" data-n="${n}">${pad(n)}</button>`).join('');$('#sdCnt').textContent=sel.size};
    modal(`<h2>🌐 Chọn 6 số kỳ quay chung</h2><div class="ng" id="sdGrid" style="--pc:#1565c0"></div><div class="row" style="justify-content:space-between;margin-top:12px"><span>Đã chọn <b id="sdCnt">0</b>/6</span><span class="row"><button class="btn" data-a="closeModal">Thôi</button><button class="btn pri" id="sdOk">Mua · 10 xu</button></span></div>`,{onOpen:()=>{draw();
      $('#sdGrid').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;const n=+b.dataset.n;if(sel.has(n))sel.delete(n);else if(sel.size<6)sel.add(n);draw()};
      $('#sdOk').onclick=()=>{if(sel.size!==6)return toast('Chọn đủ 6 số nha');if(!spend(10))return;S.sd.tk.push({id:uid(),nums:[...sel].sort((a,b)=>a-b),k:sdK()});S.st.n++;track('buy');closeModal(true);toast('✅ Đã mua vé kỳ quay chung');save();render()}}})},
  sdShare:()=>{const k=sdK()-1;copyText(`🎰 Đổi Đời Vé Số – Kỳ quay chung #${k}: ${sdResult(k).nums.map(pad).join(' ')}. Bạn trúng không?`)},
});
/* ================= RULES (Thể lệ) ================= */
const RULES={
 kt:{t:'🎟️ Thể lệ Xổ số Kiến Thiết (miền Nam)',b:`<ul class="rl"><li>Vé in sẵn <b>6 chữ số</b>, mỗi vé 10 xu. Vé thuộc kỳ quay kế tiếp của đài đang bán.</li>
<li>Mỗi kỳ xổ <b>18 lô giải</b>: Đặc biệt (1), Nhất (1), Nhì (1), Ba (2), Tư (7), Năm (1), Sáu (3), Bảy (1), Tám (1).</li>
<li><b>Dò từ phải sang trái</b>: vé trúng khi các chữ số cuối trùng khớp số giải:<br>Giải Tám: 2 số cuối · Giải Bảy: 3 số cuối · Giải Sáu, Năm: 4 số cuối · Giải Tư, Ba, Nhì, Nhất: 5 số cuối · Đặc biệt: đúng cả 6 số.</li>
<li><b>Phụ đặc biệt</b>: sai chữ số đầu tiên nhưng đúng 5 số cuối của giải Đặc biệt.</li>
<li><b>Khuyến khích</b>: đúng chữ số đầu tiên của giải Đặc biệt và chỉ sai 1 trong 5 chữ số còn lại.</li>
<li>Một vé trúng nhiều giải thì được lãnh tất cả. Dịp Tết Nguyên Đán, giải Kiến Thiết được nhân đôi.</li></ul>`},
 mega:{t:'🔴 Thể lệ Mega 6/45',b:`<ul class="rl"><li>Chọn <b>6 số từ 01 đến 45</b> (mỗi bộ 10 xu). Quay ra 6 số, <b>không cần đúng thứ tự</b>.</li>
<li>Trùng 6 số: <b>Jackpot</b> (từ 12.000.000 xu, cộng dồn nếu chưa ai trúng; nhiều người trúng thì chia đều).</li>
<li>Trùng 5 số: Giải Nhất · Trùng 4 số: Giải Nhì · Trùng 3 số: Giải Ba.</li>
<li><b>Chơi bao</b>: chọn 7–10 số, game tự tách thành mọi bộ 6 số có thể (bao 7 = 7 bộ, bao 8 = 28 bộ…), mỗi bộ dò riêng.</li></ul>`},
 power:{t:'🟠 Thể lệ Power 6/55',b:`<ul class="rl"><li>Chọn <b>6 số từ 01 đến 55</b> (mỗi bộ 10 xu). Quay ra 6 số chính + <b>1 số đặc biệt</b>.</li>
<li>Trùng 6 số chính: <b>Jackpot 1</b> (từ 30.000.000 xu, cộng dồn).</li>
<li>Trùng 5 số chính và bộ số của bạn có chứa <b>số đặc biệt</b>: <b>Jackpot 2</b> (từ 3.000.000 xu, cộng dồn).</li>
<li>Trùng 5 số: Giải Nhất · Trùng 4 số: Giải Nhì · Trùng 3 số: Giải Ba.</li>
<li>Jackpot nhiều người trúng thì chia đều. Được chơi bao 7–10 số như Mega.</li></ul>`},
 lotto:{t:'🟣 Thể lệ Lotto 5/35',b:`<ul class="rl"><li>Chọn <b>5 số chính từ 01 đến 35</b> và <b>1 số đặc biệt từ 01 đến 12</b> (10 xu).</li>
<li>Quay 5 số chính từ lồng 35 bóng và 1 số đặc biệt từ lồng 12 bóng riêng.</li>
<li>5 số chính + số ĐB: <b>Độc đắc</b> (từ 6.000.000 xu, cộng dồn) · 5 số: Nhất · 4 số + ĐB: Nhì · 4 số: Ba · 3 số + ĐB: Tư · 3 số: Năm.</li>
<li>Chỉ cần <b>trùng số đặc biệt</b> (dưới 3 số chính): Khuyến khích.</li></ul>`},
 max3d:{t:'🟢 Thể lệ Max 3D',b:`<ul class="rl"><li>Chọn <b>1 số có 3 chữ số</b> từ 000 đến 999 (10 xu).</li>
<li>Mỗi kỳ quay <b>20 số</b>: Đặc biệt 2 số, Nhất 4 số, Nhì 6 số, Ba 8 số.</li>
<li>Trúng khi số của bạn <b>trùng đúng cả 3 chữ số và đúng thứ tự</b> với một số giải.</li>
<li>Số của bạn xuất hiện ở nhiều giải thì được cộng tất cả. Giải thưởng cố định, không chia.</li></ul>`},
 shared:{t:'🌐 Thể lệ Kỳ quay chung',b:`<ul class="rl"><li>Chọn <b>6 số từ 01 đến 45</b> (10 xu), chọn nhanh hoặc tự chọn.</li>
<li>Quay mỗi giờ theo <b>giờ thật</b> (vé mua trong giờ nào thuộc kỳ quay lúc hết giờ đó). Kết quả tự dò và trả thưởng.</li>
<li><b>Mọi người chơi đều ra cùng một kết quả</b>, rủ bạn bè cùng dò.</li>
<li>Trùng 6 số: 500.000 xu · 5 số: 10.000 · 4 số: 300 · 3 số: 30 (giải cố định, không cần đúng thứ tự).</li></ul>`}};
function showRules(p){const R=RULES[p];if(!R)return;
  modal(`<h2>${R.t}</h2>${R.b}${PRIZE_INFO[p]?`<h3 style="margin-top:12px">💰 Cơ cấu giải thưởng (xu / vé 10 xu)</h3><div class="kv" style="margin-top:6px">${PRIZE_INFO[p].map(x=>`<span>${x[0]}</span><b>${x[1]}</b>`).join('')}</div>`:''}
  <div class="muted" style="margin-top:10px">Mở thưởng: dùng lượt miễn phí (tặng mỗi giờ chẵn) hoặc trả ${DRAW_FEE} xu để mở ngay. Kết quả tự dò cho tất cả vé của bạn trong kỳ.</div>
  <button class="btn pri block" data-a="closeModal">Đã hiểu</button>`)}
ACT.rules=el=>showRules(el.dataset.p);
function avPicker(id,cur){return`<div class="row" id="${id}">${AVATARS.map(a=>`<button class="avb ${a===cur?'on':''}" data-av="${a}">${a}</button>`).join('')}</div>`}
function bindAv(id){$('#'+id).onclick=e=>{const b=e.target.closest('[data-av]');if(!b)return;$('#'+id).querySelectorAll('.avb').forEach(x=>x.classList.toggle('on',x===b))}}
function openSettings(){
  modal(`<h2>⚙️ Cài đặt</h2>
   <label class="lbl">Tên nhân vật</label><input class="inp" id="stName" maxlength="20" value="${esc(S.name)}">
   <label class="lbl">Hình đại diện</label>${avPicker('stAv',S.avatar)}${lookHTML()}
   <label class="chk"><input type="checkbox" id="stSound" ${S.set.sound?'checked':''}> Âm thanh</label>
   <label class="chk"><input type="checkbox" id="stScratch" ${S.set.scratch?'checked':''}> Cào vé để xem kết quả (tối đa 30 vé/kỳ)</label>
   <button class="btn pri block" data-a="saveSettings">Lưu cài đặt</button>
   <hr><h3>💾 Sao lưu dữ liệu</h3><p class="muted">Dữ liệu được lưu trong trình duyệt này. Sao chép mã để chuyển sang máy khác hoặc phòng khi lỡ xóa.</p>
   <button class="btn sm" data-a="copyBackup">📋 Lấy mã sao lưu</button>
   <textarea class="inp" id="bkTxt" rows="3" placeholder="Dán mã sao lưu vào đây rồi bấm Khôi phục…" style="margin-top:8px;font-size:12px"></textarea>
   <div class="row" style="margin-top:8px"><button class="btn sm" data-a="restore">♻️ Khôi phục</button><button class="btn sm" data-a="reset" style="color:var(--red)">🗑️ Chơi lại từ đầu</button></div>
   <button class="btn block" data-a="closeModal">Đóng</button>`,{onOpen:()=>{bindAv('stAv');bindLook()}});
}
function onboarding(){
  modal(`<div style="text-align:center;font-size:54px;line-height:1">🎰</div><h2 class="disp" style="font-size:28px;text-align:center;color:var(--red)">Đổi Đời Vé Số</h2>
   <p class="muted" style="text-align:center">Hóa thân thành nhân viên văn phòng lương 5.000 xu/tháng, mua vé số và chờ ngày đổi đời!</p>
   <label class="lbl">Tên nhân vật</label><input class="inp" id="obName" maxlength="20" placeholder="Nhập tên của bạn">
   <label class="lbl">Chọn hình</label>${avPicker('obAv','🧑')}
   <div class="card" style="margin-top:14px;font-size:13px;line-height:1.6;margin-bottom:0">
   🪙 Cứ 5 phút (giờ thật) tích được <b>20 xu</b>, mỗi vé <b>10 xu</b>.<br>
   🎁 Mỗi giờ chẵn được tặng 1 lượt mở thưởng miễn phí, muốn mở ngay thì tốn <b>20 xu</b>.<br>
   ⏱️ 1 phút thật = 1 giờ trong game: ca làm 8 tiếng chỉ mất 8 phút.<br>
   🏠 Đi làm đủ công, lãnh lương cuối tháng rồi mua nhà, mua xe!<br>👆 Chạm vào đồ vật, đồng nghiệp trong khung cảnh để tương tác.<br>👁️ Bấm <b>Nhập vai</b> để vào góc nhìn thứ nhất 3D toàn màn hình.</div>
   <button class="btn pri block" id="obGo">Bắt đầu 🚀</button>`,{locked:true,onOpen:()=>{bindAv('obAv');
     $('#obGo').onclick=()=>{const n=($('#obName').value.trim()||'Tèo').slice(0,20),a=document.querySelector('#obAv .on');S=newState(n,a?a.dataset.av:'🧑');lookOf();addLog('Bắt đầu cuộc đời mới với 200 xu');save();closeModal(true);boot();toast('🎁 Tặng bạn 200 xu và 1 lượt mở thưởng để khởi nghiệp!',4000)}}});
}
function boot(){ui.tab='home';lastTopSig='';render();tick();if(!timer)timer=setInterval(tick,1000)}
load();
if(S){boot();}else onboarding();
</script>
</body>
</html>
