function fresh(name='Nông trại An Nhiên'){return{version:VERSION,name,coins:650,xp:0,clock:0,lastReal:Date.now(),revision:0,started:false,sound:false,inventory:{apple:6,egg:4,milk:3,strawberry:4,rose:3,sunflower:3},plots:Array.from({length:8},(_,i)=>i===0?{type:'apple',at:-80,watered:true}:null),flowers:Array.from({length:6},(_,i)=>i===0?{type:'rose',at:-60,watered:true}:null),animals:[{id:uid(),type:'chicken',name:'Bông',trait:'Dễ gần',affection:10,at:-70,fed:true,petDay:-1}],decor:[null,null,null,null,null],decorStock:{},listings:[],offers:[],jobs:[],relations:[0,0,0,0],collected:['apple','egg','milk','strawberry','rose','sunflower'],stats:{harvest:0,sales:0,crafts:0,flowers:0,breed:0,earned:0},claimed:[],collectionClaimed:[],upgrades:{land:0,bees:false,kitchen:0},honeyAt:0,orchidSeeds:0,nextBuyer:20,nextEvent:65,event:null,log:[],request:{npc:0,item:'egg',qty:3,reward:72,done:0,next:0},gifts:[],tips:0}}
function validate(s){
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k),finite=(v,min=0,max=1e12)=>Number.isFinite(v)&&v>=min&&v<=max,int=(v,min=0,max=1e9)=>Number.isInteger(v)&&finite(v,min,max),obj=o=>o&&typeof o==='object'&&!Array.isArray(o),str=(v,max=100)=>typeof v==='string'&&v.length<=max,fail=()=>{throw Error('Tệp sao lưu thiếu dữ liệu hoặc không đúng định dạng game.')};

for(const [k,v]of Object.entries(s.inventory))if(!own(ITEMS,k)||!int(v))fail();
for(const [k,v]of Object.entries(s.decorStock))if(!own(DECORS,k)||!int(v))fail();
for(const [key,zone]of [['plots','tree'],['flowers','flower']])for(const p of s[key])if(p&&(!own(CROPS,p.type)||CROPS[p.type].zone!==zone||!finite(p.at,-1e12)||typeof p.watered!=='boolean'))fail();
for(const a of s.animals)if(!obj(a)||!own(ANIMALS,a.type)||!str(a.id,30)||!str(a.name,24)||!TRAITS.includes(a.trait)||!finite(a.at,-1e12)||!int(a.affection)||!int(a.petDay,-1)||typeof a.fed!=='boolean')fail();

for(const k of ['harvest','sales','crafts','flowers','breed','earned'])if(!int(s.stats[k],0,1e12))fail();

if(!int(s.orchidSeeds)||!finite(s.honeyAt)||s.relations.some(n=>!int(n))||!finite(s.nextBuyer)||!finite(s.nextEvent))fail();

function load(n){let raw;try{raw=localStorage.getItem(KEY+n);return raw?validate(JSON.parse(raw)):null}catch(e){if(raw){try{localStorage.setItem(KEY+n+'-recovery',raw)}catch(ignore){}}return null}}
state=load(slot)||fresh();
function level(){return Math.floor(Math.sqrt(state.xp/45))+1}function season(){return SEASONS[Math.floor(state.clock/720)%4]}function day(){return Math.floor(state.clock/180)+1}function unlocked(i){return i<4+state.upgrades.land*2}function qty(k){return state.inventory[k]||0}function add(k,n){state.inventory[k]=qty(k)+n;if(!state.collected.includes(k))state.collected.push(k)}function has(need){return Object.entries(need).every(([k,n])=>qty(k)>=n)}function spendNeed(need){Object.entries(need).forEach(([k,n])=>state.inventory[k]-=n)}function xp(n){state.xp+=n}function cost(n){if(state.coins<n){toast('Chưa đủ xu. Thử bán nông sản hoặc nhận thưởng nhiệm vụ nhé.',true);return false}state.coins-=n;return true}function log(t){state.log.unshift({t:state.clock,text:t});state.log=state.log.slice(0,25)}
function save(){if(paused)return;try{state.lastReal=Date.now();state.revision=Date.now();saveStamp=state.revision;localStorage.setItem(KEY+slot,JSON.stringify(state));localStorage.setItem(SLOTKEY,String(slot));saveFailed=false}catch(e){if(!saveFailed)toast('Trình duyệt không lưu được. Hãy xuất bản sao lưu trong Cài đặt.',true);saveFailed=true}}
function sound(type='tap'){if(!state.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const notes=type==='win'?[523,659,784]:type==='coin'?[880,1175]:[440];notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.085;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.24)})}catch(e){}}
function toast(t,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=t;$('#toasts').append(el);setTimeout(()=>el.remove(),4200)}
function niceTime(s){s=Math.max(0,Math.ceil(s));return s<60?s+' giây':Math.floor(s/60)+'p '+s%60+'s'}function price(k){return Math.round(ITEMS[k].price*(season().boost.includes(k)?1.2:1)*(state.event?.type==='festival'?1.15:1))}function reqText(need){return Object.entries(need).map(([k,n])=>`${ITEMS[k].icon} ${n} ${ITEMS[k].name} <small>(${qty(k)}/${n})</small>`).join(' · ')}
function cropDuration(p){return CROPS[p.type].time*(p.watered?.75:1)}function ready(p){return p&&state.clock-p.at>=cropDuration(p)}function animalReady(a){return a.fed&&state.clock-a.at>=ANIMALS[a.type].time}function progress(p){return clamp((state.clock-p.at)/cropDuration(p),0,1)}function questValue(q){return q.id==='level'?level():q.id==='decor'?state.decor.filter(Boolean).length:state.stats[q.id]||0}
function marketOffer(){if(state.offers.length>=5)return;const available=state.listings.filter(l=>!state.offers.some(o=>o.listing===l.id));if(!available.length)return;const l=rand(available);if(l.price>price(l.item)*1.65&&Math.random()<.8)return;let np=NPCS.map((p,i)=>({p,i})).filter(n=>n.p.likes.includes(l.item));const npc=rand(np.length?np:NPCS.map((p,i)=>({p,i}))).i;const budget=price(l.item)*(1.05+Math.min(state.relations[npc],100)/300);const offered=Math.round(Math.min(l.price,budget*(.88+Math.random()*.32)));state.offers.push({id:uid(),listing:l.id,npc,qty:Math.min(l.qty,1+Math.floor(Math.random()*4)),price:Math.max(1,offered),countered:false});log(`${NPCS[npc].name} gửi đề nghị mua ${ITEMS[l.item].name}.`);if(page!=='market')toast(`${NPCS[npc].icon} ${NPCS[npc].name} đang đợi ở quầy thu mua.`)}
function makeEvent(){const type=rand(['tour','rain','merchant','duck','festival']);state.event={type,until:state.clock+100,claimed:false};if(type==='rain'){[...state.plots,...state.flowers].filter(Boolean).forEach(p=>p.watered=true)}log('Sự kiện: '+eventInfo().title);toast(eventInfo().title)}

function advance(dt,offline=false){state.clock+=Math.max(0,dt);let expired=state.listings.filter(l=>l.until<=state.clock);expired.forEach(l=>{add(l.item,l.qty);state.offers=state.offers.filter(o=>o.listing!==l.id)});state.listings=state.listings.filter(l=>l.until>state.clock);if(expired.length)log('Tin bán hết hạn: sản phẩm đã được trả về kho.');if(state.event&&state.event.until<=state.clock)state.event=null;if(state.clock>=state.nextBuyer){marketOffer();state.nextBuyer=state.clock+20+Math.random()*15}if(state.clock>=state.nextEvent){if(!offline)makeEvent();state.nextEvent=state.clock+100+Math.random()*70}if(state.request.done&&state.clock>=state.request.next)newRequest()}

gLabel(x,y-53,ITEMS[ANIMALS[a.type].item].icon+' ✦','#fff4cf'):!a.fed?svgLabel(x,y-51,'Cần thức ăn'):''}</g>`});const dpos=[[82,235],[382,252],[407,450],[642,474],[265,496]];dpos.forEach(([x,y],i)=>{decor+=`<g tabindex="0" role="button" aria-label="Góc trang trí ${i+1}" data-act="decorPlace" data-i="${i}">${state.decor[i]?decoArt(x,y,state.decor[i]):`<ellipse class="hit" cx="${x}" cy="${y}" rx="20" ry="9" fill="${placing?'#ffe1a0':'#b3ca90'}" opacity="${placing?1:.4}" stroke="${placing?'#b99950':'#a1bb7e'}" stroke-dasharray="3 4"/><text x="${x}" y="${y+4}" font-size="13" text-anchor="middle" fill="#819c64">+</text>`}</g>`});return `<svg class="scene" style="--phase:-${state.clock%1000}s" viewBox="0 0 720 545" preserveAspectRatio="xMidYMid meet" aria-label="Bản đồ nông trại tương tác"><defs><pattern id="grass" width="43" height="37" patternUnits="userSpaceOnUse"><path d="M8 19l-2-5m3 5 3-7M32 32l-2-4" stroke="#98b879" stroke-width="1.3" opacity=".5"/><circle cx="24" cy="12" r="1.3" fill="#e7edbb"/></pattern><pattern id="roof" width="16" height="11" patternUnits="userSpaceOnUse"><path d="M0 9h16M8 0v9" stroke="#b97d61" stroke-width="1" opacity=".5"/></pattern></defs><rect width="720" height="545" fill="${season().sky}"/><path d="M0 90Q120 5 250 65T510 50T720 62V225H0" fill="#ccddb4"/><path d="M0 131Q110 70 220 120T470 94T720 106V270H0" fill="#b9d09d"/><path d="M0 195Q120 140 300 178T720 162V545H0" fill="#c6d9a7"/><rect y="180" width="720" height="365" fill="url(#grass)"/><g class="cloud" fill="#f9fae9" opacity=".7"><ellipse cx="115" cy="85" rx="39" ry="10"/><ellipse cx="102" cy="77" rx="18" ry="13"/><ellipse cx="126" cy="74" rx="21" ry="16"/><ellipse cx="542" cy="73" rx="40" ry="8"/><ellipse cx="536" cy="65" rx="21" ry="14"/></g><g opacity=".8">${treeArt(28,224,'apple',.88,false)}${treeArt(686,203,'apple',1.1,false)}${treeArt(48,140,'apple',.5,false)}${treeArt(644,148,'apple',.7,false)}</g><path d="M253 212Q347 231 381 307T447 544" stroke="#b9b58e" stroke-width="48" f const NAV=[['farm','⌂','Nông trại'],['market','⚖','Chợ nông sản'],['workshop','♨','Xưởng chế biến'],['shop','♧','Cửa hàng'],['journal','☷','Sổ tay'],['settings','⚙','Cài đặt']];
function render(){const lv=level(),base=45*(lv-1)**2,next=45*lv**2,offers=state.offers.length,s=season();$('#app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">🌱</div><div><strong>Mùa<br>An Nhiên</strong><small>A little farm, a little joy</small></div></div><nav class="nav" aria-label="Điều hướng chính">${NAV.map(([id,ico,label])=>`<button data-act="nav" data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><i>${ico}</i><span>${label}${id==='market'&&offers?' · '+offers:''}</span></button>`).join('')}</nav><div class="side-bottom"><div class="season-card"><div class="label" style="color:#c1cea9">Nhịp sống bốn mùa</div><strong>${s.icon} Mùa ${s.name.toLowerCase()}</strong><p>${s.desc}</p><div class="mini-progress" style="background:#ffffff16"><span style="width:${(state.clock%720)/7.2}%;background:#b4c18d"></span></div></div><div class="side-footer">Một mảnh vườn. Ngàn niềm vui.<br>✦ ${saveFailed?'Chưa lưu được — hãy sao lưu':paused?'Đang tạm dừng':'Tự động lưu · Ô '+slot}</div></div></aside><div class="main"><header class="topbar"><div class="farm-name"><div class="avatar">👩🏻‍🌾</div><div><b>${esc(state.name)}</b><small>Ngày ${day()} · ${s.icon} Mùa ${s.name.toLowerCase()}</small></div></div><div class="wallet"><div class="level"><span style="font-size:22px;color:#b79a53">✦</span><div style="width:88px"><b>Cấp ${lv}</b><div class="bar" style="margin-top:6px"><span style="width:${(state.xp-base)/(next-base)*100}%"></span></div></div></div><div class="currency">🪙 <span id="coins">${num(state.coins)}</span></div><button class="icon-btn" data-act="sound" aria-label="${state.sound?'Tắt':'Bật'} âm thanh" title="Âm thanh">${state.sound?'♫':'♪'}</button><button class="icon-btn" data-act="help" aria-label="Hướng dẫn chơi">?</button></div></header><main class="content" id="page-content">${({farm:farmPage,market:marketPage,workshop:workshopPage,shop:shopPage,journal:journalPage,settings:settingsPage})[page]()}</main></div></div>`;if(paused)$('#page-content').insertAdjacentHTML('afterbegin','<div class="hint">⏸ Tiến trình đang tạm dừng vì ô lưu đã được mở ở tab khác. Hãy tải lại trang để nhận dữ liệu mới nhất.</div>')}
function head(eye,title,sub,extra=''){return `<div class="heading"><div><div class="eyebrow">${eye}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${extra}</div>`}
function farmPage(){const pending=QUESTS.filter(q=>!state.claimed.includes(q.id)).slice(0,3),req=state.request,npc=NPCS[req.npc],e=eventInfo(),rCount=[...state.plots,...state.flowers].filter(ready).length+state.animals.filter(animalReady).length;return `${head('Chậm lại một chút, vui thêm một chút','Một ngày ở nông trại','Nắng đã lên. Mình cùng chăm chút khu vườn nhỏ nhé.',`<span class="pill">${season().icon} Ngày ${day()} · Cấp ${level()}</span>`)}${placing?`<div class="decorating">Đang đặt ${DECORS[placing].icon} ${DECORS[placing].name}. Chạm một dấu + trên bản đồ.<button class="link" data-act="cancelPlace">Hủy</button></div>`:''}<div class="layout"><div><div class="farm-card"><div class="farm-toolbar"><div class="weather">${state.event?.type==='rain'?'🌦️ Mưa nhẹ':'☀️ Trời trong lành'}<strong>${rCount?rCount+' nơi đang chờ thu hoạch':'Cây lớn lên từng chút một'}</strong></div><button class="weather" style="pointer-events:auto;color:#506c42" data-act="mapZoom">⤢ Phóng to vườn</button></div>${farmSVG()}<div class="farm-footer"><span>Chạm cây, luống hoa hoặc vật nuôi để chăm sóc</span><div class="legend"><span><i class="dot"></i>Đang lớn</span><span><i class="dot gold"></i>Sẵn sàng</span></div></div></div><div class="quick-grid"><button class="quick" data-act="harvestAll"><em>🧺</em><span><b>Thu hoạch</b><small>Gom những điều ngọt lành</small></span></button><button class="quick" data-act="waterAll"><em>💧</em><span><b>Tưới cả vườn</b><small>Cây lớn nhanh hơn 25%</small></span></button><button class="quick" data-act="feedAll"><em>🌾</em><span><b>Cho ăn</b><small>5 xu / một vật nuôi</small></span></button><button class="quick" data-act="inventory"><em>📦</em><span><b>Kho của tui</b><small>${Object.values(state.inventory).reduce((a,b)=>a+b,0)} sản phẩm đang có</small></span></button></div></div><aside class="rail"><div class="panel"><div class="panel-head"><h3>Việc nhỏ hôm nay</h3><span>☷</span></div>${pending.length?pending.map(q=>`<div class="quest-row"><span class="check">${questValue(q)>=q.goal?'✓':'·'}</span><div style="flex:1"><b>${q.title}</b><small>${Math.min(q.goal,questValue(q))}/${q.goal} · Thưởng ${q.reward} xu</small></div>${questValue(q)>=q.goal?`<button class="btn tiny gold" data-act="claimQuest" data-id="${q.id}">Nhận</button>`:''}</div>`).join(''):'<p class="sub">Bà đã hoàn thành mọi cột mốc! Cứ tiếp tục tạo khu vườn của riêng mình.</p>'}<button class="link" data-act="nav" data-page="journal" style="margin-top:17px">Mở sổ tay →</button></div><div class="panel"><div class="panel-head"><span class="label">${req.done?'Lời cảm ơn':'Một lời nhắn nhỏ'}</span><span style="color:#b39258">♡</span></div><div class="visitor"><div class="portrait">${npc.icon}</div><div><b style="font-size:14px">${npc.name}</b><small style="display:block;margin-top:4px">${npc.role}</small></div></div><div class="speech">${req.done?'“Cảm ơn nông trại nhé. Hẹn gặp lại ở đơn hàng tiếp theo!”':`“${npc.line} Mình cần ${req.qty} ${ITEMS[req.item].name.toLowerCase()}.”`}</div>${req.done?`<small>Lời nhắn mới sau ${niceTime(req.next-state.clock)}</small>`:`<div class="row" style="font-size:12px;margin-bottom:13px"><span>${ITEMS[req.item].icon} ${qty(req.item)}/${req.qty} đang có</span><span class="price">+${req.reward} xu</span></div><button class="btn full" data-act="request" ${qty(req.item)<req.qty?'disabled':''}>Giao đơn hàng</button><button class="link" style="margin-top:10px" data-act="skipRequest">Đổi lời nhắn (miễn phí)</button>`}</div><div class="panel tip-panel"><div class="label">Lời thì thầm của khu vườn</div><p class="sub" style="line-height:1.9">${sTip()}</p></div></aside></div><div class="notice"><span style="font-size:25px">${e.icon}</span><div style="flex:1"><strong>${e.title}</strong><br>${e.desc}</div>${state.event?`<button class="btn tiny secondary" data-act="event">Xem</button>`:'<button class="link" data-act="nav" data-page="market">Ghé chợ →</button>'}</div>`}
function sTip(){return ['Hoa không chỉ để ngắm. Một bó hoa đồng nội cần hồng, hướng dương và tulip.','Cây ăn quả lâu năm sẽ tiếp tục ra trái. Dâu tây và hoa cần trồng lại sau khi thu hoạch.','Khách sẽ cân nhắc giá bà đăng. Giá gần mức tham khảo giúp tìm người mua dễ hơn.','Hai luống hoa khác loại đang nở có thể lai thành hạt lan ngọc.','Bà có thể nghỉ chơi bất cứ lúc nào. Cây và vật nuôi sẽ luôn an toàn chờ bà về.'][Math.floor(state.clock/60)%5]}
function marketPage(){return `${head('Từ khu vườn đến những căn bếp','Chợ nông sản','Đăng một tin nhỏ, đón những vị khách dễ thương.',`<button class="btn" data-act="newListing">＋ Đăng bán</button>`)}<div class="tabs"><button class="tab ${marketTab==='listings'?'active':''}" data-act="marketTab" data-tab="listings">Tin đang bán (${state.listings.length}/8)</button><button class="tab ${marketTab==='offers'?'active':''}" data-act="marketTab" data-tab="offers">Khách thu mua (${state.offers.length})</button><button class="tab ${marketTab==='prices'?'active':''}" data-act="marketTab" data-tab="prices">Bảng giá mùa vụ</button></div>${marketTab==='listings'?`<div class="hint">📣 Hàng được giữ riêng khi đăng tin. Khách NPC thường gửi đề nghị sau 20–35 giây; tin tồn tại 15 phút. Hủy hoặc hết hạn sẽ trả hàng về kho.</div><div class="page-grid">${state.listings.map(l=>`<article class="item-card"><div class="row"><span class="item-icon">${ITEMS[l.item].icon}</span><span class="badge">${niceTime(l.until-state.clock)}</span></div><h3>${ITEMS[l.item].name}</h3><p>${l.qty} sản phẩm đang chờ khách · Tham khảo ${price(l.item)} xu / sản phẩm</p><div class="row"><span class="price">${num(l.price)} xu / SP</span><button class="btn tiny secondary" data-act="cancelListing" data-id="${l.id}">Gỡ tin</button></div></article>`).join('')}</div>${!state.listings.length?'<div class="empty">🪧<br>Quầy hàng còn trống. Đăng bán vài trái táo hoặc trứng trong kho để đón khách đầu tiên.</div>':''}`:marketTab==='offers'?`<div class="page-grid">${state.offers.map(o=>{const l=state.listings.find(l=>l.id===o.listing);if(!l)return '';const n=NPCS[o.npc];return `<article class="item-card"><div class="visitor"><span class="portrait">${n.icon}</span><div><h3 style="margin:0">${n.name}</h3><small>${n.role}</small></div></div><div class="speech">“Cho mình ${o.qty} ${ITEMS[l.item].name.toLowerCase()} nhé. ${o.price>=l.price?'Mình đồng ý giá bà đăng!':'Giá này bà thấy được không?'}”</div><div class="row"><span>${ITEMS[l.item].icon} ${o.qty} × ${o.price} xu</span><b class="price">${num(o.qty*o.price)} xu</b></div><p>Giá đăng: ${l.price} xu/SP · Thiện cảm: ${state.relations[o.npc]} ♡</p><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn tiny" data-act="acceptOffer" data-id="${o.id}">Đồng ý bán</button><button class="btn tiny secondary" data-act="counterOffer" data-id="${o.id}" ${o.countered?'disabled':''}>${o.countered?'Đã thương lượng':'Đề nghị +10%'}</button><button class="link" data-act="rejectOffer" data-id="${o.id}">Từ chối</button></div></article>`}).join('')}</div>${!state.offers.length?'<div class="empty">🍃<br>Chưa có khách chờ. Đăng tin bán rồi thong thả chăm vườn; game sẽ báo khi khách đến.</div>':''}`:`<div class="hint">${season().icon} Mùa ${season().name.toLowerCase()}: sản phẩm đúng mùa tăng 20% giá tham khảo. Giá là gợi ý; bà tự quyết định giá đăng bán.</div><div class="page-grid">${Object.entries(ITEMS).map(([k,it])=>`<div class="item-card"><div class="row"><span style="font-size:30px">${it.icon}</span>${season().boost.includes(k)?'<span class="badge">↑ Đúng mùa +20%</span>':''}</div><h3>${it.name}</h3><div class="row"><b class="price">${price(k)} xu</b><small>Kho: ${qty(k)}</small></div></div>`).join('')}</div>`}<div class="notice">💡 Khách mua có ngân sách riêng. Giá quá cao sẽ khó bán; khách quen sẵn lòng trả tốt hơn.</div>`}
function workshopPage(){return `${head('Một chút khéo tay, thêm nhiều hương vị','Xưởng chế biến','Làm mứt từ trái chín, gói yêu thương trong một bó hoa.',`<span class="pill">♨ ${state.jobs.length}/${2+state.upgrades.kitchen} bàn đang dùng</span>`)}<div class="panel" style="margin-bottom:20px"><div class="panel-head"><h3>Đang làm trong xưởng</h3><small>Nguyên liệu được dùng khi bắt đầu</small></div>${state.jobs.length?state.jobs.map(j=>`<div class="list-row"><span style="font-size:29px">${ITEMS[j.item].icon}</span><div style="flex:1"><b>${ITEMS[j.item].name}</b><div class="mini-progress"><span style="width:${clamp(1-(j.until-state.clock)/RECIPES[j.item].time,0,1)*100}%"></span></div></div>${j.until<=state.clock?`<button class="btn tiny gold" data-act="collectJob" data-id="${j.id}">Nhận sản phẩm</button>`:`<span class="badge">${niceTime(j.until-state.clock)}</span>`}</div>`).join(''):'<p class="sub">Căn bếp đang đợi mẻ đầu tiên. Chọn một công thức bên dưới nhé.</p>'}</div><div class="page-grid">${Object.entries(RECIPES).map(([k,r])=>`<article class="item-card ${level()<r.level?'locked':''}"><div class="row"><span class="item-icon">${ITEMS[k].icon}</span><span class="badge">${level()<r.level?'Cấp '+r.level:niceTime(r.time)}</span></div><h3>${ITEMS[k].name}</h3><p>${reqText(r.need)}</p><div class="row"><span class="price">≈ ${price(k)} xu</span><button class="btn tiny" data-act="craft" data-item="${k}" ${level()<r.level||!has(r.need)||state.jobs.length>=2+state.upgrades.kitchen?'disabled':''}>Bắt đầu làm</button></div></article>`).join('')}</div>`}
function shopPage(){const buttons=[['seeds','🌱 Giống cây'],['animals','🐄 Vật nuôi'],['decor','⛲ Trang trí'],['upgrades','🔨 Mở rộng']];return `${head('Ươm một mầm xanh mới','Cửa hàng đầu làng','Chọn điều bà thích, rồi làm khu vườn lớn lên theo cách của mình.')}<div class="tabs">${buttons.map(([k,n])=>`<button class="tab ${shopTab===k?'active':''}" data-act="shopTab" data-tab="${k}">${n}</button>`).join('')}</div>${shopTab==='seeds'?`<div class="hint">Chạm ô đất trống trên bản đồ để mua và trồng trực tiếp. Cây ăn quả lâu năm mua một lần; hoa và dâu tây trồng lại mỗi vụ.</div><div class="page-grid">${Object.entries(CROPS).map(([k,c])=>`<article class="item-card ${level()<c.level?'locked':''}"><span class="item-icon">${ITEMS[k].icon}</span><h3>${ITEMS[k].name}</h3><p>${c.zone==='tree'&&!c.single?'Cây lâu năm · Ra trái nhiều vụ':'Trồng lại sau mỗi vụ'}<br>${niceTime(c.time)} · ${c.qty} sản phẩm/vụ${k==='orchid'?'<br>Nhận hạt bằng lai hoa hoặc thương nhân.':''}</p><div class="row"><span class="price">${k==='orchid'?state.orchidSeeds+' hạt đang có':c.cost+' xu / giống'}</span><button class="btn tiny secondary" data-act="goPlant" data-zone="${c.zone}" ${level()<c.level?'disabled':''}>${level()<c.level?'Cấp '+c.level:'Ra vườn'}</button></div></article>`).join('')}</div>`:shopTab==='animals'?`<div class="hint">Chuồng tối đa 6 vật nuôi. Một khẩu phần ăn giá 5 xu; vuốt ve miễn phí mỗi ngày giúp tăng thân thiết và sản lượng.</div><div class="page-grid">${Object.entries(ANIMALS).map(([k,a])=>`<article class="item-card ${level()<a.level?'locked':''}"><span class="item-icon">${a.icon}</span><h3>${a.name}</h3><p>Cho ${ITEMS[a.item].icon} ${ITEMS[a.item].name.toLowerCase()} mỗi ${niceTime(a.time)} sau khi ăn. Không mất vật nuôi khi nghỉ chơi.</p><div class="row"><span class="price">${a.cost} xu</span><button class="btn tiny" data-act="buyAnimal" data-type="${k}" ${level()<a.level||state.animals.length>=6?'disabled':''}>${level()<a.level?'Cấp '+a.level:'Đón về'}</button></div></article>`).join('')}</div>`:shopTab==='decor'?`<div class="hint">Mua đồ, chọn “Đặt vào vườn”, rồi chạm một trong 5 vị trí dấu +. Có thể cất và bố trí lại miễn phí.</div><div class="page-grid">${Object.entries(DECORS).map(([k,d])=>`<article class="item-card"><span class="item-icon">${d.icon}</span><h3>${d.name}</h3><p>Đang cất: ${state.decorStock[k]||0} · Đã đặt: ${state.decor.filter(v=>v===k).length}</p><div class="row"><span class="price">${d.cost} xu</span><button class="btn tiny" data-act="buyDecor" data-item="${k}">Mua</button></div>${state.decorStock[k]?`<button class="btn tiny secondary full" style="margin-top:10px" data-act="place" data-item="${k}">Đặt vào vườn</button>`:''}</article>`).join('')}</div>`:`<div class="page-grid">${upgradeCard('land','🌳','Mở rộng vườn',state.upgrades.land>=2?'Đã có đủ 8 ô vườn.':'Mở thêm 2 ô trồng cây. Không ảnh hưởng 6 luống hoa.',state.upgrades.land===0?250:450,state.upgrades.land>=2,2+state.upgrades.land)}${upgradeCard('bees','🐝','Tổ ong bên hoa','Khi có ít nhất 2 luống hoa đang nở, mỗi 90 giây thu được 2 mật ong; 3 loại hoa khác nhau cho thêm 1 mật.',300,state.upgrades.bees,3)}${upgradeCard('kitchen','♨️','Bàn chế biến thứ ba','Làm 3 mẻ cùng lúc, thay vì 2 mẻ.',350,state.upgrades.kitchen>=1,3)}</div>`}`}
function upgradeCard(k,ico,title,desc,cost,done,lv){return `<article class="item-card"><span class="item-icon">${ico}</span><h3>${title}</h3><p>${desc}</p><div class="row"><span class="price">${done?'Đã hoàn tất':cost+' xu'}</span><button class="btn tiny" data-act="upgrade" data-item="${k}" ${done||level()<lv?'disabled':''}>${done?'✓':level()<lv?'Cấp '+lv:'Mở khóa'}</button></div></article>`}
function journalPage(){return `${head('Gom góp những niềm vui bé nhỏ','Sổ tay nông trại','Những mùa đã qua, những người đã gặp, những điều đang chờ.')}<div class="stat-grid"><div class="stat"><small>Đã thu hoạch</small><b>${num(state.stats.harvest)} lần</b></div><div class="stat"><small>Khách đã mua</small><b>${num(state.stats.sales)} lượt</b></div><div class="stat"><small>Doanh thu tích lũy</small><b>${num(state.stats.earned)} xu</b></div><div class="stat"><small>Bộ sưu tập</small><b>${state.collected.length}/${Object.keys(ITEMS).length}</b></div></div><div class="tabs">${[['quests','Cột mốc'],['collection','Sưu tập'],['friends','Khách quen'],['log','Nhật ký']].map(([k,n])=>`<button class="tab ${journalTab===k?'active':''}" data-act="journalTab" data-tab="${k}">${n}</button>`).join('')}</div>${journalTab==='quests'?`<div class="page-grid">${QUESTS.map(q=>`<div class="item-card"><span class="badge">${state.claimed.includes(q.id)?'✓ Đã nhận thưởng':Math.min(questValue(q),q.goal)+' / '+q.goal}</span><h3>${q.title}</h3><p>${q.desc}</p><div class="row"><span class="price">${q.reward} xu + 20 XP</span><button class="btn tiny" data-act="claimQuest" data-id="${q.id}" ${state.claimed.includes(q.id)||questValue(q)<q.goal?'disabled':''}>Nhận</button></div></div>`).join('')}</div>`:journalTab==='collection'?`<div class="panel" style="margin-bottom:18px"><div class="row"><div><h3>Mỗi sản phẩm là một kỷ niệm</h3><p class="sub">Mỗi 5 loại mới mở một phần quà 100 xu.</p></div><button class="btn" data-act="collectionReward" ${state.collected.length<5*(state.collectionClaimed.length+1)?'disabled':''}>Nhận mốc ${5*(state.collectionClaimed.length+1)}</button></div></div><div class="page-grid">${Object.entries(ITEMS).map(([k,it])=>`<div class="item-card ${state.collected.includes(k)?'':'locked'}"><span class="item-icon">${state.collected.includes(k)?it.icon:'❔'}</span><h3>${it.name}</h3><small>${state.collected.includes(k)?'✓ Đã khám phá':'Đang chờ bà khám phá'}</small></div>`).join('')}</div>`:journalTab==='friends'?`<div class="page-grid">${NPCS.map((n,i)=>`<div class="item-card"><div class="portrait">${n.icon}</div><h3>${n.name}</h3><small>${n.role}</small><p>Thích: ${n.likes.map(k=>ITEMS[k].icon).join(' ')}<br>Thiện cảm: ${state.relations[i]} ♡<br>${state.relations[i]>=30?'Khách thân thiết · Trả giá tốt hơn':'Bán hàng và giao đơn để thân thiết hơn'}</p><div class="speech">“${n.line}”</div><button class="btn tiny secondary full" data-act="friendGift" data-i="${i}" ${state.relations[i]<30||state.gifts.includes(i)?'disabled':''}>${state.gifts.includes(i)?'Đã nhận quà thân thiết':state.relations[i]>=30?'Nhận quà thân thiết':'Quà ở mốc 30 ♡'}</button></div>`).join('')}</div>`:`<div class="panel">${state.log.length?state.log.map(l=>`<div class="list-row"><small style="min-width:50px">Ngày ${Math.floor(l.t/180)+1}</small><span style="flex:1">${esc(l.text)}</span></div>`).join(''):'<p class="sub">Câu chuyện nông trại vừa mới bắt đầu.</p>'}</div>`}`}
function settingsPage(){return `${head('Nông trại của riêng bà','Chăm chút trải nghiệm','Lưu cẩn thận những mùa vui mình đã cùng nhau vun trồng.')}<div class="split"><div class="panel"><h3>Chủ nông trại</h3><form class="form" id="rename-form"><label>Tên nông trại<input name="farmName" maxlength="40" required value="${esc(state.name)}"></label><button class="btn" type="submit">Lưu tên mới</button></form><div class="spacer"></div><div class="list-row"><span>Âm thanh tương tác</span><button class="btn tiny secondary" data-act="sound">${state.sound?'♫ Đang bật':'♪ Đang tắt'}</button></div><div class="hint">Âm thanh được tạo trực tiếp trong game. Bật tiếng để nghe tiếng thu hoạch, mua bán và hoàn thành công việc.</div></div><div class="panel"><h3>Sao lưu và chuyển thiết bị</h3><p class="sub">Tiến trình tự lưu trên trình duyệt hiện tại. Xóa dữ liệu trình duyệt, dùng ẩn danh hoặc đổi máy có thể làm mất ô lưu.</p><div class="spacer"></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" data-act="export">↓ Xuất bản sao lưu</button><button class="btn secondary" data-act="import">↑ Nhập bản sao lưu</button></div><div class="hint">Tệp sao lưu .json chứa tiến trình, không phải game. Giữ file HTML và bản sao lưu để chuyển sang thiết bị khác.</div><small>${saveFailed?'⚠ Không thể tự lưu trong trình duyệt này. Hãy xuất bản sao lưu trước khi đóng.':'✓ Đang dùng ô lưu '+slot+' · Tự lưu sau thao tác và mỗi 10 giây'}</small></div></div><div class="spacer"></div><div class="panel"><div class="panel-head"><h3>Ba khoảng trời riêng</h3><small>Cùng trình duyệt có thể truy cập mọi ô lưu</small></div><div class="page-grid">${[1,2,3].map(i=>{const s=i===slot?state:load(i);return `<div class="item-card"><span class="badge">Ô ${i}${slot===i?' · Đang chơi':''}</span><h3>${s?esc(s.name):'Một khởi đầu mới'}</h3><p>${s?'Cấp '+(Math.floor(Math.sqrt(s.xp/45))+1)+' · '+num(s.coins)+' xu':'Tạo nông trại mới với 650 xu và một ít nông sản.'}</p><button class="btn tiny secondary full" data-act="switchSlot" data-i="${i}" ${i===slot?'disabled':''}>${s?'Vào nông trại':'Tạo nông trại'}</button></div>`}).join('')}</div></div><div class="notice">🍃 Game một người chơi · Khách thu mua là NPC · Không cần tài khoản · Không gửi dữ liệu ra mạng.</div><div class="spacer"></div><div class="row"><button class="link" data-act="help">Đọc hướng dẫn chơi</button><button class="btn tiny danger" data-act="resetPrompt">Bắt đầu lại ô ${slot}</button></div>`}
function showModal(title,body,wide=false){modal={title,body,wide};$('#modal-root').innerHTML=`<div class="modal-bg"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button data-act="close" aria-label="Đóng">×</button></div>${body}</section></div>`;requestAnimationFrame(()=>$('#modal-root').querySelector('input,select,button')?.focus())}
function closeModal(){if(!state.started){state.started=true;lastTick=Date.now();save()}modal=null;$('#modal-root').innerHTML=''}
function plotModal(zone,i){const arr=zone==='tree'?state.plots:state.flowers,p=arr[i];if(zone==='tree'&&!unlocked(i)){showModal('Một khoảng vườn mới','<p>Mở rộng vườn để trồng thêm hai cây. Mỗi giống cây có nhịp lớn và giá trị riêng.</p><div class="modal-actions"><button class="btn" data-act="openUpgrades">Xem mở rộng</button></div>');return}if(!p){showModal(zone==='tree'?'Ươm một mầm xanh':'Gieo một luống hoa',`<p>Chọn giống để trồng vào ${zone==='tree'?'ô vườn':'luống hoa'} ${i+1}. Tưới nước giúp thời gian lớn giảm 25%.</p><div class="spacer"></div><div class="page-grid">${Object.entries(CROPS).filter(([k,c])=>c.zone===zone).map(([k,c])=>`<div class="item-card"><span style="font-size:30px">${ITEMS[k].icon}</span><h3>${ITEMS[k].name}</h3><p>${niceTime(c.time)} · ${c.qty} sản phẩm<br>${k==='orchid'?state.orchidSeeds+' hạt trong túi':c.cost+' xu / giống'}${level()<c.level?'<br>Mở ở cấp '+c.level:''}</p><button class="btn tiny full" data-act="plant" data-zone="${zone}" data-i="${i}" data-type="${k}" ${level()<c.level||k==='orchid'&&!state.orchidSeeds?'disabled':''}>Trồng ngay</button></div>`).join('')}</div>`,true)}else{const c=CROPS[p.type],r=ready(p);showModal(ITEMS[p.type].icon+' '+ITEMS[p.type].name,`<div style="text-align:center;font-size:60px;padding:12px">${ITEMS[p.type].icon}</div><p>${r?'Đã đến lúc thu hoạch!':`Còn khoảng ${niceTime(cropDuration(p)-(state.clock-p.at))} để thu hoạch.`} ${!c.single&&zone==='tree'?'Cây sẽ tiếp tục ra trái sau mỗi lần hái.':'Thu hoạch xong có thể gieo giống mới.'}</p><div class="hint">Sản lượng: ${c.qty}${p.watered?' + 1 nhờ chăm sóc':''} sản phẩm · ${p.watered?'💧 Đã được tưới':'Chưa tưới nước'}</div><div class="modal-actions">${r?`<button class="btn" data-act="harvest" data-zone="${zone}" data-i="${i}">🧺 Thu hoạch</button>`:`<button class="btn" data-act="water" data-zone="${zone}" data-i="${i}" ${p.watered?'disabled':''}>💧 Tưới miễn phí</button>`}<button class="btn secondary" data-act="removePrompt" data-zone="${zone}" data-i="${i}">Thay giống</button></div>`)} }
const plotModalBase=plotModal;plotModal=function(zone,i){plotModalBase(zone,i);const p=(zone==='tree'?state.plots:state.flowers)[i];if(p&&modal&&!ready(p))modal.live={test:()=>ready(p),refresh:()=>plotModal(zone,i)}};
function animalModal(id){const a=state.animals.find(a=>a.id===id);if(!a)return;const t=ANIMALS[a.type],r=animalReady(a);showModal(t.icon+' '+esc(a.name),`<p>${t.name} · ${esc(a.trait)} · Thân thiết ${Math.floor(a.affection)} ♡</p><div style="text-align:center;font-size:65px;margin:20px">${t.icon}</div><p>${r?'Sản phẩm đã sẵn sàng để bà thu hoạch.':a.fed?'Đã ăn no. Còn '+niceTime(t.time-(state.clock-a.at))+' để có sản phẩm.':'Đang đợi bữa ăn tiếp theo. Một khẩu phần giá 5 xu.'} Thân thiết từ 30 ♡ cho thêm 1 sản phẩm mỗi lần.</p><form id="animal-name" class="form"><input type="hidden" name="id" value="${a.id}"><label>Đặt tên cho bạn nhỏ<input name="petName" maxlength="24" value="${esc(a.name)}" required></label><button class="btn tiny secondary" type="submit">Lưu tên</button></form><div class="modal-actions"><button class="btn secondary" data-act="pet" data-id="${a.id}" ${a.petDay===day()?'disabled':''}>♡ Vuốt ve ${a.petDay===day()?'(đã làm hôm nay)':''}</button>${r?`<button class="btn" data-act="collectAnimal" data-id="${a.id}">Nhận ${ITEMS[t.item].icon}</button>`:`<button class="btn" data-act="feed" data-id="${a.id}" ${a.fed?'disabled':''}>Cho ăn · 5 xu</button>`}</div>`)}
const animalModalBase=animalModal;animalModal=function(id){animalModalBase(id);const a=state.animals.find(a=>a.id===id);if(a&&modal&&a.fed&&!animalReady(a))modal.live={test:()=>animalReady(a),refresh:()=>animalModal(id)}};
function inventoryModal(){showModal('📦 Kho của tui',`<p>Sản phẩm không hỏng theo thời gian. Hàng đang đăng bán được giữ riêng ngoài kho.</p><div class="spacer"></div><div class="page-grid">${Object.entries(state.inventory).filter(([k,n])=>n>0).map(([k,n])=>`<div class="item-card"><div class="row"><span style="font-size:27px">${ITEMS[k].icon}</span><b class="count">${num(n)}</b></div><h3>${ITEMS[k].name}</h3><button class="btn tiny secondary full" data-act="newListing" data-item="${k}">Đăng bán</button></div>`).join('')||'<div class="empty">Kho đang trống. Ra vườn thu hoạch nhé!</div>'}</div>`,true)}
function listingModal(item){if(state.listings.length>=8){toast('Quầy đã đủ 8 tin. Gỡ tin cũ hoặc bán hàng trước nhé.',true);return}const available=Object.keys(ITEMS).filter(k=>qty(k)>0);if(!available.length){toast('Kho chưa có sản phẩm để bán.',true);return}const chosen=available.includes(item)?item:available[0];showModal('🪧 Đăng tin bán nông sản',`<p>Khách sẽ ghé cân nhắc sản phẩm và mức giá bà chọn. Sản phẩm được giữ riêng ngay khi đăng.</p><form class="form" id="listing-form"><label>Sản phẩm<select name="item" id="listing-item">${available.map(k=>`<option value="${k}" ${k===chosen?'selected':''}>${ITEMS[k].icon} ${ITEMS[k].name} · Kho ${qty(k)}</option>`).join('')}</select></label><div class="cols"><label>Số lượng<input name="amount" id="listing-amount" type="number" min="1" max="${qty(chosen)}" step="1" value="${Math.min(qty(chosen),3)}" required></label><label>Giá mỗi sản phẩm (xu)<input name="price" id="listing-price" type="number" min="1" max="99999" step="1" value="${price(chosen)}" required></label></div><div class="hint" id="listing-hint">Giá tham khảo: ${price(chosen)} xu / sản phẩm · Tin tồn tại 15 phút.</div><button class="btn full" type="submit">Đăng bán và đón khách</button></form>`)}
function help(){showModal('Chào bà, chủ nông trại mới! 🌱',`<p>Đây là khoảng trời của riêng bà. Cứ thong thả chơi, mọi thứ đều có thể học từng chút một.</p>${[['🌱','Trồng và tưới','Chạm ô đất có dấu + để chọn giống. Tưới miễn phí giúp cây lớn nhanh hơn 25% và tăng 1 sản phẩm. Trái cây lâu năm ra nhiều vụ; hoa và dâu trồng lại.'],['🐔','Kết bạn với vật nuôi','Chạm con vật để cho ăn (5 xu), đặt tên và vuốt ve. Mỗi bữa tạo một lượt sản phẩm. Không có vật nuôi chết hay bỏ đi khi bà nghỉ.'],['🪧','Đăng bán, đón khách','Vào Chợ nông sản để chọn hàng và giá. Khách NPC thường ghé sau 20–35 giây. Mở tab Khách thu mua để đồng ý hoặc thương lượng. Giá cao quá sẽ khó bán.'],['♨️','Chế biến và khám phá','Xưởng biến nguyên liệu thành bánh, mứt, nước ép, phô mai và hoa. Nhận thành phẩm khi hết giờ. Trong vườn hoa, lai 2 luống khác loại đã nở để có lan ngọc.'],['🌷','Bốn mùa, nhiều điều mới','Một ngày game dài 3 phút; một mùa dài 12 phút. Hoa, trái cây và sữa lần lượt được giá. Sự kiện và khách xuất hiện ngẫu nhiên. Các mùa luôn quay lại.'],['💾','Giữ những mùa vui','Game tự lưu trên trình duyệt. Xuất bản sao lưu trong Cài đặt trước khi chuyển máy hoặc xóa dữ liệu. File HTML mở trực tiếp để chơi offline.']].map(([ico,t,d])=>`<div class="guide-step"><span>${ico}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}<div class="hint">Khởi đầu: bà có 650 xu, một cây táo, một luống hồng và cô gà Bông đang chờ thu hoạch. Có sẵn nông sản trong kho để thử bán ngay.</div><div class="modal-actions"><button class="btn" data-act="start">Bắt đầu ngày mới →</button></div>`,true)}
function beeModal(){if(!state.upgrades.bees){showModal('🐝 Tổ ong bên vườn hoa','<p>Hoa nở gọi ong về. Mở tổ ong rồi giữ ít nhất 2 luống hoa đã nở để thu mật. Ba loại hoa khác nhau sẽ cho thêm mật ong.</p><div class="modal-actions"><button class="btn" data-act="openUpgrades">Xem mở khóa</button></div>');return}const blooming=state.flowers.filter(ready),types=new Set(blooming.map(p=>p.type));showModal('🐝 Tổ ong nhỏ',`<p>Đang có ${blooming.length} luống hoa nở, ${types.size} loại hoa. Cần ít nhất 2 luống đang nở để ong làm mật.</p><div class="hint">${state.clock>=state.honeyAt?'Tổ ong đã đủ thời gian làm mật.':'Còn '+niceTime(state.honeyAt-state.clock)+' đến lượt tiếp theo.'} Mỗi lượt nhận ${types.size>=3?3:2} mật ong.</div><div class="modal-actions"><button class="btn" data-act="collectHoney" ${blooming.length<2||state.clock<state.honeyAt?'disabled':''}>🍯 Thu mật ong</button></div>`)}
function breedModal(){const bloom=state.flowers.map((p,i)=>({p,i})).filter(o=>ready(o.p));showModal('🌸 Lai một sắc hoa mới',`<p>Chọn hai luống hoa khác loại đang nở. Hai luống sẽ được dùng để lai, đổi lại bà nhận chắc chắn 1 hạt lan ngọc và 25 kinh nghiệm.</p>${bloom.length>=2?`<form class="form" id="breed-form"><label>Luống thứ nhất<select name="a">${bloom.map(o=>`<option value="${o.i}">Luống ${o.i+1} · ${ITEMS[o.p.type].name}</option>`).join('')}</select></label><label>Luống thứ hai<select name="b">${bloom.map((o,j)=>`<option value="${o.i}" ${j===1?'selected':''}>Luống ${o.i+1} · ${ITEMS[o.p.type].name}</option>`).join('')}</select></label><button class="btn" type="submit">Lai giống · Dùng 2 luống hoa</button></form>`:'<div class="hint">Cần ít nhất hai luống hoa đã nở. Thử trồng hồng và hướng dương trước nhé.</div>'}<div class="hint">Hạt lan ngọc đang có: ${state.orchidSeeds}. Trồng tại một ô hoa trống.</div>`)}
function eventModal(){if(!state.event){toast('Vườn đang bình yên. Sự kiện mới sẽ ghé thăm sớm.');return}const e=eventInfo();showModal(e.icon+' '+e.title,`<p>${e.desc}</p><div class="hint">Còn ${niceTime(state.event.until-state.clock)} · Sự kiện có thể gặp lại trong những ngày sau.</div>${['tour','merchant','duck'].includes(state.event.type)?`<div class="modal-actions"><button class="btn" data-act="eventClaim" ${state.event.claimed?'disabled':''}>${state.event.claimed?'✓ Đã hoàn thành':state.event.type==='tour'?'Giao 3 táo · Nhận 95 xu':state.event.type==='merchant'?'Mua hạt lan · 65 xu':'Đưa vịt về nhà'}</button></div>`:'<div class="modal-actions"><button class="btn" data-act="close">Thật tuyệt!</button></div>'}`)}
function harvest(zone,i,quiet=false){const arr=zone==='tree'?state.plots:state.flowers,p=arr[i];if(!ready(p)){if(!quiet)toast('Cây vẫn đang lớn. Tưới nước để nhanh hơn nhé.');return false}const c=CROPS[p.type],n=c.qty+(p.watered?1:0);add(p.type,n);state.stats.harvest++;if(zone==='flower')state.stats.flowers++;xp(10);log(`Thu hoạch ${n} ${ITEMS[p.type].name}.`);if(!quiet)toast(`+${n} ${ITEMS[p.type].icon} ${ITEMS[p.type].name} · +10 XP`);if(c.single||zone==='flower')arr[i]=null;else{p.at=state.clock;p.watered=false}return true}
function collectAnimal(id,quiet=false){const a=state.animals.find(a=>a.id===id);if(!a||!animalReady(a))return false;const t=ANIMALS[a.type],n=2+(a.affection>=30?1:0);add(t.item,n);a.fed=false;a.at=state.clock;state.stats.harvest++;xp(10);if(!quiet)toast(`${a.name} tặng bà ${n} ${ITEMS[t.item].icon} · +10 XP`);log(`${a.name} cho ${n} ${ITEMS[t.item].name}.`);return true}
function transact(){save();render()}
const ACTIONS={
 nav(d){if(!NAV.some(n=>n[0]===d.page))return;page=d.page;placing=null;closeModal();render();window.scrollTo({top:0,behavior:'smooth'})},
 sound(){state.sound=!state.sound;sound('win');toast(state.sound?'Đã bật âm thanh ♫':'Đã tắt âm thanh');transact()},
 mapZoom(){showModal('Một khoảng trời rộng hơn',`<p>Trên điện thoại, vuốt ngang bản đồ để xem từng khu. Chạm trực tiếp cây hoặc vật nuôi để chăm sóc.</p><div style="overflow:auto;border-radius:14px;background:#e1edce;margin-top:15px"><div style="min-width:780px">${farmSVG()}</div></div>`,true)},
 help,close:closeModal,start(){state.started=true;closeModal();save();render();toast('Chúc bà một mùa thật an nhiên 🌱')},
 plot(d){plotModal(d.zone,Number(d.i))},
 plant(d){const i=Number(d.i),c=CROPS[d.type],arr=d.zone==='tree'?state.plots:state.flowers;if(!c||c.zone!==d.zone||arr[i]||level()<c.level||(d.zone==='tree'&&!unlocked(i)))return;if(d.type==='orchid'){if(!state.orchidSeeds)return;state.orchidSeeds--}else if(!cost(c.cost))return;arr[i]={type:d.type,at:state.clock,watered:false};xp(3);log(`Trồng ${ITEMS[d.type].name}.`);closeModal();sound();toast('Đã gieo '+ITEMS[d.type].icon+' '+ITEMS[d.type].name+'. Tưới nước để lớn nhanh hơn!');transact()},
 water(d){const p=(d.zone==='tree'?state.plots:state.flowers)[Number(d.i)];if(p&&!p.watered){p.watered=true;xp(1);toast('💧 Đã tưới. Thời gian lớn giảm 25%.');sound();closeModal();transact()}},
 waterAll(){let count=0;[...state.plots,...state.flowers].filter(Boolean).forEach(p=>{if(!p.watered){p.watered=true;count++}});if(count){xp(count);sound();transact()}toast(count?'💧 Đã tưới '+count+' cây và luống hoa.':'Cả vườn đã được tưới rồi. Bà gieo thêm giống nhé.')},
 harvest(d){if(harvest(d.zone,Number(d.i))){closeModal();sound('win');transact()}else{closeModal();plotModal(d.zone,Number(d.i))}},
 harvestAll(){let n=0;state.plots.forEach((_,i)=>{if(harvest('tree',i,true))n++});state.flowers.forEach((_,i)=>{if(harvest('flower',i,true))n++});state.animals.forEach(a=>{if(collectAnimal(a.id,true))n++});toast(n?'🧺 Thu hoạch '+n+' nơi. Sản phẩm đã vào kho!':'Chưa có gì chín. Thử trồng thêm hoặc ghé chợ nhé.');if(n){sound('win');transact()}},
 removePrompt(d){showModal('Thay giống cây?',`<p>Cây hoặc hoa ở ô này sẽ được bỏ để trồng giống khác. Chi phí giống cũ không hoàn lại. Nếu cây đã chín, bà nên thu hoạch trước.</p><div class="modal-actions"><button class="btn secondary" data-act="close">Giữ lại</button><button class="btn danger" data-act="removePlant" data-zone="${d.zone}" data-i="${d.i}">Bỏ cây ở ô này</button></div>`)},
 removePlant(d){(d.zone==='tree'?state.plots:state.flowers)[Number(d.i)]=null;closeModal();transact();toast('Ô đất sẵn sàng đón một giống cây mới.')},
 animals(){showModal('🐾 Những người bạn nhỏ',`<div class="page-grid">${state.animals.map(a=>`<div class="item-card"><span class="item-icon">${ANIMALS[a.type].icon}</span><h3>${esc(a.name)}</h3><p>${esc(a.trait)} · ${Math.floor(a.affection)} ♡</p><button class="btn tiny full" data-act="animal" data-id="${a.id}">Chăm sóc</button></div>`).join('')}</div><div class="modal-actions"><button class="btn secondary" data-act="openAnimalShop">Đón thêm bạn mới</button></div>`)},
 animal(d){animalModal(d.id)},
 feed(d){const a=state.animals.find(a=>a.id===d.id);if(!a||a.fed||!cost(5))return;a.fed=true;a.at=state.clock;a.affection+=1;closeModal();transact();sound();toast(a.name+' đã ăn no. Chờ chút để nhận sản phẩm nhé.')},
 feedAll(){const list=state.animals.filter(a=>!a.fed);if(!list.length){toast('Các bạn nhỏ đều đã ăn no.');return}if(!cost(list.length*5))return;list.forEach(a=>{a.fed=true;a.at=state.clock;a.affection++});toast('🌾 Đã cho '+list.length+' bạn nhỏ ăn · −'+list.length*5+' xu');sound();transact()},
 pet(d){const a=state.animals.find(a=>a.id===d.id);if(!a||a.petDay===day())return;a.petDay=day();a.affection+=5;xp(3);toast('♡ '+a.name+' rất vui! +5 thân thiết');sound();closeModal();transact()},
 collectAnimal(d){if(collectAnimal(d.id)){closeModal();sound('win');transact()}else{closeModal();animalModal(d.id)}},
 buyAnimal(d){const a=ANIMALS[d.type];if(!a||level()<a.level||state.animals.length>=6)return;if(!cost(a.cost))return;const newA={id:uid(),type:d.type,name:rand(['Mây','Mít','Nếp','Đậu','Kem','Mơ','Bí','Bắp']),trait:rand(TRAITS),at:state.clock,affection:0,fed:true,petDay:-1};state.animals.push(newA);xp(12);log(`Đón ${a.name.toLowerCase()} ${newA.name} về nông trại.`);sound('win');toast(`${a.icon} ${newA.name} đã về nhà! Bữa ăn đầu được tặng miễn phí.`);transact()},
 openAnimalShop(){closeModal();page='shop';shopTab='animals';render()},
 inventory:inventoryModal,
 marketTab(d){marketTab=d.tab;render()},shopTab(d){shopTab=d.tab;render()},journalTab(d){journalTab=d.tab;render()},
 newListing(d){listingModal(d.item)},
 cancelListing(d){const l=state.listings.find(l=>l.id===d.id);if(!l)return;add(l.item,l.qty);state.listings=state.listings.filter(l=>l.id!==d.id);state.offers=state.offers.filter(o=>o.listing!==d.id);toast('Đã gỡ tin. Hàng được trả về kho.');transact()},
 acceptOffer(d){const o=state.offers.find(o=>o.id===d.id);if(!o)return;const l=state.listings.find(l=>l.id===o.listing);if(!l||l.qty<o.qty||l.until<=state.clock){toast('Tin bán đã hết hạn hoặc không đủ hàng.',true);return}const total=o.qty*o.price;state.coins+=total;state.stats.earned+=total;state.stats.sales++;state.relations[o.npc]+=6;xp(15);l.qty-=o.qty;state.offers=state.offers.filter(x=>x.id!==o.id);if(!l.qty){state.listings=state.listings.filter(x=>x.id!==l.id);state.offers=state.offers.filter(x=>x.listing!==l.id)}log(`Bán ${o.qty} ${ITEMS[l.item].name} cho ${NPCS[o.npc].name}, nhận ${total} xu.`);sound('coin');toast(`Đã bán! +${total} xu · +6 ♡ với ${NPCS[o.npc].name}`);transact()},
 counterOffer(d){const o=state.offers.find(o=>o.id===d.id);if(!o||o.countered)return;const l=state.listings.find(l=>l.id===o.listing);if(!l)return;o.countered=true;if(Math.random()<.62+Math.min(state.relations[o.npc],100)/500){o.price=Math.round(o.price*1.1);toast(NPCS[o.npc].name+' đồng ý mức giá mới!')}else{state.offers=state.offers.filter(x=>x.id!==o.id);toast(NPCS[o.npc].name+' vượt ngân sách nên xin hẹn lần sau. Hàng vẫn đang đăng bán.')}transact()},
 rejectOffer(d){state.offers=state.offers.filter(o=>o.id!==d.id);toast('Đã từ chối. Sản phẩm vẫn đang đăng bán.');transact()},
 craft(d){const r=RECIPES[d.item];if(!r||level()<r.level||state.jobs.length>=2+state.upgrades.kitchen||!has(r.need)){toast('Chưa đủ nguyên liệu hoặc bàn chế biến đang bận.',true);return}spendNeed(r.need);state.jobs.push({id:uid(),item:d.item,until:state.clock+r.time});sound();toast('♨ Đã bắt đầu làm '+ITEMS[d.item].name.toLowerCase());transact()},
 collectJob(d){const j=state.jobs.find(j=>j.id===d.id);if(!j||j.until>state.clock)return;add(j.item,1);state.jobs=state.jobs.filter(x=>x.id!==j.id);state.stats.crafts++;xp(18);log('Hoàn thành '+ITEMS[j.item].name+'.');sound('win');toast('+1 '+ITEMS[j.item].icon+' '+ITEMS[j.item].name+' · +18 XP');transact()},
 claimQuest(d){const q=QUESTS.find(q=>q.id===d.id);if(!q||state.claimed.includes(q.id)||questValue(q)<q.goal)return;state.claimed.push(q.id);state.coins+=q.reward;xp(20);log('Hoàn thành cột mốc: '+q.title+'.');sound('win');toast('✦ Hoàn thành cột mốc! +'+q.reward+' xu · +20 XP');transact()},
 request(){const r=state.request;if(r.done||qty(r.item)<r.qty)return;state.inventory[r.item]-=r.qty;state.coins+=r.reward;state.stats.earned+=r.reward;state.stats.sales++;state.relations[r.npc]+=8;xp(18);r.done=1;r.next=state.clock+50;log('Giao đơn cho '+NPCS[r.npc].name+', nhận '+r.reward+' xu.');sound('coin');toast('Giao hàng thành công! +'+r.reward+' xu · +8 ♡');transact()},
 skipRequest(){newRequest();toast('Đã đổi lời nhắn. Không mất xu hay thiện cảm.');transact()},
 collectionReward(){const milestone=(state.collectionClaimed.length+1)*5;if(state.collected.length<milestone||milestone>Object.keys(ITEMS).length)return;state.collectionClaimed.push(milestone);state.coins+=100;xp(15);sound('win');toast('Sưu tập đủ '+milestone+' loại! +100 xu');transact()},
 friendGift(d){const i=Number(d.i);if(state.relations[i]<30||state.gifts.includes(i))return;state.gifts.push(i);state.coins+=100;add(['cake','jam','bouquet','cheese'][i],2);xp(25);showModal('Một món quà từ '+NPCS[i].name,`<div class="portrait" style="margin:0 auto 18px">${NPCS[i].icon}</div><p>“Từ ngày quen bà, mình luôn có những nguyên liệu thật ngon. Tặng bà hai sản phẩm từ công thức gia truyền, cùng 100 xu để khu vườn thêm xanh nhé!”</p><div class="hint">+2 ${ITEMS[['cake','jam','bouquet','cheese'][i]].name} · +100 xu · +25 XP</div><div class="modal-actions"><button class="btn" data-act="close">Cảm ơn người bạn!</button></div>`);sound('win');transact()},
 goPlant(d){closeModal();page='farm';render();toast(d.zone==='flower'?'Chạm dấu + ở khu hoa bên phải để gieo giống.':'Chạm dấu + ở vườn cây bên trái để trồng.')},
 buyDecor(d){const de=DECORS[d.item];if(!de||!cost(de.cost))return;state.decorStock[d.item]=(state.decorStock[d.item]||0)+1;sound();toast('Đã mua '+de.name+'. Chọn Đặt vào vườn để bố trí.');transact()},
 place(d){if(!(state.decorStock[d.item]>0))return;placing=d.item;page='farm';closeModal();render();toast('Chạm dấu + trên bản đồ để đặt '+DECORS[d.item].name.toLowerCase())},
 cancelPlace(){placing=null;render()},
 decorPlace(d){const i=Number(d.i);if(placing){if(state.decor[i]){toast('Vị trí này đã có đồ. Chọn chỗ trống hoặc cất đồ cũ trước.',true);return}if(!state.decorStock[placing])return;state.decorStock[placing]--;state.decor[i]=placing;placing=null;xp(5);sound();toast('Khu vườn xinh hơn một chút rồi!');transact()}else if(state.decor[i]){const key=state.decor[i];showModal(DECORS[key].icon+' '+DECORS[key].name,'<p>Bà có thể cất đồ vào kho trang trí rồi đặt lại ở một vị trí khác. Không mất xu.</p><div class="modal-actions"><button class="btn secondary" data-act="stow" data-i="'+i+'">Cất để bố trí lại</button></div>')}else{showModal('Một góc nhỏ chờ trang trí','<p>Chọn một chiếc ghế, đài phun nước, đèn hay góc picnic cho khoảng vườn này nhé.</p><div class="modal-actions"><button class="btn" data-act="openDecor">Ghé cửa hàng trang trí</button></div>')}},
 stow(d){const i=Number(d.i),k=state.decor[i];if(!k)return;state.decorStock[k]=(state.decorStock[k]||0)+1;state.decor[i]=null;closeModal();transact();toast('Đồ đã cất vào kho trang trí.')},
 openDecor(){closeModal();page='shop';shopTab='decor';render()},openUpgrades(){closeModal();page='shop';shopTab='upgrades';render()},
 upgrade(d){const key=d.item,up=state.upgrades;if(key==='land'){if(up.land>=2||level()<2+up.land||!cost(up.land===0?250:450))return;up.land++}else if(key==='bees'){if(up.bees||level()<3||!cost(300))return;up.bees=true;state.honeyAt=state.clock+90}else if(key==='kitchen'){if(up.kitchen||level()<3||!cost(350))return;up.kitchen=1}else return;xp(20);sound('win');toast('🔨 Mở khóa thành công. Nông trại có thêm điều mới!');transact()},
 bees:beeModal,breed:breedModal,
 collectHoney(){if(!state.upgrades.bees||state.clock<state.honeyAt)return;const flowers=state.flowers.filter(ready);if(flowers.length<2)return;const n=new Set(flowers.map(p=>p.type)).size>=3?3:2;add('honey',n);state.honeyAt=state.clock+90;state.stats.harvest++;xp(12);closeModal();sound('win');toast('+ '+n+' 🍯 mật ong thơm hương hoa');transact()},
 event:eventModal,
 eventClaim(){const e=state.event;if(!e||e.claimed||e.until<=state.clock){toast('Sự kiện đã khép lại. Sẽ có dịp gặp lại nhé.');closeModal();return}if(e.type==='tour'){if(qty('apple')<3){toast('Cần 3 táo trong kho để giao cho đoàn khách.',true);return}state.inventory.apple-=3;state.coins+=95;state.stats.earned+=95;state.stats.sales++;xp(15)}else if(e.type==='merchant'){if(!cost(65))return;state.orchidSeeds++;xp(5)}else if(e.type==='duck'){state.coins+=35;xp(12)}else return;e.claimed=true;log('Hoàn thành sự kiện: '+eventInfo().title);closeModal();sound('win');transact();toast('Một cuộc gặp dễ thương! Phần thưởng đã được nhận.')},
 export(){const data=JSON.stringify({game:'mua-an-nhien',exportedAt:new Date().toISOString(),state:{...state,lastReal:Date.now()}},null,2);download(data,'AnNhien_O'+slot+'_'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Đã xuất bản sao lưu. Hãy giữ tệp .json này nhé.')},
 import(){showModal('Nhập tiến trình từ bản sao lưu','<p>Tiến trình trong tệp sẽ thay thế toàn bộ ô lưu hiện tại. Các ô khác giữ nguyên. Bà nên xuất một bản sao lưu hiện tại trước khi nhập.</p><div class="modal-actions"><button class="btn secondary" data-act="export">Xuất ô hiện tại</button><button class="btn" data-act="chooseImport">Chọn tệp .json</button></div>')},
 chooseImport(){const input=$('#import-file');input.value='';input.click()},
 switchSlot(d){const target=Number(d.i);if(target===slot||target<1||target>3)return;save();slot=target;state=load(slot)||fresh();paused=false;saveStamp=state.revision||0;resumeOffline();lastTick=Date.now();page='farm';placing=null;closeModal();transact();if(!state.started)help();else toast('Đã vào '+state.name)},
 resetPrompt(){showModal('Bắt đầu lại ô '+slot+'?',`<p>Thao tác này xóa tiến trình của ô ${slot} trên trình duyệt này và tạo nông trại mới. Hai ô còn lại giữ nguyên. Xuất bản sao lưu nếu bà muốn giữ khu vườn cũ.</p><div class="modal-actions"><button class="btn secondary" data-act="export">Xuất bản sao lưu trước</button><button class="btn danger" data-act="reset">Xóa ô ${slot} và chơi lại</button></div>`)},
 reset(){state=fresh();closeModal();page='farm';placing=null;transact();help()}
};
function download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(!btn||btn.disabled)return;const act=btn.dataset.act;if(paused&&!['export','help','close'].includes(act))return;const fn=ACTIONS[act];if(fn)fn(btn.dataset)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(placing){placing=null;render()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(e.key==='Tab'&&modal){const focus=[...$('#modal-root').querySelectorAll('button:not(:disabled),input:not([type="hidden"]),select,[tabindex="0"]')];const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
document.addEventListener('change',e=>{if(e.target.id==='listing-item'){const k=e.target.value;$('#listing-price').value=price(k);$('#listing-amount').max=qty(k);$('#listing-amount').value=Math.min(3,qty(k));$('#listing-hint').textContent='Giá tham khảo: '+price(k)+' xu / sản phẩm · Tin tồn tại 15 phút.'}});
document.addEventListener('submit',e=>{e.preventDefault();if(paused)return;const f=e.target,form=new FormData(f);if(f.id==='listing-form'){const item=form.get('item'),amount=Number(form.get('amount')),p=Number(form.get('price'));if(!ITEMS[item]||!Number.isInteger(amount)||amount<1||amount>qty(item)||!Number.isInteger(p)||p<1||p>99999||state.listings.length>=8){toast('Kiểm tra lại số lượng và giá đăng bán nhé.',true);return}state.inventory[item]-=amount;state.listings.push({id:uid(),item,qty:amount,price:p,until:state.clock+900});state.nextBuyer=Math.min(state.nextBuyer,state.clock+20);xp(2);log(`Đăng bán ${amount} ${ITEMS[item].name}, giá ${p} xu/SP.`);closeModal();page='market';marketTab='listings';toast('📣 Đã đăng tin! Khách sẽ ghé xem hàng sau khoảng 20–35 giây.');sound();transact()}else if(f.id==='rename-form'){const name=String(form.get('farmName')).trim().slice(0,40);if(!name)return;state.name=name;toast('Đã lưu tên nông trại.');transact()}else if(f.id==='animal-name'){const a=state.animals.find(a=>a.id===form.get('id')),name=String(form.get('petName')).trim().slice(0,24);if(a&&name){a.name=name;closeModal();toast('Bạn nhỏ đã có tên '+name+'!');transact()}}else if(f.id==='breed-form'){const a=Number(form.get('a')),b=Number(form.get('b')),pa=state.flowers[a],pb=state.flowers[b];if(a===b||!ready(pa)||!ready(pb)||pa.type===pb.type){toast('Chọn hai luống đang nở và khác loại hoa nhé.',true);return}state.flowers[a]=null;state.flowers[b]=null;state.orchidSeeds++;state.stats.breed++;xp(25);log('Lai hai sắc hoa, khám phá hạt lan ngọc.');closeModal();toast('🌸 Lai thành công! +1 hạt lan ngọc · +25 XP');sound('win');transact()}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024){toast('Tệp quá lớn. Chọn đúng bản sao lưu .json dưới 2 MB.',true);return}try{const data=JSON.parse(await file.text());if(data.game!=='mua-an-nhien')throw Error('Đây không phải bản sao lưu Mùa An Nhiên.');const checked=validate(data.state);state=checked;state.lastReal=Date.now();paused=false;placing=null;lastTick=Date.now();closeModal();page='farm';transact();toast('Đã khôi phục '+state.name+'. Chúc bà chơi vui!')}catch(error){toast('Không nhập được: '+error.message,true)}});
window.addEventListener('storage',e=>{if(e.key===KEY+slot&&e.newValue){try{const other=JSON.parse(e.newValue);if(other.revision>saveStamp){paused=true;closeModal();render();toast('Ô lưu đã thay đổi ở tab khác. Tab này tạm dừng để bảo vệ dữ liệu.',true)}}catch(err){}}});
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
let sinceSave=0;setInterval(()=>{const now=Date.now(),dt=(now-lastTick)/1000;lastTick=now;if(paused||!state.started)return;advance(dt);if(modal?.live&&modal.live.test()&&!document.activeElement?.closest('form'))modal.live.refresh();sinceSave+=dt;if(sinceSave>=10){save();sinceSave=0}if(!document.hidden&&!modal&&!document.activeElement?.closest('form')){const focused=document.activeElement,position=focused?.dataset?.act?{act:focused.dataset.act,id:focused.dataset.id,i:focused.dataset.i,zone:focused.dataset.zone}:null;render();if(position){const candidates=[...document.querySelectorAll('[data-act]')];const match=candidates.find(el=>el.dataset.act===position.act&&el.dataset.id===position.id&&el.dataset.i===position.i&&el.dataset.zone===position.zone);match?.focus({preventScroll:true})}}},1000);
// Flower breeding remains directly accessible from both the farm and journal.
const baseFarmPage=farmPage;farmPage=function(){return baseFarmPage()+`<div class="row" style="margin-top:15px;gap:15px;flex-wrap:wrap"><button class="link" data-act="breed">🌸 Lai giống hoa · Khám phá lan ngọc</button><button class="link" data-act="animals">🐾 Thăm các bạn nhỏ (${state.animals.length}/6)</button><button class="link" data-act="openDecor">⛲ Bố trí khu vườn</button></div>`};
render();if(!state.started)help();save();
</script></body></html>
