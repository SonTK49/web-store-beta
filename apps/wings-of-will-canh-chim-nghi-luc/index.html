<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15151b">

<title>Cánh Chim Nghị Lực</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#543847}
*{box-sizing:border-box}

body{display:flex;align-items:center;justify-content:center;font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;color:var(--ink)}
#stage{position:relative;overflow:hidden;--u:1px;--gy:400;--st:env(safe-area-inset-top,0px);background:#4ec0ca}
#game{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#probe{position:absolute;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden}
.screen{position:absolute;inset:0;display:none;pointer-events:none}
.screen.show{display:block}
.screen button,.screen input{pointer-events:auto}
.col{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.row{display:flex;gap:calc(var(--u)*6);align-items:center;justify-content:center}
.out{--o:calc(var(--u)*2);color:#fff;text-shadow:var(--o) 0 0 var(--ink),calc(var(--o)*-1) 0 0 var(--ink),0 var(--o) 0 var(--ink),0 calc(var(--o)*-1) 0 var(--ink),var(--o) var(--o) 0 var(--ink),calc(var(--o)*-1) var(--o) 0 var(--ink),var(--o) calc(var(--o)*-1) 0 var(--ink),calc(var(--o)*-1) calc(var(--o)*-1) 0 var(--ink),0 calc(var(--o)*2.4) 0 var(--ink)}
.logo{font-weight:800;font-size:calc(var(--u)*36);line-height:1;color:#ffd84a;white-space:nowrap;letter-spacing:calc(var(--u)*.5)}
.logo .w{color:#fff}
.logo{text-align:center;line-height:1.02}
.langbtn{height:calc(var(--u)*30);padding:0 calc(var(--u)*6);gap:calc(var(--u)*3)}
.flag{display:inline-block;width:calc(var(--u)*18);height:calc(var(--u)*12);border-radius:calc(var(--u)*2);overflow:hidden;box-shadow:0 0 0 calc(var(--u)*1) var(--ink);flex:none;line-height:0}
.flag svg{width:100%;height:100%;display:block}
.flag.off{opacity:.38;filter:grayscale(.5)}
.topbar .btn.ic{width:calc(var(--u)*24);height:calc(var(--u)*24);font-size:calc(var(--u)*11);border-width:calc(var(--u)*1.5);box-shadow:inset 0 calc(var(--u)*-2) 0 #e6dcc2,0 calc(var(--u)*2) 0 var(--ink)}
.topbar .langbtn{height:calc(var(--u)*24);padding:0 calc(var(--u)*5);border-width:calc(var(--u)*1.5);box-shadow:inset 0 calc(var(--u)*-2) 0 #e6dcc2,0 calc(var(--u)*2) 0 var(--ink)}
.topbar .flag{width:calc(var(--u)*14);height:calc(var(--u)*9.5)}
.topbar .row{gap:calc(var(--u)*5)}
.topbar .coinbox{font-size:calc(var(--u)*11);padding:calc(var(--u)*1.5) calc(var(--u)*9) calc(var(--u)*0.5) calc(var(--u)*4)}
.topbar .coinbox .coin{width:calc(var(--u)*9);height:calc(var(--u)*9)}
.langopt{display:flex;align-items:center;gap:calc(var(--u)*10);width:100%;font:inherit;font-weight:800;font-size:calc(var(--u)*14);color:var(--ink);background:#fff8dc;border:calc(var(--u)*1.5) solid var(--ink);border-radius:calc(var(--u)*8);padding:calc(var(--u)*8) calc(var(--u)*12);margin-bottom:calc(var(--u)*8);cursor:pointer}

.title2{font-weight:800;font-size:calc(var(--u)*34);line-height:1;white-space:nowrap}

.over-t{color:#f6a12e}
.small{font-size:calc(var(--u)*10);font-weight:600;line-height:1.25;text-align:center}

.btn{font:inherit;font-weight:800;font-size:calc(var(--u)*13);line-height:1.1;color:var(--ink);background:#fff;border:calc(var(--u)*2) solid var(--ink);border-radius:calc(var(--u)*5);padding:calc(var(--u)*5) calc(var(--u)*10) calc(var(--u)*4);box-shadow:inset 0 calc(var(--u)*-3) 0 #e6dcc2,0 calc(var(--u)*3) 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:calc(var(--u)*5);justify-content:center;white-space:nowrap;position:relative}

.btn.org{background:#f6a12e;color:#fff;box-shadow:inset 0 calc(var(--u)*-3) 0 #d4801a,0 calc(var(--u)*3) 0 var(--ink);text-shadow:0 calc(var(--u)*1.5) 0 var(--ink)}
.btn.sm{font-size:calc(var(--u)*10);padding:calc(var(--u)*3) calc(var(--u)*6) calc(var(--u)*2);border-width:calc(var(--u)*1.5);box-shadow:inset 0 calc(var(--u)*-2) 0 #e6dcc2,0 calc(var(--u)*2) 0 var(--ink)}
.btn.ic{width:calc(var(--u)*30);height:calc(var(--u)*30);padding:0;font-size:calc(var(--u)*14)}
.btn.mid{font-size:calc(var(--u)*10.5);padding:calc(var(--u)*5) calc(var(--u)*6) calc(var(--u)*4);gap:calc(var(--u)*3)}
.coin{display:inline-block;flex:none;width:calc(var(--u)*10);height:calc(var(--u)*10);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0 0 18%,#ffd23a 24% 58%,#eea600 64%);border:calc(var(--u)*1.4) solid #7a4a00;vertical-align:middle}
.topbar{position:absolute;top:calc(var(--st) + var(--u)*8);left:calc(var(--u)*8);right:calc(var(--u)*8);display:flex;justify-content:space-between;align-items:center}
.coinbox{pointer-events:auto;background:rgba(84,56,71,.85);color:#fff;font-weight:800;font-size:calc(var(--u)*13);border-radius:calc(var(--u)*20);padding:calc(var(--u)*2) calc(var(--u)*10) calc(var(--u)*1) calc(var(--u)*5);display:flex;align-items:center;gap:calc(var(--u)*5);border:calc(var(--u)*1.5) solid #fff}
.modesel{display:flex;align-items:center;gap:calc(var(--u)*6)}
.modebox{background:rgba(255,255,255,.92);border:calc(var(--u)*2) solid var(--ink);border-radius:calc(var(--u)*6);width:calc(var(--u)*150);text-align:center;padding:calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*2);box-shadow:0 calc(var(--u)*3) 0 var(--ink)}
.modebox b{display:block;font-size:calc(var(--u)*15);line-height:1.15}
.modebox span{display:block;font-size:calc(var(--u)*9);font-weight:600;line-height:1.2;color:#7a6070}
#tapCv{width:calc(var(--u)*32);height:calc(var(--u)*52);image-rendering:pixelated;animation:tapb 1s ease-in-out infinite}
@keyframes tapb{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-5))}}
.taplbl{font-weight:800;color:#e8343c;font-size:calc(var(--u)*11);--o:calc(var(--u)*1.2)}
.fadeout{animation:fo .28s forwards}
@keyframes fo{to{opacity:0}}
.pausebtn{position:absolute;top:calc(var(--st) + var(--u)*10);left:calc(var(--u)*10)}
.panel{width:calc(var(--u)*226);height:calc(var(--u)*114);background:#ded895;border:calc(var(--u)*2) solid var(--ink);border-radius:calc(var(--u)*6);box-shadow:inset 0 0 0 calc(var(--u)*2) #fbf6c8,inset 0 0 0 calc(var(--u)*3.5) #c9b56a,0 calc(var(--u)*3) 0 var(--ink);display:flex;justify-content:space-between;padding:calc(var(--u)*11) calc(var(--u)*14)}
.lbl{font-size:calc(var(--u)*10);font-weight:800;color:#e0703a;line-height:1.1;letter-spacing:calc(var(--u)*.3)}
.num{font-size:calc(var(--u)*25);font-weight:800;line-height:1.05;--o:calc(var(--u)*1.6)}
.pl{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*4)}
.pr{display:flex;flex-direction:column;align-items:flex-end}
.medalwrap{width:calc(var(--u)*50);height:calc(var(--u)*50);border-radius:50%;background:#d0c47e;position:relative;box-shadow:inset 0 calc(var(--u)*2) 0 #b8ab62}
#medalCv{width:100%;height:100%;image-rendering:pixelated;display:block}
.spark{position:absolute;color:#fff;font-size:calc(var(--u)*11);line-height:1;pointer-events:none;animation:sp .5s ease-out both;text-shadow:0 0 calc(var(--u)*2) #fff}
@keyframes sp{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(0)}}
.new{display:inline-block;background:#e8343c;color:#fff;font-size:calc(var(--u)*8);padding:0 calc(var(--u)*4);border-radius:calc(var(--u)*3);margin-right:calc(var(--u)*4);vertical-align:middle;line-height:1.5}
.earn{background:rgba(84,56,71,.88);color:#fff;font-weight:800;font-size:calc(var(--u)*12);border-radius:calc(var(--u)*20);padding:calc(var(--u)*2) calc(var(--u)*12) calc(var(--u)*1);display:flex;align-items:center;gap:calc(var(--u)*5)}
.rankline{background:#fff8dc;border:calc(var(--u)*1.5) solid var(--ink);border-radius:calc(var(--u)*6);font-weight:800;font-size:calc(var(--u)*11);padding:calc(var(--u)*3) calc(var(--u)*6);display:flex;align-items:center;gap:calc(var(--u)*5)}
.rankline input,.namebox input{font:inherit;font-weight:800;font-size:calc(var(--u)*12);width:calc(var(--u)*92);border:calc(var(--u)*1.5) solid var(--ink);border-radius:calc(var(--u)*4);padding:calc(var(--u)*1) calc(var(--u)*5);color:var(--ink);background:#fff;user-select:text;-webkit-user-select:text}
#sOver.anim .gameover{animation:drop .5s ease-out both}
#sOver.anim .panel{animation:rise .45s .45s cubic-bezier(.2,.8,.3,1) both}
#sOver.anim .after{animation:fin .3s 1.15s both}
@keyframes drop{0%{transform:translateY(calc(var(--u)*-30));opacity:0}60%{transform:translateY(calc(var(--u)*5));opacity:1}100%{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(calc(var(--u)*420))}to{transform:none}}
@keyframes fin{from{opacity:0;transform:translateY(calc(var(--u)*6))}to{opacity:1;transform:none}}
.pbox{background:#ded895;border:calc(var(--u)*2) solid var(--ink);border-radius:calc(var(--u)*8);padding:calc(var(--u)*14) calc(var(--u)*18);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*10);box-shadow:inset 0 0 0 calc(var(--u)*2) #fbf6c8,0 calc(var(--u)*3) 0 var(--ink)}
#sPause{background:rgba(0,0,0,.35)}
.modal{position:absolute;inset:0;background:rgba(20,10,20,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:calc(var(--st) + var(--u)*10) calc(var(--u)*8) calc(var(--u)*10)}
.modal.show{display:flex}
.mbox{width:100%;max-height:100%;background:#ded895;border:calc(var(--u)*2) solid var(--ink);border-radius:calc(var(--u)*8);display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 0 0 calc(var(--u)*2) #fbf6c8,0 calc(var(--u)*3) 0 var(--ink)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--u)*8) calc(var(--u)*8) calc(var(--u)*4) calc(var(--u)*12);font-size:calc(var(--u)*18);font-weight:800}
.mhead .coinbox{font-size:calc(var(--u)*11)}
.mtabs{display:flex;gap:calc(var(--u)*4);overflow-x:auto;padding:calc(var(--u)*2) calc(var(--u)*8) calc(var(--u)*6);touch-action:pan-x;flex:none;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-weight:800;font-size:calc(var(--u)*10.5);color:var(--ink);background:#fff8dc;border:calc(var(--u)*1.5) solid var(--ink);border-radius:calc(var(--u)*12);padding:calc(var(--u)*2) calc(var(--u)*8) calc(var(--u)*1);white-space:nowrap;cursor:pointer}
.tab.on{background:#f6a12e;color:#fff}
.mbody{overflow-y:auto;padding:calc(var(--u)*2) calc(var(--u)*8) calc(var(--u)*10);touch-action:pan-y;-webkit-overflow-scrolling:touch;user-select:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*6)}
.card{background:#fff8dc;border:calc(var(--u)*1.5) solid var(--ink);border-radius:calc(var(--u)*6);padding:calc(var(--u)*4);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2)}
.card.eq{background:#d9f7b0;box-shadow:0 0 0 calc(var(--u)*1.5) #5ec22e}
.card canvas{width:100%;aspect-ratio:4/3;image-rendering:pixelated;border-radius:calc(var(--u)*3);background:#4ec0ca}
.card .cn{font-size:calc(var(--u)*9.5);font-weight:800;text-align:center;line-height:1.1;height:calc(var(--u)*21);display:flex;align-items:center;justify-content:center;overflow:hidden}
.shopwrap{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:calc(var(--u)*2);margin:0 calc(var(--u)*-2);scrollbar-width:thin;scrollbar-color:#a08070 transparent;border-radius:calc(var(--u)*6)}
.shopwrap::-webkit-scrollbar{width:calc(var(--u)*4)}.shopwrap::-webkit-scrollbar-thumb{background:#a08070;border-radius:calc(var(--u)*3)}
.sec{font-weight:800;font-size:calc(var(--u)*12);margin:calc(var(--u)*6) 0 calc(var(--u)*4)}
.li{display:flex;align-items:center;gap:calc(var(--u)*7);background:#fff8dc;border:calc(var(--u)*1.5) solid var(--ink);border-radius:calc(var(--u)*6);padding:calc(var(--u)*5) calc(var(--u)*7);margin-bottom:calc(var(--u)*5)}
.li.lock{opacity:.6}
.li .ico{font-size:calc(var(--u)*17);width:calc(var(--u)*22);text-align:center;flex:none}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:calc(var(--u)*11);line-height:1.15}
.li .tx span{display:block;font-size:calc(var(--u)*9);font-weight:600;line-height:1.2;color:#7a6070}
.li .rw{font-weight:800;font-size:calc(var(--u)*10);display:flex;align-items:center;gap:calc(var(--u)*3);flex:none}
.bar{height:calc(var(--u)*5);background:#e6dcc2;border-radius:calc(var(--u)*3);margin-top:calc(var(--u)*3);overflow:hidden}
.bar i{display:block;height:100%;background:#5ec22e}
.rk{display:flex;align-items:center;gap:calc(var(--u)*6);background:#fff8dc;border-bottom:calc(var(--u)*1) solid #e6dcc2;padding:calc(var(--u)*4) calc(var(--u)*6);font-size:calc(var(--u)*11);font-weight:800}
.rk:first-child{border-radius:calc(var(--u)*6) calc(var(--u)*6) 0 0}
.rk .n{width:calc(var(--u)*18);color:#e0703a}
.rk .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk small{font-size:calc(var(--u)*8);color:#9a8090;font-weight:600}
.rkwrap{border:calc(var(--u)*1.5) solid var(--ink);border-radius:calc(var(--u)*6);overflow:hidden}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*4)}
.stats div{background:#fff8dc;border:calc(var(--u)*1.5) solid var(--ink);border-radius:calc(var(--u)*5);padding:calc(var(--u)*3) calc(var(--u)*6);font-size:calc(var(--u)*9);font-weight:600}
.stats b{display:block;font-size:calc(var(--u)*13)}
.namebox{display:flex;align-items:center;gap:calc(var(--u)*6);font-weight:800;font-size:calc(var(--u)*11);margin:calc(var(--u)*4) 0}
.empty{text-align:center;font-weight:600;font-size:calc(var(--u)*11);padding:calc(var(--u)*14) 0;color:#7a6070}
.shareimg{max-width:100%;max-height:calc(var(--u)*300);margin:0 auto;border:calc(var(--u)*2) solid var(--ink);border-radius:calc(var(--u)*6);display:block;user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default;pointer-events:auto}
#toasts{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*78);left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:30;pointer-events:none}
.toast{background:rgba(59,42,53,.94);color:#fff;font-weight:800;font-size:calc(var(--u)*11);padding:calc(var(--u)*4) calc(var(--u)*12) calc(var(--u)*3);border-radius:calc(var(--u)*14);border:calc(var(--u)*1.5) solid #fff;max-width:92%;text-align:center;animation:tin .25s ease-out both}
.toast.out{animation:tout .35s ease-in both}

@keyframes tout{to{transform:translateY(calc(var(--u)*20));opacity:0}}

</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="probe"></div>

  <!-- MÀN HÌNH CHÍNH -->
  <div id="sTitle" class="screen">
    <div class="topbar">
      <div class="coinbox"><i class="coin"></i><span id="coinTxt">0</span></div>
      <div class="row"><button class="btn langbtn" id="bLang" title="Ngôn ngữ / Language"></button><button class="btn ic" id="bSound" title="Âm thanh">🔊</button><button class="btn ic" id="bVibe" title="Rung">📳</button></div>
    </div>
    <div class="col" style="top:calc(var(--st) + var(--u)*(var(--gy)*0.09 + 16))"><div class="logo out" id="logo"></div></div>
    <div class="col" style="top:calc(var(--st) + var(--u)*(var(--gy)*0.47 + 16));gap:calc(var(--u)*10)">
      <div class="modesel"><button class="btn ic" id="mPrev">◀</button><div class="modebox"><b id="modeName">Cổ điển</b><span id="modeDesc"></span></div><button class="btn ic" id="mNext">▶</button></div>
      <button class="btn sm" id="bGhost">👻 Đua bóng ma: Tắt</button>
      <button class="btn play" id="bPlay"><span class="tri"></span><span data-i18n="CHƠI">CHƠI</span></button>
    </div>
    <div class="col" style="bottom:calc(var(--u)*38)">
      <div class="row"><button class="btn mid" id="bShop" data-i18n="🛒 Cửa hàng">🛒 Cửa hàng</button><button class="btn mid" id="bAch" data-i18n="🏆 Thành tựu">🏆 Thành tựu</button><button class="btn mid" id="bRank" data-i18n="📊 Xếp hạng">📊 Xếp hạng</button></div>
    </div>
  </div>

  <!-- SẴN SÀNG -->
  <div id="sReady" class="screen">
    <div class="col" style="top:calc(var(--u)*(var(--gy)*0.17));gap:calc(var(--u)*6)">
      <div class="title2 out ready-t" data-i18n="Sẵn sàng!">Sẵn sàng!</div>
      <div class="lbl-w out" id="readyInfo"></div>
    </div>
    <div class="col" style="top:calc(var(--u)*(var(--gy)*0.5 - 40));left:calc(var(--u)*100);gap:calc(var(--u)*2)">
      <canvas id="tapCv" width="16" height="26"></canvas>
      <div class="taplbl out" data-i18n="CHẠM">CHẠM</div>
    </div>
    <div class="col" style="top:calc(var(--u)*(var(--gy)*0.5 + 48))"><div class="lbl-w out" id="readyGhost"></div></div>
  </div>

  <!-- HUD -->
  <div id="sHud" class="screen"><button class="btn ic pausebtn" id="bPause">❚❚</button></div>

  <!-- TẠM DỪNG -->
  <div id="sPause" class="screen">
    <div class="col" style="top:calc(var(--u)*(var(--gy)*0.3))">
      <div class="pbox">
        <div class="title2 out" style="color:#ffd84a" data-i18n="Tạm dừng">Tạm dừng</div>
        <button class="btn play" id="bResume"><span class="tri"></span><span data-i18n="Tiếp tục">Tiếp tục</span></button>
        <button class="btn mid" id="bQuit" data-i18n="🏠 Về menu">🏠 Về menu</button>
      </div>
    </div>
  </div>

  <!-- KẾT THÚC -->
  <div id="sOver" class="screen">
    <div class="col" style="top:calc(var(--u)*(var(--gy)*0.17))"><div class="title2 out over-t gameover">Game Over</div></div>

function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(h,a){const c=hex2rgb(h);return c.map(v=>Math.max(0,Math.min(255,Math.round(a>=0?v+(255-v)*a:v*(1+a)))));}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function blank(w,h){return Array.from({length:h},()=>Array(w).fill('.'));}
function fromStr(a){return a.map(r=>r.split(''));}
function pad(g,p){const w=g[0].length+2*p;const e=()=>Array(w).fill('.');const o=[];for(let i=0;i<p;i++)o.push(e());for(const r of g)o.push([...Array(p).fill('.'),...r,...Array(p).fill('.')]);for(let i=0;i<p;i++)o.push(e());return o;}
function addOutline(g,ch='k'){const h=g.length,w=g[0].length,o=g.map(r=>r.slice());for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(g[y][x]!=='.')continue;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<h&&xx>=0&&xx<w&&g[yy][xx]!=='.'){o[y][x]=ch;break;}}}return o;}
function paint(g,pal){const h=g.length,w=g[0].length,c=mkCanvas(w,h),x2=c.getContext('2d');const id=x2.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=g[y][x];if(ch==='.'||!pal[ch])continue;const rgb=hex2rgb(pal[ch]);const i=(y*w+x)*4;id.data[i]=rgb[0];id.data[i+1]=rgb[1];id.data[i+2]=rgb[2];id.data[i+3]=255;}x2.putImageData(id,0,0);return c;}
const inE=(x,y,cx,cy,rx,ry)=>((x+.5-cx)/rx)**2+((y+.5-cy)/ry)**2<=1;
function disc(g,cx,cy,r,col){g.fillStyle=col;for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++){const dy=y+.5-cy;const q=r*r-dy*dy;if(q<0)continue;const w=Math.sqrt(q);const x0=Math.round(cx-w),x1=Math.round(cx+w);if(x1>x0)g.fillRect(x0,y,x1-x0,1);}}

const BOX=4,BOY=2,BGW2=30,BGH2=20;
function birdGrid(sp,frame,tuft){
  const S=SPECIES[sp]||SPECIES.classic;const g=blank(BGW2,BGH2);
  const set=(x,y,c)=>{x+=BOX;y+=BOY;if(x>=0&&x<BGW2&&y>=0&&y<BGH2)g[y][x]=c;};
  const get=(x,y)=>{x+=BOX;y+=BOY;return(x>=0&&x<BGW2&&y>=0&&y<BGH2)?g[y][x]:'.';};
  const cx=9.5,cy=9,rx=S.rx||6.6,ry=S.ry||5.2,bl=S.belly||[cx+2,cy+2.6,4.6,2.9];
  for(let y=-BOY;y<BGH2-BOY;y++)for(let x=-BOX;x<BGW2-BOX;x++){if(!inE(x,y,cx,cy,rx,ry))continue;let c='b';
    if(inE(x,y,bl[0],bl[1],bl[2],bl[3]))c='l';else if(y<=cy-ry+1.7&&x>=7&&x<=11)c='h';else if(y>=cy+ry-2.2)c='d';set(x,y,c);}
  if(S.paint)S.paint(set,get);
  for(const[x,y,c]of(S.tail||CLASSIC_TAIL))set(x,y,c);
  for(const[x,y,c]of(S.beak||CLASSIC_BEAK))set(x,y,c);
  for(const[x,y,c]of(S.eye||CLASSIC_EYE))set(x,y,c);
  if(tuft)for(const[x,y,c]of(S.crest||[]))set(x,y,c);
  for(const[x,y,c]of(S.feet||[]))set(x,y,c);
  // cánh: 0 = giơ lên, 1 = giữa, 2 = hạ xuống
  const Wg=S.wing||{rx:4,ry:2.4,ys:[6.6,9.2,11.3]};const wy=Wg.ys[frame];const wing=[];
  for(let y=-BOY;y<BGH2-BOY;y++)for(let x=-BOX;x<BGW2-BOX;x++)if(inE(x,y,7,wy,Wg.rx,Wg.ry))wing.push([x,y]);
  if(frame===0)wing.push([3,4],[4,4],[4,3],[5,4]);
  if(frame===2)wing.push([4,13],[5,13],[4,14],[5,14],[6,13]);
  const ws=new Set(wing.map(([x,y])=>(y+50)*100+x+50));const has=(x,y)=>ws.has((y+50)*100+x+50);
  for(const[x,y]of wing){let edge=false;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(!has(x+dx,y+dy))edge=true;
    set(x,y,edge?'k':(has(x,y+1)&&!has(x,y+2)?'G':'g'));}
  return addOutline(g);
}

function colShade(i,w){if(i===0||i===w-1)return null;const t=i/(w-1);if(t<0.1)return 0.12;if(t<0.22)return 0.6;if(t<0.3)return 0.3;if(t<0.62)return 0;if(t<0.8)return -0.2;return -0.38;}
const pipeCache={};
function getPipe(key){
  if(pipeCache[key])return pipeCache[key];const P=PIPES[key]||PIPES.green;const K=hex2rgb('#543847');
  const mk=(w,h,fn)=>{const c=mkCanvas(w,h),g=c.getContext('2d'),d=g.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const rgb=fn(x,y);const i=(y*w+x)*4;d.data[i]=rgb[0];d.data[i+1]=rgb[1];d.data[i+2]=rgb[2];d.data[i+3]=255;}g.putImageData(d,0,0);return c;};
  const body=mk(24,420,(x,y)=>{const s=colShade(x,24);return s===null?K:shade(P.base(x,y),s);});
  const capB=mk(26,12,(x,y)=>{if(x===0||x===25||y===0||y===11)return K;let s=colShade(x,26);if(y===10)s=Math.min(s,0)-0.35;if(y===1)s=s+0.12;return shade(P.base(x,y+3),Math.max(-0.6,Math.min(0.75,s)));});
  const capT=mkCanvas(26,12);const t=capT.getContext('2d');t.translate(0,12);t.scale(1,-1);t.drawImage(capB,0,0);
  return pipeCache[key]={body,capB,capT};
}

    if(!c.mag){c.x=c.wx-G.dist;c.y=gapC(c.pipe)+c.off;if(pw.magnet>0&&Math.hypot(c.x-b.x,c.y-b.y)<150)c.mag=true;}
    if(c.mag){const dx2=b.x-c.x,dy2=b.y-c.y,d=Math.hypot(dx2,dy2)||1;const v=Math.min(d,480*dt);c.x+=dx2/d*v;c.y+=dy2/d*v;}
    if(Math.hypot(c.x-b.x,c.y-b.y)<r+10){c.taken=true;G.runCoins++;SFX.play('coin');floatText('+1',c.x,c.y-8,'#ffd23a');
      for(let i=0;i<5;i++)G.parts.push({type:'spark',x:c.x,y:c.y,vx:(R()-.5)*120,vy:(R()-.5)*120,life:.35,max:.35,size:2});}}
  G.coins=G.coins.filter(c=>!c.taken&&(c.mag||c.wx-G.dist>-30));
  // vật phẩm
  for(const it of G.items){if(it.taken)continue;it.x=it.wx-G.dist;it.y=Math.max(40,Math.min(groundY-40,gapC(it.pipe)+it.off));
    if(Math.hypot(it.x-b.x,it.y-b.y)<r+14){it.taken=true;pw[it.type]=PW_MAX[it.type];G.itemsUsed++;SFX.play('power');floatText(tr(PW_NAME[it.type]),b.x+10,b.y-22,ICONS[it.type].col);vibrate(20);}}
  G.items=G.items.filter(i=>!i.taken&&i.wx-G.dist>-30);
  // ghi lại đường bay cho bóng ma
  while(G.dist>=G.recNext){G.rec.y.push(Math.round(b.y*2));G.rec.r.push(Math.round(b.rot));G.recNext+=2;}
  if(G.ghostOn&&!G.ghostBeat&&G.dist/2>G.ghost.y.length+4){G.ghostBeat=true;toast(L('👻 Bạn đã vượt qua bóng ma!','👻 You passed your ghost!'));SFX.play('ach');}
}
function practiceHit(){G.hits++;G.hitCd=0.6;G.flash=0.45;G.flashCol='#ff5a5a';SFX.play('hit');vibrate(30);}
function useShield(){G.pw.shield=0;G.invuln=1.2;G.shieldSaved=true;SFX.play('shield');vibrate(40);G.flash=.4;G.flashCol='#9be7ff';
  for(let i=0;i<10;i++)G.parts.push({type:'spark',x:G.bird.x,y:G.bird.y,vx:(R()-.5)*220,vy:(R()-.5)*220,life:.5,max:.5,size:3,col:'#8fd3ff'});}
function die(ground){
  const b=G.bird;G.state='dying';b.dead=true;SFX.play('hit');vibrate(ground?60:[50,40,80]);G.flash=1;G.flashCol='#fff';G.shake=.3;
  const col=birdPal(G.speciesKey,G.colorKey);
  for(let i=0;i<6;i++)G.parts.push({type:'feather',x:b.x,y:b.y,vx:(R()-.5)*120,vy:-60-R()*80,life:1.4,max:1.4,size:3,rot:R()*6,vr:(R()-.5)*10,col:i%2?col.b:col.g});
  show();
  if(ground)enterOver();else{b.vy=Math.max(b.vy,0);SFX.play('die');}
}
function enterOver(){
  if(G.state==='over')return;G.state='over';G.bird.dead=true;G.bird.frame=1;
  const res=finishRun();G.lastRes=res;setTimeout(()=>{if(G.state==='over')showOver(res);},450);
}
function finishRun(){
  const m=G.mode,sc=G.score;
  const bonus=Math.floor(sc/5),earned=G.runCoins+bonus;
  save.coins+=earned;const st=save.stats;st.games++;st.pipes+=sc;st.coinsEarned+=earned;st.flaps+=G.runFlaps;st.time+=G.runTime;st.items+=G.itemsUsed;if(G.shieldSaved)st.shields++;
  const prev=save.best[m]||0,newBest=sc>prev;if(newBest)save.best[m]=sc;
  if(newBest&&sc>0)storeGhost(m,{seed:G.seed,score:sc,y:G.rec.y,r:G.rec.r});
  let rank=-1;
  if(sc>0){const bd=save.board[m];const e={n:save.name||tr('Bạn'),s:sc,d:dateStr(),id:Date.now()};bd.push(e);bd.sort((a,c)=>c.s-a.s||a.id-c.id);save.board[m]=bd.slice(0,10);rank=save.board[m].indexOf(e);if(rank>=0)G.lastEntry=e;}
  const run={score:sc,mode:m,tod:G.tod,nightScore:G.nightScore,sawSunset:G.sawSunset,weather:G.weather,meteor:G.meteorSeen,shield:G.shieldSaved,ghostBeat:G.ghostOn&&newBest,coins:G.runCoins,items:G.itemsUsed,flaps:G.runFlaps};
  progressDaily(run);checkAch(run);persist();
  return{sc,best:save.best[m],prev,newBest,earned,bonus,rank,mode:m};
}
function ensureDaily(){const ds=dateStr();if(!save.daily||save.daily.date!==ds){const rng=mulberry32(hashStr(ds));const pool=MISSIONS.slice(),list=[];
  while(list.length<3){const i=Math.floor(rng()*pool.length);list.push({id:pool[i].id,p:0,done:false});pool.splice(i,1);}save.daily={date:ds,list};persist();}}
function progressDaily(run){ensureDaily();for(const it of save.daily.list){if(it.done)continue;const M=MISSIONS.find(x=>x.id===it.id);if(!M)continue;let v=it.p;
  switch(M.kind){case'games':v+=1;break;case'bestRun':v=Math.max(v,run.score);break;case'coins':v+=run.coins;break;case'pipes':v+=run.score;break;
    case'modeRun':if(run.mode===M.mode)v=Math.max(v,run.score);break;case'items':v+=run.items;break;case'nightRun':v=Math.max(v,run.nightScore);break;case'flaps':v+=run.flaps;break;}
  it.p=Math.min(M.goal,v);if(it.p>=M.goal){it.done=true;save.coins+=M.reward;toast(L(`✅ Xong nhiệm vụ: ${M.txt} (+${M.reward} xu)`,`✅ Mission done: ${tr(M.txt)} (+${M.reward} coins)`));}}}
function checkAch(run){for(const A of ACHS){if(!save.ach[A.id]&&A.test(run)){save.ach[A.id]=dateStr();save.coins+=A.reward;toast(L(`🏆 Thành tựu: ${A.name} (+${A.reward} xu)`,`🏆 Achievement: ${tr(A.name)} (+${A.reward} coins)`));SFX.play('ach');}}}

/* ================== HIỆU ỨNG ================== */
function updWeather(dt){
  if(G.weather==='rain'){for(const d of G.wx){d.y+=d.v*dt;d.x-=d.v*0.18*dt;if(d.y>groundY){d.y=-10-R()*40;d.x=R()*(W+80);}}
    if(G.night>0.6&&R()<dt/9){G.flash=Math.max(G.flash,.35);G.flashCol='#e8f0ff';SFX.play('thunder');}}
  else if(G.weather==='snow'){for(const f of G.wx){f.y+=f.v*dt;f.x+=Math.sin(G.t*1.5+f.ph)*18*dt;if(f.y>groundY){f.y=-5;f.x=R()*W;}if(f.x<-4)f.x=W+2;if(f.x>W+4)f.x=-2;}}
  if(G.meteor){G.metT-=dt;if(G.metT<=0&&G.night>0.6){if(G.state==='play')G.meteorSeen=true;G.metT=1.6+R()*3.5;G.meteors.push({x:ri(120,W+60),y:ri(-10,Math.round(groundY*0.25)),vx:-240-R()*140,vy:110+R()*60,life:.9,max:.9});}
    for(const m of G.meteors){m.x+=m.vx*dt;m.y+=m.vy*dt;m.life-=dt;}G.meteors=G.meteors.filter(m=>m.life>0);}
}
function updParts(dt){for(const p of G.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.type==='chip'){p.vy+=520*dt;p.vx*=0.99;}
  else if(p.type==='feather'){p.vy=Math.min(60,p.vy+200*dt);p.vx*=0.98;p.rot+=p.vr*dt;}else if(p.type==='puff'){p.vx*=0.9;p.vy*=0.9;}}
  G.parts=G.parts.filter(p=>p.life>0);}

/* ================== VẼ ================== */
function txt(c,s,x,y,size,fill='#fff',align='center',lw){c.font=`800 ${size}px ${FONT}`;c.textAlign=align;c.textBaseline='middle';c.lineJoin='round';c.lineWidth=lw||Math.max(3,size*0.16);c.strokeStyle='#3b2a35';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y);}
function drawPipeRaw(c,sp,sx,top,bot){
  const tb=top-24,nh=Math.min(420,Math.ceil((tb+40)/2));if(nh>0)c.drawImage(sp.body,0,420-nh,24,nh,sx+2,tb-nh*2,48,nh*2);
  c.drawImage(sp.capT,sx,top-24,52,24);c.drawImage(sp.capB,sx,bot,52,24);
  const nb=Math.min(420,Math.ceil((groundY-bot-24)/2)+2);if(nb>0)c.drawImage(sp.body,0,0,24,nb,sx+2,bot+24,48,nb*2);
}
function dentGeom(d,sx,cc){const k0=Math.min(1,d.t/0.1),k=k0<1?k0*1.15:1;const x=sx+d.lx,y=cc+d.dy;
  return d.face==='v'?{x,y,rx:6*k,ry:10*k}:{x,y,rx:10*k,ry:6*k};}
function drawPipe(c,p){
  const sp=G.pipeSpr;let sx=p.wx-G.dist;if(sx>W+10||sx<-60)return;
  if(p.wob>0)sx+=Math.sin(G.t*70)*2.4*(p.wob/0.3);
  const cc=gapC(p),top=cc-p.gap/2,bot=cc+p.gap/2;
  if(!p.dents||!p.dents.length){drawPipeRaw(c,sp,sx,top,bot);return;}
  const gs=p.dents.map(d=>dentGeom(d,sx,cc));
  const holes=()=>{c.beginPath();c.rect(-60,-60,W+120,H+120);for(const g of gs){if(g.rx<=0)continue;c.moveTo(g.x+g.rx,g.y);c.ellipse(g.x,g.y,g.rx,g.ry,0,0,Math.PI*2);}};
  // 1) vẽ ống, khoét phần bị móp
  c.save();holes();c.clip('evenodd');drawPipeRaw(c,sp,sx,top,bot);c.restore();
  // 2) bóng đổ, viền sáng, vết nứt quanh chỗ móp (chỉ nằm trên thân ống)
  p.dents.forEach((d,i)=>{const g=gs[i];if(g.rx<=0)return;
    const pr=d.part==='top'?[sx,-60,PIPE_W,top+60]:[sx,bot,PIPE_W,groundY-bot+4];
    c.save();c.beginPath();c.rect(pr[0],pr[1],pr[2],pr[3]);c.clip();holes();c.clip('evenodd');
    c.fillStyle='rgba(40,20,30,.25)';c.beginPath();c.ellipse(g.x,g.y,g.rx+7,g.ry+7,0,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(40,20,30,.22)';c.beginPath();c.ellipse(g.x,g.y,g.rx+3,g.ry+3,0,0,Math.PI*2);c.fill();
    c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=1.4;c.beginPath();
    if(d.face==='v')c.ellipse(g.x,g.y,g.rx+3,g.ry+3,0,-0.9,0.9);else if(d.part==='top')c.ellipse(g.x,g.y,g.rx+3,g.ry+3,0,Math.PI+0.5,Math.PI*2-0.5);else c.ellipse(g.x,g.y,g.rx+3,g.ry+3,0,0.5,Math.PI-0.5);c.stroke();
    if(d.t>0.06){c.strokeStyle='rgba(60,30,45,.75)';c.lineWidth=1;c.beginPath();
      for(let j=0;j<3;j++){let ang=d.a+j*0.8;if(d.face==='v')ang=-0.9+((d.a+j*0.9)%1.8);else if(d.part==='top')ang=Math.PI+0.4+((d.a+j*0.9)%(Math.PI-0.8));else ang=0.4+((d.a+j*0.9)%(Math.PI-0.8));
        const r0x=g.rx+1,r0y=g.ry+1,L=5+((d.a*7+j*3)%5);const x0=g.x+Math.cos(ang)*r0x,y0=g.y+Math.sin(ang)*r0y;
        c.moveTo(x0,y0);const xm=x0+Math.cos(ang+0.35)*L*0.6,ym=y0+Math.sin(ang+0.35)*L*0.6;c.lineTo(xm,ym);c.lineTo(xm+Math.cos(ang-0.3)*L*0.5,ym+Math.sin(ang-0.3)*L*0.5);}
      c.stroke();}
    c.restore();
    // viền tối theo mép lõm
    c.save();c.beginPath();c.rect(pr[0],pr[1],pr[2],pr[3]);c.clip();c.strokeStyle='#543847';c.lineWidth=2;c.beginPath();c.ellipse(g.x,g.y,g.rx,g.ry,0,0,Math.PI*2);c.stroke();c.restore();
  });
}
function draw(){
  const c=ctx;c.setTransform(1,0,0,1,0,0);c.imageSmoothingEnabled=false;
  let ox=0,oy=0;if(G.shake>0){const k=G.shake/0.3*4;ox=(R()-.5)*k;oy=(R()-.5)*k;}
  c.setTransform(pxs,0,0,pxs,ox*pxs,oy*pxs);c.imageSmoothingEnabled=false;
  drawBackground(c);
  if(G.weather==='rain'){c.fillStyle='rgba(20,40,60,.2)';c.fillRect(-10,-10,W+20,groundY+12);}
  // ống
  if(G.state!=='title')for(const p of G.pipes)drawPipe(c,p);
  // xu
  for(const co of G.coins){if(co.taken||co.x===undefined)continue;const f=coinFrames[Math.floor(G.t*10+co.wx*0.05)%8];c.drawImage(f,co.x-f.width,co.y-f.height,f.width*2,f.height*2);}
  // vật phẩm
  for(const it of G.items){if(it.taken||it.x===undefined)continue;const I=ICONS[it.type],yy=it.y+Math.sin(G.t*4+it.wx)*3,rr=13+Math.sin(G.t*6)*0.8;
    c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(it.x,yy,rr,0,7);c.fill();c.lineWidth=2;c.strokeStyle=I.col;c.stroke();c.lineWidth=1;c.strokeStyle='#fff';c.beginPath();c.arc(it.x,yy,rr-2,0,7);c.stroke();
    c.drawImage(I.c,it.x-I.c.width,yy-I.c.height,I.c.width*2,I.c.height*2);c.fillStyle='rgba(255,255,255,.8)';c.fillRect(it.x-7,yy-9,3,3);}
  // bóng ma
  if(G.ghostOn&&G.ghost&&(G.state==='play'||G.state==='dying')){const idx=Math.floor(G.dist/2);if(idx<G.ghost.y.length){const gy=G.ghost.y[idx]/2,gr=G.ghost.r[idx]||0;
    drawBird(c,BIRD_X,gy,gr,gr>=60?1:[0,1,2,1][Math.floor(G.t*14)%4],G.speciesKey,G.colorKey,'none','none',1,1,0.38);
    c.globalAlpha=.7;txt(c,'👻',BIRD_X,gy-24,10,'#fff','center',2);c.globalAlpha=1;}}
  // chim
  if(G.bird){const b=G.bird,s=G.pw.shrink>0?0.6:1;const blink=G.invuln>0&&Math.floor(G.t*20)%2===0;
    if(G.pw.shield>0&&G.state==='play'){c.strokeStyle='rgba(143,211,255,.9)';c.lineWidth=2;c.fillStyle='rgba(143,211,255,.18)';c.beginPath();c.arc(b.x,b.y,19*s+Math.sin(G.t*8),0,7);c.fill();c.stroke();}
    if(!blink)drawBird(c,b.x,b.y,b.rot,b.frame,G.speciesKey,G.colorKey,save.equip.hat,save.equip.glass,s*(1-0.07*b.sq),s*(1+0.1*b.sq));}
  // hạt
  for(const p of G.parts){const a=Math.max(0,p.life/p.max);c.globalAlpha=a;
    if(p.type==='puff'){c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,p.size*(1.4-a*0.4),0,7);c.fill();}
    else if(p.type==='chip'){c.fillStyle=p.col;c.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
    else if(p.type==='fire'){c.fillStyle=p.col;const z=p.size*a;c.fillRect(p.x-z/2,p.y-z/2,z,z);}
    else if(p.type==='spark'){c.fillStyle=p.col||'#fff6b0';c.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
    else if(p.type==='feather'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-4,-1.5,8,3);c.fillStyle='#3b2a35';c.fillRect(-4,-0.5,8,1);c.restore();}
    else if(p.type==='text'){c.globalAlpha=Math.min(1,a*2);txt(c,p.txt,p.x,p.y,13,p.col,'center',3);}}
  c.globalAlpha=1;
  // thời tiết
  if(G.weather==='rain'){c.strokeStyle='rgba(210,230,255,.55)';c.lineWidth=1.2;c.beginPath();for(const d of G.wx){c.moveTo(d.x,d.y);c.lineTo(d.x+d.v*0.18*0.02,d.y-d.v*0.02);}c.stroke();}
  else if(G.weather==='snow'){c.fillStyle='rgba(255,255,255,.9)';for(const f of G.wx)c.fillRect(f.x,f.y,f.s,f.s);}
  // mặt đất
  c.drawImage(groundCv,0,0,156,56,-(G.groundOff%12),groundY,312,112);
  if(G.pw.slow>0&&G.state==='play'){c.fillStyle='rgba(120,90,255,.12)';c.fillRect(-10,-10,W+20,H+20);}
  c.setTransform(pxs,0,0,pxs,0,0);
  // HUD
  const st=G.state;
  if(st==='play'||st==='dying'||st==='ready')txt(c,String(G.score),W/2,safeTop+58,40,'#fff','center',7);
  if(st==='play'){
    if(G.mode==='practice')txt(c,L(`Va chạm: ${G.hits}`,`Hits: ${G.hits}`),W-10,safeTop+24,13,'#fff','right',3);
    else{const f=coinFrames[0];c.drawImage(f,W-46-f.width*0.8,safeTop+24-f.height*0.8,f.width*1.6,f.height*1.6);txt(c,String(G.runCoins),W-34,safeTop+25,14,'#fff','left',3);}
    let px=W-24,py=safeTop+52;
    for(const k of['shield','slow','shrink','magnet']){const v=G.pw[k];if(v<=0)continue;const I=ICONS[k];
      c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.arc(px,py,11,0,7);c.fill();c.strokeStyle=I.col;c.lineWidth=2;c.stroke();c.drawImage(I.c,px-I.c.width*0.8,py-I.c.height*0.8,I.c.width*1.6,I.c.height*1.6);
      if(k!=='shield'){c.strokeStyle='#3b2a35';c.lineWidth=3;c.beginPath();c.arc(px,py,14,-Math.PI/2,-Math.PI/2+Math.PI*2*(v/PW_MAX[k]));c.stroke();}
      px-=30;}
  }
  if(G.flash>0){c.globalAlpha=Math.min(1,G.flash);c.fillStyle=G.flashCol;c.fillRect(0,0,W,H);c.globalAlpha=1;}
}

let sparkTimer=null,countTimer=null;
function showOver(res){
  const el=$('sOver');el.classList.remove('anim');void el.offsetWidth;el.classList.add('anim');show('sOver');SFX.play('swoosh');

  if(res.rank>=0){rk.style.display='flex';rk.innerHTML=L(`🏅 Hạng ${res.rank+1} · Tên:`,`🏅 Rank ${res.rank+1} · Name:`)+` <input id="oName" maxlength="14" placeholder="${L('Tên bạn','Your name')}">`;const inp=$('oName');inp.value=save.name||'';
    inp.addEventListener('input',()=>{save.name=inp.value.trim();if(G.lastEntry)G.lastEntry.n=save.name||tr('Bạn');persist();});}
  else rk.style.display='none';
  G.overReady=false;clearInterval(countTimer);clearInterval(sparkTimer);
  setTimeout(()=>{let n=0;const tot=res.sc;const stepMs=Math.max(20,Math.min(60,900/Math.max(1,tot)));
    const fin=()=>{$('oScore').textContent=tot;$('oBest').textContent=res.best;if(res.newBest)$('oNew').style.display='inline-block';
      const tier=medalOf(tot);drawMedal(mc,tier);if(tier){sparkTimer=setInterval(sparkle,450);}G.overReady=true;};
    if(tot===0){fin();return;}
    countTimer=setInterval(()=>{n++;$('oScore').textContent=n;$('oBest').textContent=Math.max(n,prevBest);if(n>=tot){clearInterval(countTimer);fin();}},stepMs);},950);
}
function sparkle(){if(G.state!=='over'){clearInterval(sparkTimer);return;}const w=$('medalWrap');const s=document.createElement('div');s.className='spark';s.textContent='✦';
  const a=R()*6.28,d=R()*16;s.style.left=`calc(50% + var(--u)*${(Math.cos(a)*d-5).toFixed(1)})`;s.style.top=`calc(50% + var(--u)*${(Math.sin(a)*d-6).toFixed(1)})`;w.appendChild(s);setTimeout(()=>s.remove(),520);}
function drawMedal(c,tier){const g=c.getContext('2d');g.clearRect(0,0,24,24);if(!tier)return;
  const P=[null,{o:'#7a3e14',b:'#d98b44',h:'#f6c08a',d:'#b06a2c'},{o:'#5f6672',b:'#c9ced6',h:'#ffffff',d:'#9aa1ad'},{o:'#7a5600',b:'#f5c542',h:'#fff3a8',d:'#cf980c'},{o:'#3f6a7a',b:'#dff3f7',h:'#ffffff',d:'#8fc7d6'}][tier];
  const gr=blank(24,24);for(let y=0;y<24;y++)for(let x=0;x<24;x++){const dx=x+.5-12,dy=y+.5-12,d=Math.hypot(dx,dy);if(d>11)continue;let ch='b';
    if(d>9.8)ch='o';else if(d>8.4)ch=(dx+dy<-3)?'h':(dx+dy>5?'d':'b');else if(d>7.4)ch='d';else{const ad=Math.abs(dx)+Math.abs(dy);ch=ad<=3.2?'h':(ad<=4.6&&(Math.abs(dx)<1.2||Math.abs(dy)<1.2)?'h':'b');if(dx<-2&&dy<-2&&d<6.5&&d>4.5)ch='h';}gr[y][x]=ch;}
  g.drawImage(paint(gr,P),0,0);}

/* ---------- Toast ---------- */
const toastQ=[];let toastBusy=false;
function toast(m){toastQ.push(m);if(!toastBusy)nextToast();}
function nextToast(){const m=toastQ.shift();if(!m){toastBusy=false;return;}toastBusy=true;const el=document.createElement('div');el.className='toast';el.textContent=m;$('toasts').appendChild(el);
  setTimeout(()=>el.classList.add('out'),2300);setTimeout(()=>{el.remove();nextToast();},2650);}

/* ---------- Modal ---------- */
let modalTab=null,modalKind=null;
const modalOpen=()=>$('modal').classList.contains('show');
function openModal(kind,tab){modalKind=kind;modalTab=tab;$('modal').classList.add('show');renderModal();SFX.play('click');}
function closeModal(){$('modal').classList.remove('show');refreshTitle();}
function renderModal(){
  $('mCoin').textContent=save.coins;$('mCoinBox').style.display=modalKind==='lang'?'none':'';const tabs=$('mTabs'),body=$('mBody');tabs.innerHTML='';body.innerHTML='';body.scrollTop=0;
  const mkTabs=(list)=>{for(const[k,l]of list){const b=document.createElement('button');b.className='tab'+(k===modalTab?' on':'');b.textContent=tr(l);b.onclick=()=>{modalTab=k;renderModal();SFX.play('click');};tabs.appendChild(b);}};
  if(modalKind==='shop'){$('mTitle').textContent=L('🛒 Cửa hàng','🛒 Shop');mkTabs([['species','Loài chim'],['color','Màu chim'],['hat','Mũ'],['glass','Kính'],['pipe','Ống'],['bg','Hình nền']]);renderShop(body);}
  else if(modalKind==='ach'){$('mTitle').textContent=L('🏆 Thành tựu','🏆 Achievements');tabs.style.display='none';renderAch(body);return;}
  else if(modalKind==='rank'){$('mTitle').textContent=L('📊 Xếp hạng','📊 Rankings');mkTabs(RANKED.map(k=>[k,MODES[k].name]).concat([['stats','Thống kê']]));renderRank(body);}
  else if(modalKind==='share'){$('mTitle').textContent=L('📤 Chia sẻ','📤 Share');tabs.style.display='none';renderShare(body);return;}
  else if(modalKind==='lang'){$('mTitle').textContent=L('🌐 Ngôn ngữ','🌐 Language');tabs.style.display='none';renderLang(body);return;}
  tabs.style.display='flex';
}
function shopList(cat){
  const src={species:SPECIES,color:BIRD_COLORS,hat:HATS,glass:GLASSES,pipe:PIPES,bg:BGS}[cat];
  const head=[];if(cat==='color')head.push(['natural','Màu gốc của loài',0]);if(cat!=='hat'&&cat!=='glass')head.push(['random','Ngẫu nhiên',0]);
  const items=Object.keys(src).map((id,i)=>[id,src[id].name,src[id].price,i]);
  items.sort((a,b)=>a[2]-b[2]||a[3]-b[3]);
  return head.concat(items.map(x=>x.slice(0,3)));
}
const previewBgCache={};
function preview(cat,id){
  const c=mkCanvas(64,48),g=c.getContext('2d');g.imageSmoothingEnabled=false;
  if(cat==='bg'&&id!=='random'){g.drawImage(genSky('day',110),0,38,96,72,0,0,64,48);g.drawImage(genFar(id,'day'),0,FH-72,96,72,0,0,64,48);return c;}
  g.fillStyle='#4ec0ca';g.fillRect(0,0,64,48);
  if(id==='random'){g.font=`800 26px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=4;g.strokeStyle='#3b2a35';g.strokeText('?',32,26);g.fillStyle='#fff';g.fillText('?',32,26);return c;}
  if(cat==='pipe'){const p=getPipe(id);g.drawImage(p.capB,19,14);g.drawImage(p.body,0,0,24,24,20,26,24,24);g.drawImage(p.capT,19,-4);return c;}
  const sp=cat==='species'?id:(save.equip.species==='random'?'classic':save.equip.species);
  const col=cat==='color'?id:(cat==='species'||save.equip.color==='random'?'natural':save.equip.color);
  drawBird(g,32,26,0,1,sp,col,cat==='hat'?id:'none',cat==='glass'?id:'none');return c;
}
function renderShop(body){
  const cat=modalTab;const grid=document.createElement('div');grid.className='grid';
  for(const[id,name,price]of shopList(cat)){const owned=id==='random'||id==='none'||id==='natural'||save.owned[cat].includes(id),eq=save.equip[cat]===id;
    const card=document.createElement('div');card.className='card'+(eq?' eq':'');card.appendChild(preview(cat,id));
    const n=document.createElement('div');n.className='cn';n.textContent=tr(name);card.appendChild(n);
    const b=document.createElement('button');b.className='btn sm';
    if(eq)b.textContent=tr('Đang dùng');else if(owned)b.textContent=tr('Dùng');else b.innerHTML=`<i class="coin"></i>${price}`;
    b.onclick=()=>{if(eq)return;if(!owned){if(save.coins<price){toast(L('Chưa đủ xu! Chơi thêm để kiếm xu nhé 💪','Not enough coins! Play more to earn some 💪'));SFX.play('click');return;}
        save.coins-=price;save.owned[cat].push(id);SFX.play('buy');toast(L(`Đã mua ${name}!`,`Bought ${tr(name)}!`));}else SFX.play('click');
      save.equip[cat]=id;if(cat==='species'&&id!=='classic'&&id!=='random'&&save.equip.color==='random'){save.equip.color='natural';toast(L('Màu chim đã chuyển về "Màu gốc của loài"','Bird color set to "Natural colors"'));}
      applyEquip(cat);checkAch(null);persist();const keep=wrap.scrollTop;renderModal();const nw=document.querySelector('.shopwrap');if(nw)nw.scrollTop=keep;};
    card.appendChild(b);grid.appendChild(card);}
  const wrap=document.createElement('div');wrap.className='shopwrap';wrap.appendChild(grid);body.appendChild(wrap);
  const ch=grid.firstChild?grid.firstChild.offsetHeight:0;if(ch)wrap.style.height=(ch*3+u*6*2+u*4)+'px';
  const note=document.createElement('div');note.className='small';note.style.marginTop='calc(var(--u)*8)';
  note.textContent=cat==='species'?L('Các loài chỉ khác nhau về hình dáng, độ khó như nhau. "Ngẫu nhiên" đổi loài mỗi ván trong số loài bạn có.','Species only differ in looks; difficulty is the same. "Random" picks one of your species each round.'):(cat==='color'?L('"Màu gốc" giữ màu tự nhiên của loài. "Ngẫu nhiên" đổi màu mỗi ván trong số màu bạn có.','"Natural colors" keeps the species\' own colors. "Random" picks one of your colors each round.'):(cat==='bg'?L('Hình nền là phong cảnh xa phía sau. Cảnh gần (phố, nghĩa trang, ruộng lúa, suối, rừng, làng quê) đổi liên tục khi bay, ngày đêm cũng tự chuyển dần.','Scenery is the distant view. Nearby areas (town, graveyard, rice fields, stream, forest, village) keep changing as you fly, and day turns to night gradually.'):L('"Ngẫu nhiên" sẽ chọn ngẫu nhiên trong các món bạn đang có mỗi ván. Ngày/đêm và thời tiết luôn ngẫu nhiên.','"Random" picks one of your items each round. Time of day and weather are always random.')));body.appendChild(note);
}
function applyEquip(cat){if(G.state!=='title')return;if(cat==='species'||cat==='color'){G.speciesKey=save.equip.species==='random'?pick(ownedReal('species')):save.equip.species;G.colorKey=save.equip.color==='random'?pick(ownedReal('color')):save.equip.color;}
  if(cat==='bg'||cat==='pipe'){if(cat==='bg'&&save.equip.bg!=='random'){G.theme=save.equip.bg;buildScene();}}}
function renderAch(body){
  ensureDaily();let h=`<div class="sec">${L('📅 Nhiệm vụ hôm nay','📅 Today\'s missions')}</div>`;
  for(const it of save.daily.list){const M=MISSIONS.find(x=>x.id===it.id);if(!M)continue;
    h+=`<div class="li${it.done?'':' '}"><div class="ico">${it.done?'✅':'🎯'}</div><div class="tx"><b>${esc(tr(M.txt))}</b><span>${it.p}/${M.goal}</span><div class="bar"><i style="width:${Math.round(it.p/M.goal*100)}%"></i></div></div><div class="rw"><i class="coin"></i>${M.reward}</div></div>`;}
  const got=ACHS.filter(a=>save.ach[a.id]).length;h+=`<div class="sec">${L('🏆 Thành tựu','🏆 Achievements')} (${got}/${ACHS.length})</div>`;
  for(const A of ACHS){const ok=!!save.ach[A.id];h+=`<div class="li${ok?'':' lock'}"><div class="ico">${ok?A.ic:'🔒'}</div><div class="tx"><b>${esc(tr(A.name))}</b><span>${esc(tr(A.desc))}${ok?' · '+save.ach[A.id]:''}</span></div><div class="rw"><i class="coin"></i>${A.reward}</div></div>`;}
  body.innerHTML=h;}
function fmtTime(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h?L(`${h}g ${m}p`,`${h}h ${m}m`):L(`${m}p ${ss}s`,`${m}m ${ss}s`);}
function renderRank(body){
  let h=`<div class="namebox">${L('Tên của bạn:','Your name:')} <input id="nameIn" maxlength="14" placeholder="${tr('Bạn')}"></div>`;
  if(modalTab==='stats'){const s=save.stats;
    h+=`<div class="stats"><div>${L('Số ván','Rounds')}<b>${s.games}</b></div><div>${L('Tổng ống đã vượt','Pipes passed')}<b>${s.pipes}</b></div><div>${L('Tổng xu kiếm được','Coins earned')}<b>${s.coinsEarned}</b></div><div>${L('Số lần vỗ cánh','Flaps')}<b>${s.flaps}</b></div><div>${L('Thời gian chơi','Play time')}<b>${fmtTime(s.time)}</b></div><div>${L('Vật phẩm đã dùng','Power-ups used')}<b>${s.items}</b></div>`;
    for(const k of RANKED)h+=`<div>${L('Kỷ lục '+MODES[k].name,'Best · '+tr(MODES[k].name))}<b>${save.best[k]||0}</b></div>`;
    h+=`<div>${L('Thành tựu','Achievements')}<b>${Object.keys(save.ach).length}/${ACHS.length}</b></div></div>`;}
  else{const bd=save.board[modalTab]||[];
    if(!bd.length)h+=`<div class="empty">${L('Chưa có điểm nào ở chế độ này.<br>Chơi một ván để ghi tên lên bảng!','No scores in this mode yet.<br>Play a round to get on the board!')}</div>`;
    else{h+='<div class="rkwrap">';bd.forEach((e,i)=>{h+=`<div class="rk"><span class="n">#${i+1}</span><span class="nm">${esc(e.n)} ${MEDAL_EMO[medalOf(e.s)]}</span><small>${esc(e.d)}</small><span>${e.s}</span></div>`;});h+='</div>';}
    h+=`<div class="small" style="margin-top:calc(var(--u)*8)">${L('Bảng xếp hạng lưu trên máy này.','Rankings are saved on this device.')}</div>`;}
  body.innerHTML=h;const ni=$('nameIn');ni.value=save.name||'';ni.addEventListener('input',()=>{save.name=ni.value.trim();persist();});
}
function renderLang(body){
  body.innerHTML=[['vi','Tiếng Việt'],['en','English']].map(([k,n])=>`<button class="langopt${save.settings.lang===k?' on':''}" data-l="${k}">${flagHTML(k)}<span>${n}</span>${save.settings.lang===k?'<span class="ck">✔</span>':''}</button>`).join('');
  for(const b of body.querySelectorAll('.langopt'))b.onclick=()=>{save.settings.lang=b.dataset.l;persist();SFX.play('click');applyLang();};
}
function makeShareCanvas(){
  const res=G.lastRes||{sc:G.score,best:0,mode:G.mode};const sw=540,sh=Math.round(540*H/W);const c=mkCanvas(sw,sh),g=c.getContext('2d');g.imageSmoothingEnabled=false;
  g.drawImage(cv,0,0,sw,sh);const k=sw/W;g.setTransform(k,0,0,k,0,0);
  g.fillStyle='rgba(30,15,30,.5)';g.fillRect(0,groundY*0.14,W,groundY*0.62);
  txt(g,GAME_NAME(),W/2,groundY*0.22,isEN()?30:26,'#ffd84a','center',6);
  txt(g,L('Tui đạt được','I scored'),W/2,groundY*0.34,15,'#fff','center',4);
  txt(g,String(res.sc),W/2,groundY*0.47,58,'#fff','center',9);
  const t=medalOf(res.sc);txt(g,L(`${MODES[res.mode].name}${t?' · Huy chương '+MEDALS_VI[t]:''} · Kỷ lục ${res.best}`,`${tr(MODES[res.mode].name)}${t?' · '+MEDALS_EN[t]+' medal':''} · Best ${res.best}`),W/2,groundY*0.6,12,'#ffe9a8','center',3);
  txt(g,L('Bạn có vượt qua được không?','Can you beat me?'),W/2,groundY*0.69,13,'#fff','center',3);
  return c;}
function renderShare(body){
  const c=makeShareCanvas();let url='';try{url=c.toDataURL('image/png');}catch(e){}
  const res=G.lastRes||{sc:0,mode:'classic'};const text=L(`Tui đạt ${res.sc} điểm ở chế độ ${MODES[res.mode].name} trong Cánh Chim Nghị Lực! Bạn có vượt qua được không? 🐦`,`I scored ${res.sc} in ${tr(MODES[res.mode].name)} mode on Wings of Will! Can you beat me? 🐦`);
  body.innerHTML=`<img class="shareimg" alt="${L('Ảnh điểm','Score image')}" src="${url}"><div class="small" style="margin:calc(var(--u)*6) 0">${L('Nhấn giữ (điện thoại) hoặc chuột phải (máy tính) vào ảnh để lưu.','Long-press (phone) or right-click (computer) the image to save it.')}</div><div class="row" style="flex-wrap:wrap"><button class="btn org" id="shNative">${L('📤 Gửi bạn bè','📤 Send to friends')}</button><button class="btn" id="shCopy">${L('📋 Chép lời khoe','📋 Copy brag text')}</button></div>`;
  const nb=$('shNative');
  nb.onclick=async()=>{try{const blob=await new Promise(r=>c.toBlob(r,'image/png'));const file=new File([blob],'wings-of-will.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],text,title:GAME_NAME()});
      else if(navigator.share)await navigator.share({text,title:GAME_NAME()});
      else toast(L('Trình duyệt này chưa hỗ trợ gửi trực tiếp, hãy lưu ảnh rồi gửi nhé!','This browser can\'t share directly. Save the image and send it!'));}
    catch(e){if(e&&e.name!=='AbortError')toast(L('Không gửi trực tiếp được, hãy lưu ảnh rồi gửi nhé!','Couldn\'t share directly. Save the image and send it!'));}};
  $('shCopy').onclick=async()=>{try{await navigator.clipboard.writeText(text);toast(L('Đã chép lời khoe!','Brag text copied!'));}catch(e){toast(L('Không chép được: ','Couldn\'t copy: ')+text);}};
}

/* ================== BỐ CỤC ================== */
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;
  const oldGY=groundY;H=Math.max(480,Math.min(640,W*vh/vw));groundY=H-GROUND_H;
  let dh=vh,dw=dh*W/H;if(dw>vw){dw=vw;dh=dw*H/W;}
  stage.style.width=dw+'px';stage.style.height=dh+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(dw*dpr);cv.height=Math.round(dh*dpr);pxs=cv.width/W;
  u=dw/W;stage.style.setProperty('--u',u+'px');stage.style.setProperty('--gy',groundY);
  safeTop=($('probe').offsetHeight||0)/u;
  if(oldGY!==groundY&&G.twinkle.length)G.twinkle.forEach(s=>{s.y=Math.min(s.y,groundY*0.5);});
}
let rzT=null;const onRz=()=>{clearTimeout(rzT);rzT=setTimeout(resize,60);};
window.addEventListener('resize',onRz);window.addEventListener('orientationchange',onRz);if(window.visualViewport)window.visualViewport.addEventListener('resize',onRz);

/* ================== ĐIỀU KHIỂN ================== */
function onTap(){if(modalOpen()||G.paused)return;if(G.state==='ready')startPlay();else if(G.state==='play')flap();}
stage.addEventListener('pointerdown',e=>{SFX.ensure();if(e.target.closest('button,input,.modal,a,img'))return;e.preventDefault();onTap();});
window.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;SFX.ensure();const k=e.code;
  if(k==='Space'||k==='ArrowUp'||k==='KeyW'||k==='Enter'){e.preventDefault();if(e.repeat||modalOpen())return;
    if(G.paused){resume();return;}if(G.state==='title')goPlay();else if(G.state==='ready')startPlay();else if(G.state==='play')flap();else if(G.state==='over'&&G.overReady)goPlay();}
  else if(k==='Escape'||k==='KeyP'){if(modalOpen())closeModal();else if(G.state==='play'){G.paused?resume():pause();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
window.addEventListener('blur',()=>pause());
const on=(id,fn)=>$(id).addEventListener('click',e=>{e.stopPropagation();SFX.ensure();fn(e);});
on('bPlay',()=>goPlay());
on('mPrev',()=>{const i=MODE_KEYS.indexOf(save.mode);save.mode=MODE_KEYS[(i+MODE_KEYS.length-1)%MODE_KEYS.length];persist();refreshTitle();SFX.play('click');});
on('mNext',()=>{const i=MODE_KEYS.indexOf(save.mode);save.mode=MODE_KEYS[(i+1)%MODE_KEYS.length];persist();refreshTitle();SFX.play('click');});
on('bGhost',()=>{save.settings.ghost=!save.settings.ghost;persist();refreshTitle();SFX.play('click');});
on('bSound',()=>{save.settings.sound=!save.settings.sound;persist();refreshTitle();SFX.play('click');});
on('bVibe',()=>{save.settings.vibe=!save.settings.vibe;persist();refreshTitle();vibrate(40);SFX.play('click');});
on('bShop',()=>openModal('shop','species'));on('bLang',()=>openModal('lang'));on('bAch',()=>openModal('ach'));on('bRank',()=>openModal('rank',RANKED.includes(save.mode)?save.mode:'classic'));
on('mClose',()=>{closeModal();SFX.play('click');});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
on('bPause',()=>{pause();SFX.play('click');});on('bResume',()=>{resume();SFX.play('click');});
on('bQuit',()=>{G.paused=false;if(G.mode!=='practice'&&G.score>0){G.state='over';finishRun();}fade(goTitle);});
on('bRetry',()=>{if(G.overReady)goPlay();});on('bMenu',()=>{if(G.overReady)fade(goTitle);});
on('bShare',()=>{if(G.overReady)openModal('share');});

/* ================== VÒNG LẶP ================== */
let last=performance.now(),acc=0;
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.1)dt=0.1;if(dt<0)dt=0;
  if(!G.paused){acc+=dt;let n=0;while(acc>=STEP&&n<24){update(STEP);acc-=STEP;n++;}}
  draw();requestAnimationFrame(loop);}
load();ensureDaily();resize();goTitle();applyLang();
if(document.fonts&&document.fonts.load)document.fonts.load(`800 40px "Baloo 2"`).catch(()=>{});
requestAnimationFrame(t=>{last=t;loop(t);});
window.__G=G;G._dbg={genSeg,genFar,genSky,BIOMES};
})();
</script>
