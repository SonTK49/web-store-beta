<script>
(()=>{
'use strict';
/* ================== HẰNG SỐ ================== */
let W=288;const GROUND_H=112, STEP=1/120, LANDSCAPE_ZOOM=1.2;
const GRAV=1250, FLAP=-345, MAXFALL=540, PIPE_W=52, SPACING=168, BASE_SPEED=118, GAP=102;

// hàng đợi việc nặng (vẽ sẵn cảnh nền...) chạy rải rác mỗi khung hình để không gây giật
const workQ=[];const queueWork=fn=>workQ.push(fn);

// Safari/iPhone: vẽ canvas lên canvas mỗi khung hình rất tốn (phải tải lại ảnh lên GPU).

const IMG=c=>c._bmp||c;
function prune(a,keep){let j=0;for(let i=0;i<a.length;i++){const x=a[i];if(keep(x))a[j++]=x;}a.length=j;return a;}
const $=id=>document.getElementById(id);
const stage=$('stage'), cv=$('game'), ctx=cv.getContext('2d',{alpha:false,desynchronized:false}), hudCv=$('hud'), hctx=hudCv.getContext('2d');let hpxs=1,hudClear=true;
const VIEW={portrait:false,landscape:false,switching:false,token:0,snapshot:null,animations:[]};
const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================== LƯU TRỮ ================== */
const SKEY='chimvocanh_save_v1', GKEY='chimvocanh_ghost_v1_';
function defSave(){return{coins:0,name:'',mode:'classic',
  owned:{species:['random','classic','chick','penguin'],color:['random','yellow','red','blue'],hat:['none'],glass:['none'],pipe:['random','green','red'],bg:['random','city'],scarf:['none','random'],gear:['none','random'],pattern:['none','random']},
  equip:{species:'classic',color:'random',hat:'none',glass:'none',pipe:'random',bg:'random',scarf:'none',gear:'none',pattern:'none'},
  best:{classic:0,hard:0,moving:0,items:0},
  board:{classic:[],hard:[],moving:[],items:[]},
  stats:{games:0,pipes:0,coinsEarned:0,flaps:0,time:0,items:0,shields:0},
  box:{next:0,v:0},ach:{},daily:null,settings:{sound:true,vibe:true,ghost:false,lang:'vi',graphics:'classic',pixel:'low',customColor:'#43a9e8',rainDensity:100,snowDensity:100,uiOpacity:80}};}
let save=defSave();
function merge(d,s){if(!s||typeof s!=='object')return d;for(const k in s){const v=s[k];if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k])&&v&&typeof v==='object'&&!Array.isArray(v))merge(d[k],v);else d[k]=v;}return d;}
// Chỉ lưu tiến độ và lựa chọn; không lưu hình, âm thanh hay cache đồ họa.
// Ngân sách gồm cả tên khóa, tính theo UTF-16 (2 byte/ký tự), chặt hơn UTF-8 với dữ liệu này.
function saveSize(json){const t=SKEY+json;let utf8=0;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);if(c<128)utf8++;else if(c<2048)utf8+=2;else if(c>=0xd800&&c<=0xdbff&&i+1<t.length){utf8+=4;i++;}else utf8+=3;}return Math.max(t.length*2,utf8);}
const SAVE_LIMIT=9600,SAVE_MODES=['classic','hard','moving','items'],SAVE_CATS=['species','color','hat','glass','pipe','bg','scarf','gear','pattern'];
const SAVE_STATS=['games','pipes','coinsEarned','flaps','time','items','shields'];
const ghostMem={};let storageBytes=0,storageOK=true;
const safeNum=n=>Math.max(0,Math.min(Number.MAX_SAFE_INTEGER,Math.round(Number(n)||0)));
function effectValue(value,fallback){const n=Number(value);return value==null||!Number.isFinite(n)?fallback:Math.max(10,Math.min(100,Math.round(n)));}
function packSave(){return{v:2,c:safeNum(save.coins),n:String(save.name||'').slice(0,14),m:save.mode,
  o:SAVE_CATS.map(k=>[...new Set(save.owned[k])]),e:SAVE_CATS.map(k=>save.equip[k]),b:SAVE_MODES.map(k=>safeNum(save.best[k])),
  l:SAVE_MODES.map(k=>(save.board[k]||[]).slice(0,10).map(e=>[String(e.n||'').slice(0,14),safeNum(e.s),e.d,safeNum(e.id)])),
  s:SAVE_STATS.map(k=>safeNum(save.stats[k])),a:save.ach,d:save.daily,x:[safeNum(save.box&&save.box.next),(save.box&&save.box.v)|0],
  t:[+!!save.settings.sound,+!!save.settings.vibe,+!!save.settings.ghost,save.settings.lang,save.settings.graphics,save.settings.pixel||'low',save.settings.customColor||'#43a9e8',save.settings.rainDensity,save.settings.snowDensity,save.settings.uiOpacity],g:{}};}
function unpackSave(p){const s=defSave();s.coins=p.c||0;s.name=p.n||'';s.mode=p.m||'classic';
  SAVE_CATS.forEach((k,i)=>{if(Array.isArray(p.o?.[i]))s.owned[k]=p.o[i];if(p.e?.[i])s.equip[k]=p.e[i];});
  SAVE_MODES.forEach((k,i)=>{s.best[k]=p.b?.[i]||0;s.board[k]=(p.l?.[i]||[]).map(e=>({n:e[0],s:e[1],d:e[2],id:e[3]}));});
  SAVE_STATS.forEach((k,i)=>s.stats[k]=p.s?.[i]||0);s.ach=p.a||{};s.daily=p.d||null;s.box={next:+(p.x?.[0])||0,v:(p.x?.[1])|0};
  if(p.t){s.settings={sound:!!p.t[0],vibe:!!p.t[1],ghost:!!p.t[2],lang:p.t[3]||'vi',graphics:p.t[4]||'classic',pixel:p.t[5]||'low',customColor:/^#[0-9a-f]{6}$/i.test(p.t[6]||'')?p.t[6]:'#43a9e8',rainDensity:effectValue(p.t[7],100),snowDensity:effectValue(p.t[8],100),uiOpacity:effectValue(p.t[9],80)};}
  return s;}
const G64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function encodeGhost(g,n){const len=g.y.length,count=Math.max(2,Math.min(n,len)),step=(g.step||2)*(len-1)/(count-1);let data='';
  for(let i=0;i<count;i++){const ix=i*(len-1)/(count-1),a=Math.floor(ix),b=Math.min(len-1,a+1),f=ix-a;
    const y=Math.max(0,Math.min(65535,Math.round(g.y[a]*(1-f)+g.y[b]*f)));
    const rot=Math.max(0,Math.min(255,Math.round(((g.r[a]||0)*(1-f)+(g.r[b]||0)*f+180)/2)));
    const v=y*256+rot;data+=G64[v>>>18&63]+G64[v>>>12&63]+G64[v>>>6&63]+G64[v&63];}
  return[g.seed,g.score,g.off||318,Math.round(step*1000000)/1000000,data];}
function decodeGhost(a){if(!Array.isArray(a)||typeof a[4]!=='string'||a[4].length%4)return null;const y=[],r=[];
  for(let i=0;i<a[4].length;i+=4){let v=0;for(let j=0;j<4;j++){const q=G64.indexOf(a[4][i+j]);if(q<0)return null;v=v*64+q;}y.push(v>>>8);r.push((v&255)*2-180);}
  return y.length>1?{seed:a[0],score:a[1],off:a[2],step:Math.max(.001,a[3]),y,r}:null;}
function load(){try{const raw=localStorage.getItem(SKEY),p=raw?JSON.parse(raw):null;
  save=p?.v===2?unpackSave(p):merge(defSave(),p);
  for(const m of SAVE_MODES){let g=p?.v===2?decodeGhost(p.g?.[m]):null;
    if(!g){try{const old=localStorage.getItem(GKEY+m);if(old)g=JSON.parse(old);}catch(e){}}
    if(g?.y?.length>1)ghostMem[m]=g;
  }
  if(!['classic','vector','soft','modern'].includes(save.settings.graphics))save.settings.graphics='classic';
  if(!/^#[0-9a-f]{6}$/i.test(save.settings.customColor||''))save.settings.customColor='#43a9e8';
  if(!['low','medium','high'].includes(save.settings.pixel))save.settings.pixel='low';
  for(const [key,fallback]of [['rainDensity',100],['snowDensity',100],['uiOpacity',80]])save.settings[key]=effectValue(save.settings[key],fallback);
  delete save.owned.trail;delete save.equip.trail;
  save.owned.bg=save.owned.bg.filter(id=>id!=='goldenRice'&&id!=='apartments');
  if(save.equip.bg==='goldenRice'||save.equip.bg==='apartments')save.equip.bg='city';
  // Bản Blindbox: reset loài một lần (giữ nguyên xu, mọi món khác giữ nguyên); có sẵn 1 lượt mở miễn phí.
  if(!save.box||typeof save.box!=='object')save.box={next:0,v:0};
  if((save.box.v|0)<1){save.owned.species=['random','classic','chick','penguin'];if(!save.owned.species.includes(save.equip.species))save.equip.species='classic';save.box={next:0,v:1};}
  save.owned.species=save.owned.species.filter(id=>id==='random'||SPECIES[id]);if(save.equip.species!=='random'&&!save.owned.species.includes(save.equip.species))save.equip.species='classic';
 }catch(e){save=defSave();}}
function persist(){try{const p=packSave(),keys=SAVE_MODES.filter(m=>ghostMem[m]?.y?.length>1);
  let json=JSON.stringify(p);
  // Bình thường vẫn giữ đủ 10 điểm/chế độ; dự phòng cho dữ liệu cũ bất thường.
  while(saveSize(json)>SAVE_LIMIT-keys.length*128){
    let a=p.l.reduce((best,x)=>x.length>best.length?x:best,[]);if(!a.length)break;a.pop();json=JSON.stringify(p);
  }
  const room=Math.max(0,Math.floor((SAVE_LIMIT/2-SKEY.length-json.length-keys.length*85)/Math.max(1,keys.length)/4));
  let n=Math.min(180,room);for(const m of keys)if(n>=2)p.g[m]=encodeGhost(ghostMem[m],n);
  json=JSON.stringify(p);
  while(saveSize(json)>SAVE_LIMIT&&n>2){n--;for(const m of keys)p.g[m]=encodeGhost(ghostMem[m],n);json=JSON.stringify(p);}
  if(saveSize(json)>SAVE_LIMIT){p.g={};json=JSON.stringify(p);}
  if(saveSize(json)>SAVE_LIMIT)throw Error('save-budget');
  // Gộp các bản bóng ma cũ vào một bản lưu có giới hạn; giữ điểm, đồ đã mua và thiết lập.
  localStorage.setItem(SKEY,json);for(const m of SAVE_MODES)localStorage.removeItem(GKEY+m);
  storageBytes=saveSize(json);storageOK=true;
  for(const m of keys)if(p.g[m])ghostMem[m]=decodeGhost(p.g[m]);
 }catch(e){storageOK=false;}}
function loadGhost(m){return ghostMem[m]||null;}

function recordFlight(b){const rec=G.rec;
  while(G.dist>=G.recNext){if(rec.y.length>=720){rec.y=rec.y.filter((_,i)=>i%2===0);rec.r=rec.r.filter((_,i)=>i%2===0);rec.step=(rec.step||2)*2;G.recNext=rec.y.length*rec.step;}
    rec.y.push(Math.round(b.y*2));rec.r.push(Math.round(b.rot));G.recNext+=rec.step||2;}}
function ghostPoint(g,d){const q=Math.max(0,d/(g.step||2));if(q>g.y.length-1)return null;const a=Math.floor(q),b=Math.min(g.y.length-1,a+1),f=q-a;
  return{y:(g.y[a]*(1-f)+g.y[b]*f)/2,r:(g.r[a]||0)*(1-f)+(g.r[b]||0)*f};}

/* ================== TIỆN ÍCH ================== */
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(h,a){const c=hex2rgb(h);return c.map(v=>Math.max(0,Math.min(255,Math.round(a>=0?v+(255-v)*a:v*(1+a)))));}
function mkCanvas(w,h,readable=false){const c=document.createElement('canvas');c.width=w;c.height=h;if(readable)c.getContext('2d',{willReadFrequently:true});return c;}
function blank(w,h){return Array.from({length:h},()=>Array(w).fill('.'));}
function fromStr(a){return a.map(r=>r.split(''));}
function pad(g,p){const w=g[0].length+2*p;const e=()=>Array(w).fill('.');const o=[];for(let i=0;i<p;i++)o.push(e());for(const r of g)o.push([...Array(p).fill('.'),...r,...Array(p).fill('.')]);for(let i=0;i<p;i++)o.push(e());return o;}
function addOutline(g,ch='k'){const h=g.length,w=g[0].length,o=g.map(r=>r.slice());for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(g[y][x]!=='.')continue;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<h&&xx>=0&&xx<w&&g[yy][xx]!=='.'){o[y][x]=ch;break;}}}return o;}
function paint(g,pal){const h=g.length,w=g[0].length,c=mkCanvas(w,h),x2=c.getContext('2d');const id=x2.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=g[y][x];if(ch==='.'||!pal[ch])continue;const rgb=hex2rgb(pal[ch]);const i=(y*w+x)*4;id.data[i]=rgb[0];id.data[i+1]=rgb[1];id.data[i+2]=rgb[2];id.data[i+3]=255;}x2.putImageData(id,0,0);return c;}
const inE=(x,y,cx,cy,rx,ry)=>((x+.5-cx)/rx)**2+((y+.5-cy)/ry)**2<=1;
function disc(g,cx,cy,r,col){g.fillStyle=col;for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++){const dy=y+.5-cy;const q=r*r-dy*dy;if(q<0)continue;const w=Math.sqrt(q);const x0=Math.round(cx-w),x1=Math.round(cx+w);if(x1>x0)g.fillRect(x0,y,x1-x0,1);}}
function dateStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

const BOX=4,BOY=2,BGW2=30,BGH2=20;
function birdGrid(sp,frame,tuft){
  const S=SPECIES[sp]||SPECIES.classic;const g=blank(BGW2,BGH2);
  const set=(x,y,c)=>{x+=BOX;y+=BOY;if(x>=0&&x<BGW2&&y>=0&&y<BGH2)g[y][x]=c;};
  const get=(x,y)=>{x+=BOX;y+=BOY;return(x>=0&&x<BGW2&&y>=0&&y<BGH2)?g[y][x]:'.';};
  const cx=9.5,cy=9,rx=S.rx||6.6,ry=S.ry||5.2,bl=S.belly||[cx+2,cy+2.6,4.6,2.9];
  for(let y=-BOY;y<BGH2-BOY;y++)for(let x=-BOX;x<BGW2-BOX;x++){if(!inE(x,y,cx,cy,rx,ry))continue;let c='b';
    if(inE(x,y,bl[0],bl[1],bl[2],bl[3]))c='l';else if(y<=cy-ry+1.7&&x>=7&&x<=11)c='h';else if(y>=cy+ry-2.2)c='d';set(x,y,c);}
  if(S.paint)S.paint(set,get);
  for(const[x,y,c]of(S.tail||CLASSIC_TAIL))set(x,y,c);
  for(const[x,y,c]of(S.beak||CLASSIC_BEAK))set(x,y,c);
  for(const[x,y,c]of(S.eye||CLASSIC_EYE))set(x,y,c);
  if(tuft)for(const[x,y,c]of(S.crest||[]))set(x,y,c);
  for(const[x,y,c]of(S.feet||[]))set(x,y,c);
  // cánh: 0 = giơ lên, 1 = giữa, 2 = hạ xuống
  const Wg=S.wing||{rx:4,ry:2.4,ys:[6.6,9.2,11.3]};const wy=Wg.ys[frame];const wing=[];
  for(let y=-BOY;y<BGH2-BOY;y++)for(let x=-BOX;x<BGW2-BOX;x++)if(inE(x,y,7,wy,Wg.rx,Wg.ry))wing.push([x,y]);
  if(frame===0)wing.push([3,4],[4,4],[4,3],[5,4]);
  if(frame===2)wing.push([4,13],[5,13],[4,14],[5,14],[6,13]);
  const ws=new Set(wing.map(([x,y])=>(y+50)*100+x+50));const has=(x,y)=>ws.has((y+50)*100+x+50);
  for(const[x,y]of wing){let edge=false;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(!has(x+dx,y+dy))edge=true;
    set(x,y,edge?'k':(has(x,y+1)&&!has(x,y+2)?'G':'g'));}
  return addOutline(g);
}

function drawBird(c,x,y,rot,frame,sp,color,hat,glass,sx=1,sy=1,alpha=1,tier=0,snow=0,wingless=false,lookOverride=null){
  const s=getBird(sp,color,wingless||lookOverride?1:frame,hat,glass,tier,wingless,lookOverride);
  // Cổ điển: đặt hình đúng lưới điểm ảnh và xoay theo bước 3° để không bị rung, nhòe từng khung hình.
  if(c===ctx&&!smooth()){x=Math.round(x*pxs)/pxs;y=Math.round(y*pxs)/pxs;rot=Math.round(rot/3)*3;}
  c.save();c.translate(x,y);c.rotate(rot*Math.PI/180);c.scale(sx,sy);if(alpha<1)c.globalAlpha=alpha;c.imageSmoothingEnabled=BIRD_PX>=3;

  c.drawImage(IMG(s),BBX,BBY,BBW,BBH);
  if(sp==='flyingfish'&&frame===0){c.strokeStyle='#d8f7ff';c.lineWidth=.8;c.globalAlpha=alpha*.65;
    c.beginPath();c.arc(-24,12,1.7,0,7);c.moveTo(-27,7);c.arc(-28,7,1,0,7);c.stroke();c.globalAlpha=alpha;}

// Tạo lớp tuyết một lần từ alpha của từng sprite: ôm đầu/lưng/cánh và cả mũ của mọi loài.
// Ba lớp hiện dần theo lượng tuyết; không đọc pixel hay dựng lại canvas mỗi frame.
const birdSnowCache=new WeakMap();
function birdSnowLayers(sprite){
  if(birdSnowCache.has(sprite))return birdSnowCache.get(sprite);
  const w=sprite.width,h=sprite.height,px=w/BBW,a=sprite.getContext('2d').getImageData(0,0,w,h).data;
  const layers=[];
  for(let level=0;level<3;level++){
    const canvas=mkCanvas(w,h),g=canvas.getContext('2d');
    for(let x=0;x<w;x++){
      let top=0;while(top<h&&a[(top*w+x)*4+3]<110)top++;if(top===h)continue;
      const lx=BBX+x/px,ly=BBY+top/px;if(ly>5)continue;
      const irregular=(Math.sin(Math.floor(x/(px*2))*2.1)+1)*.5;
      const y0=top+Math.floor(level*1.25*px),y1=Math.min(h,top+Math.ceil((level+1)*1.25*px+irregular*px));
      for(let y=y0;y<y1;y++){
        if(a[(y*w+x)*4+3]<110||(lx>1&&lx<12&&BBY+y/px>-7))continue;
        g.fillStyle=level===2?'#c9e2f3':((x+y)%5===0?'#dcefff':'#f5fcff');g.fillRect(x,y,1,1);
      }
    }
    layers.push(bm(canvas));
  }
  birdSnowCache.set(sprite,layers);return layers;
}

function colShade(i,w){if(i===0||i===w-1)return null;const t=i/(w-1);if(t<0.1)return 0.12;if(t<0.22)return 0.6;if(t<0.3)return 0.3;if(t<0.62)return 0;if(t<0.8)return -0.2;return -0.38;}
const pipeCache={};
function getPipe(key,mode=gfxMode()){
  if(mode!=='classic')return smoothPipeTexture(key);
  if(pipeCache[key])return pipeCache[key];const P=PIPES[key]||PIPES.green;const K=hex2rgb('#543847');
  const mk=(w,h,fn)=>{const c=mkCanvas(w,h),g=c.getContext('2d'),d=g.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const rgb=fn(x,y);const i=(y*w+x)*4;d.data[i]=rgb[0];d.data[i+1]=rgb[1];d.data[i+2]=rgb[2];d.data[i+3]=255;}g.putImageData(d,0,0);return c;};
  const body=mk(24,420,(x,y)=>{const s=colShade(x,24);return s===null?K:shade(P.base(x,y),s);});
  const capB=mk(26,12,(x,y)=>{if(x===0||x===25||y===0||y===11)return K;let s=colShade(x,26);if(y===10)s=Math.min(s,0)-0.35;if(y===1)s=s+0.12;return shade(P.base(x,y+3),Math.max(-0.6,Math.min(0.75,s)));});

  return pipeCache[key]={body:bm(body),capB:bm(capB),capT:bm(capT)};
}

function weatherDensity(type){return (type==='rain'?save.settings.rainDensity:save.settings.snowDensity)/100;}
function weatherStrength(type){return (G.wxMix[type]||0)*weatherDensity(type);}
function weatherParticleCount(type){return Math.ceil((type==='rain'?G.wx.length:G.snowflakes.length)*weatherDensity(type));}

function initWeather(preserve=false){
  G.wx=[];G.snowflakes=[];

  G.meteors=[];G.wxMix={clear:0,rain:0,snow:0};G.wxMix[G.weather]=1;

}
function changeWeather(next){

}
function advanceWeather(dt){
  if(G.state==='play'&&G.wxBlend>=1){G.wxWait-=dt;
    if(G.wxWait<=0){const choices=['clear','rain','snow'].filter(w=>w!==G.weather);changeWeather(choices[Math.floor(R()*choices.length)]);}}
  if(G.wxBlend<1){G.wxBlend=Math.min(1,G.wxBlend+dt/G.wxDuration);
    const t=G.wxBlend,e=t*t*(3-2*t); // smoothstep: không giật ở hai đầu chuyển cảnh
    for(const w of ['clear','rain','snow'])G.wxMix[w]=G.wxFrom[w]*(1-e)+(w===G.weather?e:0);
    if(t===1){G.wxFrom=null;G.wxWait=12+R()*12;}}
  const rain=weatherStrength('rain'),snow=weatherStrength('snow');
  G.pipeWet=Math.max(0,Math.min(1,G.pipeWet+dt*(rain*.3-(1-rain)*.065)));
  // Tuyết tích tụ dần, tan nhanh hơn khi gặp mưa; không biến mất khi vừa đổi chế độ.
  G.pipeSnow=Math.max(0,Math.min(1,G.pipeSnow+dt*(snow*.065-(1-snow)*(.026+rain*.065))));
}

function flap(){const b=G.bird;b.vy=FLAP;b.since=0;b.animT=1;b.sq=1;G.runFlaps++;SFX.play('wing');

function birdR(){return 11*(G.pw.shrink>0?0.6:1);}
function gapC(p){return p.base+(p.amp?p.amp*Math.sin(p.phase+p.t*p.freq):0);}
function curSpeed(){let s=BASE_SPEED;if(G.mode==='hard')s*=1+Math.min(G.score,50)*0.007;return s;}
function spawnPipe(){
  const rng=G.rng,m=G.mode,s=G.spawned;
  const gap=m==='hard'?Math.max(80,GAP-s*0.6):GAP;
  const minC=Math.max(70+gap/2,groundY-330),maxC=groundY-60-gap/2;
  let base=minC+rng()*(maxC-minC),amp=0,phase=0,freq=0;
  if(m==='moving'){amp=Math.min(14+s*0.9,38);phase=rng()*Math.PI*2;freq=1.1+rng()*0.9;base=Math.min(maxC-amp,Math.max(minC+amp,base));}
  const p={wx:G.nextPipe,base,gap,amp,phase,freq,t:0,scored:false};G.pipes.push(p);
  const cr=rng(),co=rng();
  if(m!=='practice'&&cr<(m==='items'?0.7:0.4))G.coins.push({wx:p.wx+PIPE_W/2,pipe:p,off:(co-0.5)*gap*0.45,taken:false,mag:false});
  const ir=rng(),it=rng(),io=rng();
  if(m==='items'&&s>=2&&ir<0.22)G.items.push({wx:p.wx+PIPE_W/2+SPACING/2,pipe:p,off:(io-0.5)*60,type:['shield','slow','shrink','magnet'][Math.floor(it*4)],taken:false});
  G.spawned++;G.nextPipe+=SPACING;
}
function circRect(cx,cy,r,x,y,w,h){const nx=Math.max(x,Math.min(cx,x+w)),ny=Math.max(y,Math.min(cy,y+h));return(cx-nx)**2+(cy-ny)**2<r*r;}
function hitPipe(p,b,r){const sx=p.wx-G.dist;if(b.x+r<sx||b.x-r>sx+PIPE_W)return null;const c=gapC(p),top=c-p.gap/2,bot=c+p.gap/2;
  const test=(x,y,w,h,part)=>{const nx=Math.max(x,Math.min(b.x,x+w)),ny=Math.max(y,Math.min(b.y,y+h));return(b.x-nx)**2+(b.y-ny)**2<r*r?{nx,ny,part}:null;};
  return test(sx,-2000,PIPE_W,top+2000,'top')||test(sx,bot,PIPE_W,2000,'bot');}
// Vết móp: ghi lại chỗ va chạm trên ống (toạ độ tương đối so với ống để đi theo ống khi ống trôi/di động)
function addDent(p,h){
  const sx=p.wx-G.dist,c=gapC(p),top=c-p.gap/2,bot=c+p.gap/2;let face,x,y;
  if(h.part==='top'&&h.ny>=top-0.01&&h.nx>sx+0.01){face='h';x=Math.max(sx+7,Math.min(sx+PIPE_W-7,h.nx));y=top;}
  else if(h.part==='bot'&&h.ny<=bot+0.01&&h.nx>sx+0.01){face='h';x=Math.max(sx+7,Math.min(sx+PIPE_W-7,h.nx));y=bot;}
  else{face='v';y=h.part==='top'?Math.min(h.ny,top-6):Math.max(h.ny,bot+6);const inCap=h.part==='top'?y>=top-24:y<=bot+24;x=sx+(inCap?0:2);}
  p.dents=p.dents||[];if(p.dents.length>=4)p.dents.shift();
  p.dents.push({lx:x-sx,dy:y-c,face,part:h.part,t:0,a:R()*6.28});p.damageVersion=(p.damageVersion||0)+1;p.wob=0.3;
  if(G.pipeSnow>.05)for(let i=0;i<Math.ceil(G.pipeSnow*7);i++)G.parts.push({type:'snowChip',x:x+(R()-.5)*9,y:y+(R()-.5)*6,
    vx:(R()-.5)*140+(face==='v'?-55:0),vy:-40-R()*90,life:.55+R()*.3,max:.85,size:1.5+R()*2});
  const base=(PIPES[G.pipeKey]||PIPES.green).base(3,3);
  for(let i=0;i<7;i++)G.parts.push({type:'chip',x,y,vx:(face==='v'?-1:(R()-.5))*(60+R()*120),vy:(face==='h'?(h.part==='top'?1:-1):(R()-.5))*(40+R()*90)-40,life:.7,max:.7,size:2+R()*2,col:i%3?base:'#543847'});
  for(let i=0;i<5;i++)G.parts.push({type:'spark',x,y,vx:(R()-.5)*200,vy:(R()-.5)*200,life:.25,max:.25,size:2,col:'#ffffff'});
}
// Va chạm thứ cấp: nứt bề mặt tại điểm tiếp xúc, không khoét thêm vết móp.
function addPipeCrack(p,h){
  const sx=p.wx-G.dist,cc=gapC(p),top=cc-p.gap/2,bot=cc+p.gap/2;
  let x=h.nx,y=h.ny,angle;
  if(h.part==='top'&&y>=top-.01&&x>sx+.01&&x<sx+PIPE_W-.01){y=top;angle=-Math.PI/2;}
  else if(h.part==='bot'&&y<=bot+.01&&x>sx+.01&&x<sx+PIPE_W-.01){y=bot;angle=Math.PI/2;}
  else{const cap=h.part==='top'?y>=top-24:y<=bot+24;
    if(x<sx+PIPE_W/2){x=sx+(cap?0:2);angle=0;}else{x=sx+PIPE_W-(cap?0:2);angle=Math.PI;}}
  const lines=[],n=4;
  for(let i=0;i<n;i++){
    const a=angle+(i/(n-1)-.5)*2.15+(R()-.5)*.22,len=11+R()*15;
    const dx=Math.cos(a),dy=Math.sin(a),bend=(R()-.5)*5;
    const line=[0,0,dx*len*.36-dy*bend,dy*len*.36+dx*bend,
      dx*len*.68+dy*bend*.5,dy*len*.68-dx*bend*.5,dx*len,dy*len];lines.push(line);
    if(i%2===0){const bx=line[4],by=line[5],ba=a+(i?-.8:.8),bl=5+R()*5;
      lines.push([bx,by,bx+Math.cos(ba)*bl*.5,by+Math.sin(ba)*bl*.5,bx+Math.cos(ba)*bl,by+Math.sin(ba)*bl]);}
  }
  p.cracks=p.cracks||[]; // giữ lại mọi vết nứt của mọi lần va chạm
  p.cracks.push({lx:x-sx,dy:y-cc,part:h.part,lines,t:.025});p.wob=Math.max(p.wob||0,.18);
  const col=(PIPES[G.pipeKey]||PIPES.green).base(3,3);
  for(let i=0;i<4;i++)G.parts.push({type:'chip',x,y,vx:Math.cos(angle+Math.PI)*(25+R()*60)+(R()-.5)*35,vy:-30-R()*80,life:.4,max:.4,size:1+R()*1.5,col});
  if(G.pipeSnow>.05)for(let i=0;i<4;i++)G.parts.push({type:'snowChip',x,y,vx:(R()-.5)*110,vy:-30-R()*70,life:.5,max:.5,size:1+R()*2});
}

function update(dt,visualDt=dt){
  G.t+=dt;G.flash=Math.max(0,G.flash-dt*4);G.shake=Math.max(0,G.shake-dt);
  if(visualDt){updWeather(visualDt);updParts(visualDt);}
  const b=G.bird;
  if(G.state==='title'){b.x=W/2;b.y=(VIEW.landscape&&!VIEW.portrait?180/LANDSCAPE_ZOOM:Math.round(Math.max(groundY*0.36+16,groundY*0.09+16+112)))+safeTop+Math.sin(G.t*7)*4;b.rot=0;birdAnim(b,dt,true);G.groundOff+=BASE_SPEED*dt;G.bgDist+=BASE_SPEED*dt;updSegs();}
  else if(G.state==='ready'){b.y=readyY()+Math.sin(G.t*7)*4;b.rot=0;birdAnim(b,dt,true);G.groundOff+=BASE_SPEED*dt;G.bgDist+=BASE_SPEED*dt;updSegs();}

}
function updPlay(dt){
  const b=G.bird,pw=G.pw;
  for(const k in pw)if(pw[k]>0&&k!=='shield')pw[k]=Math.max(0,pw[k]-dt);
  G.invuln=Math.max(0,G.invuln-dt);G.hitCd=Math.max(0,G.hitCd-dt);

  b.vy=Math.min(MAXFALL,b.vy+GRAV*wdt);b.y+=b.vy*wdt;b.since+=wdt;

    else{b.y=groundY-r;die(true);return;}
  }
  if(G.invuln<=0)for(const p of G.pipes){const hp=hitPipe(p,b,r);if(hp){
    if(G.mode==='practice'){if(G.hitCd<=0){addDent(p,hp);pipeImpactFx(hp);practiceHit();}}else if(pw.shield>0){addDent(p,hp);pipeImpactFx(hp);useShield();}else{b.firstImpactPipe=p;addDent(p,hp);die(false,hp);return;}break;}}
  // xu
  for(const c of G.coins){if(c.taken)continue;
    if(!c.mag){c.x=c.wx-G.dist;c.y=gapC(c.pipe)+c.off;if(pw.magnet>0&&Math.hypot(c.x-b.x,c.y-b.y)<150)c.mag=true;}
    if(c.mag){const dx2=b.x-c.x,dy2=b.y-c.y,d=Math.hypot(dx2,dy2)||1;const v=Math.min(d,480*dt);c.x+=dx2/d*v;c.y+=dy2/d*v;}
    if(Math.hypot(c.x-b.x,c.y-b.y)<r+10){c.taken=true;G.runCoins++;SFX.play('coin');floatText('+1',c.x,c.y-8,'#ffd23a');
      for(let i=0;i<5;i++)G.parts.push({type:'spark',x:c.x,y:c.y,vx:(R()-.5)*120,vy:(R()-.5)*120,life:.35,max:.35,size:2});}}

    if(Math.hypot(it.x-b.x,it.y-b.y)<r+14){it.taken=true;pw[it.type]=PW_MAX[it.type];G.itemsUsed++;SFX.play('power');floatText(tr(PW_NAME[it.type]),b.x+10,b.y-22,ICONS[it.type].col);vibrate(20);}}
  prune(G.items,i=>!i.taken&&i.wx-G.dist>-30);
  { const tr=fatigueTier(G.score);if(tr>=2){b.sweatT-=dt;if(b.sweatT<=0){b.sweatT=[0,0,0.55,0.34,0.22][tr]*(0.6+R()*0.8);const a=b.rot*Math.PI/180,n=tr>=3?2:1;
      for(let i=0;i<n;i++){const ox=-1+R()*6,oy=-11;G.parts.push({type:'sweat',x:b.x+ox*Math.cos(a)-oy*Math.sin(a),y:b.y+ox*Math.sin(a)+oy*Math.cos(a),vx:-50-R()*80,vy:-90-R()*70,life:.8,max:.8,size:2.6+R()*1.4});}}}}
  // ghi lại đường bay cho bóng ma
  recordFlight(b);
  if(G.ghostOn&&!G.ghostBeat&&G.dist-((G.firstOff||318)-(G.ghost.off||318))>(G.ghost.y.length-1)*(G.ghost.step||2)+10){G.ghostBeat=true;toast(L('👻 Bạn đã vượt qua bóng ma!','👻 You passed your ghost!'));SFX.play('ach');}
}

function finishRun(){

  const bonus=Math.floor(sc/5),earned=G.runCoins+bonus;
  save.coins+=earned;const st=save.stats;st.games++;st.pipes+=sc;st.coinsEarned+=earned;st.flaps+=G.runFlaps;st.time+=G.runTime;st.items+=G.itemsUsed;if(G.shieldSaved)st.shields++;
  const prev=save.best[m]||0,newBest=sc>prev;if(newBest)save.best[m]=sc;
  if(newBest&&sc>0)storeGhost(m,{seed:G.seed,score:sc,off:G.firstOff||318,step:G.rec.step||2,y:G.rec.y,r:G.rec.r});
  let rank=-1;
  if(sc>0){const bd=save.board[m];const e={n:save.name||tr('Bạn'),s:sc,d:dateStr(),id:Date.now()};bd.push(e);bd.sort((a,c)=>c.s-a.s||a.id-c.id);save.board[m]=bd.slice(0,10);rank=save.board[m].indexOf(e);if(rank>=0)G.lastEntry=e;}

}

  while(list.length<3){const i=Math.floor(rng()*pool.length);list.push({id:pool[i].id,p:0,done:false});pool.splice(i,1);}save.daily={date:ds,list};persist();}}

  switch(M.kind){case'games':v+=1;break;case'bestRun':v=Math.max(v,run.score);break;case'coins':v+=run.coins;break;case'pipes':v+=run.score;break;
    case'modeRun':if(run.mode===M.mode)v=Math.max(v,run.score);break;case'items':v+=run.items;break;case'nightRun':v=Math.max(v,run.nightScore);break;case'flaps':v+=run.flaps;break;}

// Điểm va chạm của một đoạn chuyển động với thân chim, có xét góc xoay và thu nhỏ.
function weatherBirdHit(x0,y0,x1,y1){
  const b=G.bird;if(!b)return null;
  const a=-b.rot*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a),size=G.pw.shrink>0?.6:1;
  const ux=x0-b.x,uy=y0-b.y,vx=x1-x0,vy=y1-y0;
  const x=(ux*cs-uy*sn)/(13*size),y=(ux*sn+uy*cs)/(11*size);
  const dx=(vx*cs-vy*sn)/(13*size),dy=(vx*sn+vy*cs)/(11*size);

  return{x:x0+vx*t,y:y0+vy*t};
}

function updBirdWeather(dt){

const debrisExtCache=new WeakMap();
function debrisExt(p){const art=p.art;let e=debrisExtCache.get(art);
  if(!e){e={hw:(p.artW??36)*.3,hh:(p.artH??30)*.2};try{const w=art.width,h=art.height,d=art.getContext('2d').getImageData(0,0,w,h).data;let x0=w,x1=-1,y0=h,y1=-1;
      for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>60){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
      if(x1>=0){const sx=(p.artW??36)/w,sy=(p.artH??30)/h,ox=p.artX??-18,oy=p.artY??-15;
        e={hw:Math.max(Math.abs(ox+x0*sx),Math.abs(ox+(x1+1)*sx)),hh:Math.max(Math.abs(oy+y0*sy),Math.abs(oy+(y1+1)*sy))};}}catch(err){}

function updParts(dt){const shardDrag=Math.exp(-1.25*dt),featherDrag=Math.exp(-2.4*dt);for(const p of G.parts){const x0=p.x,y0=p.y;
  if(p.impact){
    if(p.accessory){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=shardDrag;p.vy=Math.min(360,p.vy+560*dt);p.rot+=p.vr*dt;}
    else{
      // Rơi thật: trọng lực + lực cản không khí tỉ lệ bình phương vận tốc (giải ẩn, ổn định với mọi dt).
      // Vận tốc giới hạn: lông ~48, cánh mỏng ~68 đơn vị/giây; lông bật lên chỉ chừng 10–25 đơn vị rồi chao nghiêng rơi xuống.
      const wing=p.type==='wingShard',g=wing?420:340,vt=wing?68:48,k=g/(vt*vt);
      // Lúc vừa bung ra các mảnh còn dính chùm nên lực cản tăng dần trong ~0,3 giây đầu (bật lên nhẹ rồi mới chao rơi).
      p.age=(p.age||0)+dt;const kk=k*(.12+.88*Math.min(1,p.age/.3));
      p.vy+=g*dt;const sp=Math.hypot(p.vx,p.vy),f=1/(1+kk*sp*dt);p.vx*=f;p.vy*=f;

      p.x+=(p.vx+Math.sin(p.ph)*(wing?14:22)*sway)*dt;p.y+=p.vy*dt;
      p.vr*=Math.exp(-1.6*dt);p.rot+=(p.vr+Math.cos(p.ph)*1.1*sway)*dt;
      // Sát đất thì xoay dần về nằm ngang để đáp xuống không bị đổi góc đột ngột.
      const e=debrisExt(p),flat=Math.round(p.rot/Math.PI)*Math.PI,near=groundY-p.y;
      if(near<26){const t=Math.min(1,dt*6*(1-Math.max(0,near)/26));p.rot+=(flat-p.rot)*t;}
      const flip=wing?.35+.65*Math.abs(Math.cos(p.rot*.7)):1,cs=Math.abs(Math.cos(p.rot)),sn=Math.abs(Math.sin(p.rot));
      p._bottom=(sn*e.hw+cs*e.hh*flip)*p.size;
    }if(p.x<3){p.x=3;p.vx=Math.abs(p.vx)*.2;}else if(p.x>W-3){p.x=W-3;p.vx=-Math.abs(p.vx)*.2;}
    const bottom=p.accessory?(Math.abs(Math.sin(p.rot))*p.artW+Math.abs(Math.cos(p.rot))*p.artH)*p.size/2:Math.max(1,(p._bottom||2)-2.5);
    if(p.vy>=0&&p.y+bottom>=groundY)landImpact(p);continue;}
  p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.type==='pipeDrop'){
    if(p.worldX!==undefined)p.x=p.worldX-G.dist;
    p.vy+=480*dt;const hit=weatherBirdHit(x0,y0,p.x,p.y);
    if(hit){rainSplash(hit.x,hit.y,p.opacity);p.life=0;}
    else if(p.y>=groundY)p.life=0;

  }
  else if(p.type==='rainSplash'){p.vy+=360*dt;p.vx*=Math.exp(-2*dt);}
  else if(p.type==='snowChip'){p.vy+=150*dt;p.vx*=Math.exp(-1.5*dt);}

function paintPipeDents(c,p,sx,cc){
  const sp=G.pipeSpr,top=cc-p.gap/2,bot=cc+p.gap/2;
  const gs=p.dents.map(d=>dentGeom(d,sx,cc));
  const holes=()=>{c.beginPath();c.rect(-60,-60,W+120,H+120);for(const g of gs){if(g.rx<=0)continue;c.moveTo(g.x+g.rx,g.y);c.ellipse(g.x,g.y,g.rx,g.ry,0,0,Math.PI*2);}};
  // 1) vẽ ống, khoét phần bị móp
  c.save();holes();c.clip('evenodd');drawPipeRaw(c,sp,sx,top,bot);c.restore();
  // 2) bóng đổ, viền sáng, vết nứt quanh chỗ móp (chỉ nằm trên thân ống)
  p.dents.forEach((d,i)=>{const g=gs[i];if(g.rx<=0)return;
    const pr=d.part==='top'?[sx,-60,PIPE_W,top+60]:[sx,bot,PIPE_W,groundY-bot+4];
    c.save();c.beginPath();c.rect(pr[0],pr[1],pr[2],pr[3]);c.clip();holes();c.clip('evenodd');
    c.fillStyle='rgba(40,20,30,.25)';c.beginPath();c.ellipse(g.x,g.y,g.rx+7,g.ry+7,0,0,Math.PI*2);c.fill();

    if(d.t>0.06){c.strokeStyle='rgba(60,30,45,.75)';c.lineWidth=1;c.beginPath();
      for(let j=0;j<3;j++){let ang=d.a+j*0.8;if(d.face==='v')ang=-0.9+((d.a+j*0.9)%1.8);else if(d.part==='top')ang=Math.PI+0.4+((d.a+j*0.9)%(Math.PI-0.8));else ang=0.4+((d.a+j*0.9)%(Math.PI-0.8));
        const r0x=g.rx+1,r0y=g.ry+1,L=5+((d.a*7+j*3)%5);const x0=g.x+Math.cos(ang)*r0x,y0=g.y+Math.sin(ang)*r0y;

  });
}
// Lớp thời tiết dùng tọa độ ống, đi theo cả ống trôi và ống di động; không đổi hitbox.

  c.rect(sx,bot,52,24);c.rect(sx+2,bot+24,48,Math.max(0,groundY-bot-24));c.clip();

    for(const d of p.dents){const g=dentGeom(d,sx,cc);if(g.rx>0){c.moveTo(g.x+g.rx,g.y);c.ellipse(g.x,g.y,g.rx,g.ry,0,0,Math.PI*2);}}c.clip('evenodd');}
  if(wet>.002){
    c.globalAlpha=wet*.13;c.fillStyle='#b5dded';c.fillRect(sx,0,52,groundY);
    // Màng ướt ở mép và các dòng nước có đuôi mảnh, chảy dọc thân cả hai ống.
    c.globalAlpha=wet*.42;c.fillStyle='#ccefff';c.fillRect(sx+5,0,1,groundY);c.fillRect(sx+47,0,1,groundY);
    for(let side=0;side<2;side++){
      const y0=side?bot:0,y1=side?groundY:top,span=y1-y0;if(span<=0)continue;
      for(let i=0;i<7;i++){
        const xx=sx+6+((i*7.3+seed*3)%40),speed=38+(i*19+seed)%44;
        const yy=y0+((tm*speed+i*43+seed*13)%(span+42))-24;
        c.globalAlpha=wet*(.24+(i%3)*.09);c.fillStyle='#bce8ff';c.fillRect(Math.round(xx),yy-19,1,20);
        c.globalAlpha=wet*.8;c.fillStyle='#dcf6ff';c.fillRect(Math.round(xx),yy,2,4);
        c.globalAlpha=wet*.25;c.fillRect(Math.round(xx)+1,yy-9,1,10);
      }
    }
    c.globalAlpha=wet*.6;c.fillStyle='#d0eeff';c.fillRect(sx+2,top-3,48,1);c.fillRect(sx+2,bot+2,48,1);
  }
  if(snow>.002){
    c.globalAlpha=snow*.19;c.fillStyle='#d5e9f7';c.fillRect(sx,0,52,groundY);
    // Tuyết bị gió tạt bám thành: dày ở mép, loang thành những cụm pixel nhỏ.
    for(let side=0;side<2;side++){
      const y0=side?bot:0,y1=side?groundY:top;
      for(let y=y0+5;y<y1;y+=17){
        const n=(Math.sin(y*.81+seed+side*4)+1)*.5;
        c.globalAlpha=snow*(.45+n*.4);c.fillStyle='#e6f4ff';
        if(smooth()){smoothSnowPatch(c,sx+3,y,2+n*4*snow,4+n*7);smoothSnowPatch(c,sx+46-n*3,y+6,3+n*3,3+n*5);}else{c.fillRect(sx+3,y,2+Math.floor(n*4*snow),4+n*7);c.fillRect(sx+46-n*3,y+6,3+n*3,3+n*5);}
        if(n>.45){c.globalAlpha=snow*.65;if(smooth())smoothSnowPatch(c,sx+15+n*15,y+3,3+n*3,2+n*3);else c.fillRect(sx+15+Math.floor(n*15),y+3,3+n*3,2+n*3);}
      }
    }
  }
  c.restore();
  if(snow>.002){
    // Gờ tuyết lồi lõm: vai ống trên, viền miệng úp và miệng ngửa của ống dưới.
    c.save();c.beginPath();c.rect(sx-2,0,56,groundY);c.clip();pipeSnowDentClip(c,p,sx,cc);c.globalAlpha=Math.min(1,snow*2);
    if(smooth())smoothSnowRims(c,sx,top,bot,snow,seed);else for(let i=0;i<13;i++){
      const x=sx+i*4,n=(Math.sin(seed+i*2.7)+1)*.5,depth=(2+n*4)*snow;
      c.fillStyle='#9ebfd6';c.fillRect(x,bot-depth+2,4,depth+1);
      c.fillStyle='#f2faff';c.fillRect(x,bot-depth,4,Math.max(1,depth));
      c.fillStyle='#fff';c.fillRect(x,bot-depth,4,1);
      c.fillStyle='#d9edfc';c.fillRect(x,top-2,4,1+depth*.5);
      c.fillStyle='#f2faff';c.fillRect(x,top-24-depth*.55,4,Math.max(1,depth*.55));
      if(i%4===1){c.fillStyle='#e7f5ff';c.fillRect(x+1,top-1,2,depth*.8);}
    }
    c.restore();
    if(p.dents)for(const d of p.dents){const g=dentGeom(d,sx,cc);if(g.rx<=0)continue;
      c.save();c.beginPath();if(d.part==='top')c.rect(sx,0,52,top);else c.rect(sx,bot,52,groundY-bot);c.clip();
      c.globalAlpha=snow*.9;c.strokeStyle='#e6f5ff';c.lineWidth=1.4;c.beginPath();
      if(d.face==='v')c.ellipse(g.x,g.y,g.rx+2.7,g.ry+2.7,0,-Math.PI/2,Math.PI/2);
      else c.ellipse(g.x,g.y,g.rx+2.7,g.ry+2.7,0,d.part==='top'?Math.PI:0,d.part==='top'?Math.PI*2:Math.PI);
      c.stroke();c.restore();}
  }
  if(wet>.01){
    // Giọt tách ra vẫn giữ tọa độ ngang trong thế giới; cuộn cùng ống và chỉ rơi dọc, không bị đẩy sang phải.
    const strength=wet*(.25+.75*G.wxMix.rain);
    c.save();c.beginPath();c.rect(sx-2,top-2,56,Math.max(0,bot-top-5));c.clip();pipeSnowDentClip(c,p,sx,cc);
    for(let i=0;i<5;i++){
      const spec=pipeDripSpec(p,i),phase=(tm+spec.offset)%spec.period,grow=spec.period-.46;
      if(phase>grow)continue;
      const x=sx+spec.lx,sz=1.1+Math.min(1,phase/grow)*1.35,y=top+sz*.6;
      c.globalAlpha=strength*.85;c.fillStyle='#8bc9ee';c.beginPath();c.moveTo(x,y-sz*1.4);
      c.quadraticCurveTo(x+sz*1.3,y+sz*.4,x,y+sz);c.quadraticCurveTo(x-sz*1.3,y+sz*.4,x,y-sz*1.4);c.fill();
      c.globalAlpha=strength;c.fillStyle='#effbff';c.fillRect(x-.6,y-.3,1,1.5);
    }
    c.restore();
  }
}

function drawPipeCracks(c,p){
  if(!p.cracks||!p.cracks.length)return;
  let sx=Math.round((p.wx-G.dist)*pxs)/pxs;if(sx>W+10||sx<-60)return;
  if(p.wob>0)sx+=Math.sin(G.t*70)*2.4*(p.wob/.3);
  const cc=gapC(p),stable=(!p.amp||G.state!=='play')&&p.cracks.every(v=>v.t>=.12),q=Math.min(2,pxs);
  if(stable){const key=gfxMode()+'|'+q+'|'+groundY+'|'+cc+'|'+p.cracks.length;
    if(!p.crackArt||p.crackArt.key!==key){const w=56,h=Math.ceil(groundY+4),art=mkCanvas(Math.ceil(w*q),Math.ceil(h*q)),g=art.getContext('2d');g.imageSmoothingEnabled=smooth();g.scale(q,q);paintPipeCracks(g,p,2,cc);p.crackArt={key,canvas:bm(art),w,h};}
    const a=p.crackArt;c.drawImage(IMG(a.canvas),sx-2,0,a.w,a.h);return;}
  paintPipeCracks(c,p,sx,cc);
}
function paintPipeCracks(c,p,sx,cc){
  const top=cc-p.gap/2,bot=cc+p.gap/2;
  c.save();c.beginPath();c.rect(sx+2,0,48,Math.max(0,top-24));c.rect(sx,top-24,52,24);
  c.rect(sx,bot,52,24);c.rect(sx+2,bot+24,48,Math.max(0,groundY-bot-24));c.clip();
  for(const crack of p.cracks){
    const x=sx+crack.lx,y=cc+crack.dy,grow=Math.min(1,crack.t/.12);
    c.save();c.beginPath();if(crack.part==='top')c.rect(sx,0,52,top+2);else c.rect(sx,bot-6,52,groundY-bot+6);c.clip();
    for(let pass=0;pass<2;pass++){
      c.strokeStyle=pass===0?'rgba(245,250,245,.8)':'#45333b';c.lineWidth=pass===0?2:1.35;c.lineJoin='miter';c.lineCap='square';
      c.beginPath();const off=pass===0?.65:0;
      for(const line of crack.lines){c.moveTo(x+line[0]+off,y+line[1]+off);
        const segments=line.length/2-1,progress=grow*segments;
        for(let i=0;i<segments;i++){const f=Math.max(0,Math.min(1,progress-i));if(f<=0)break;
          const k=i*2;c.lineTo(x+line[k]+(line[k+2]-line[k])*f+off,y+line[k+1]+(line[k+3]-line[k+1])*f+off);}}
      c.stroke();
    }
    c.globalAlpha=grow;c.fillStyle='#4c3840';c.fillRect(x-1,y-1,2,2);c.restore();
  }
  c.restore();
}
function drawPipe(c,p){drawPipeWeather(c,p);drawPipeCracks(c,p);}

      c.beginPath();c.moveTo(p.size*1.6,0);c.quadraticCurveTo(0,-p.size,-p.size,0);c.quadraticCurveTo(0,p.size,p.size*1.6,0);c.fill();c.stroke();c.fillStyle='#ffffff';c.fillRect(-p.size*0.3,-p.size*0.35,p.size*0.5,p.size*0.4);c.restore();}

// Mouse wheels scroll vertical by default; route them to overflowing tab strips.
for(const tabs of document.querySelectorAll('.mtabs')){
  tabs.addEventListener('wheel',e=>{
    if(e.ctrlKey||tabs.scrollWidth<=tabs.clientWidth)return;
    const delta=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*(e.deltaMode===1?16:e.deltaMode===2?tabs.clientWidth:1);
    if(!delta)return;tabs.scrollLeft+=delta;if(e.cancelable)e.preventDefault();
  },{passive:false});
  let drag=null,suppressClick=false;
  tabs.addEventListener('pointerdown',e=>{
    suppressClick=false;
    if(e.pointerType!=='mouse'||e.button!==0||tabs.scrollWidth<=tabs.clientWidth)return;
    // Leave the native scrollbar available for thumb dragging.
    const rect=tabs.getBoundingClientRect();if(e.clientY>=rect.top+tabs.clientTop+tabs.clientHeight)return;
    drag={id:e.pointerId,x:e.clientX,left:tabs.scrollLeft,moved:false};
  });
  tabs.addEventListener('pointermove',e=>{
    if(!drag||drag.id!==e.pointerId)return;
    if(!drag.moved&&Math.abs(e.clientX-drag.x)>5){drag.moved=true;tabs.setPointerCapture(e.pointerId);tabs.classList.add('dragging');}
    if(drag.moved){tabs.scrollLeft=drag.left+drag.x-e.clientX;e.preventDefault();}
  });
  const endDrag=e=>{if(!drag||drag.id!==e.pointerId)return;suppressClick=drag.moved;drag=null;tabs.classList.remove('dragging');if(tabs.hasPointerCapture(e.pointerId))tabs.releasePointerCapture(e.pointerId);};
  tabs.addEventListener('pointerup',endDrag);tabs.addEventListener('pointercancel',endDrag);
  tabs.addEventListener('lostpointercapture',endDrag);
  tabs.addEventListener('pointerleave',e=>{if(drag&&!drag.moved)endDrag(e);});
  tabs.addEventListener('click',e=>{if(suppressClick){suppressClick=false;e.preventDefault();e.stopImmediatePropagation();}},true);
  tabs.addEventListener('focusin',e=>{if(e.target.matches('.tab'))e.target.scrollIntoView({block:'nearest',inline:'nearest'});});
}

// Giữ vật lý theo đơn vị logic. Màn hình ngang dùng chiều cao 512 đơn vị:

function viewLayout(vw,vh,portrait=VIEW.portrait){
  const landscape=vw>vh;let w,h,s,framed=landscape&&portrait;const zoom=landscape&&!framed?LANDSCAPE_ZOOM:1;
  if(framed){const pad=Math.min(12,vh*.025);h=512;w=288;s=Math.max(1,vh-pad*2)/h;}
  else if(landscape){h=512/zoom;s=vh/h;w=Math.min(1920,Math.max(288,vw/s));}
  else{s=Math.min(vw/288,vh/480,1.6);w=Math.min(1400,Math.max(288,vw/s));h=Math.min(900,Math.max(480,vh/s));}
  const dw=w*s,dh=h*s;
  return{landscape,framed,zoom,w,h,s,dw,dh,left:(vw-dw)/2,top:(vh-dh)/2};
}

  button.style.setProperty('--view-control-scale',VIEW.landscape&&!VIEW.portrait?String(LANDSCAPE_ZOOM):'1');
  button.disabled=VIEW.switching;button.setAttribute('aria-pressed',String(active));button.setAttribute('aria-label',hint);button.setAttribute('aria-busy',String(VIEW.switching));button.title=hint;
  $('orientationLabel').textContent=label;

function remapView(dx,dy){
  if(!G.bird||G.state==='title')return;
  G.bird.x+=dx;G.bird.y+=dy;
  for(const p of G.pipes){p.wx+=dx;p.base+=dy;}
  if(Number.isFinite(G.nextPipe))G.nextPipe+=dx;
  for(const co of G.coins){co.wx+=dx;if(co.x!==undefined)co.x+=dx;if(co.y!==undefined)co.y+=dy;}
  for(const it of G.items){it.wx+=dx;if(it.x!==undefined)it.x+=dx;if(it.y!==undefined)it.y+=dy;}
  for(const part of G.parts){part.x+=dx;part.y+=dy;if(part.worldX!==undefined)part.worldX+=dx;}
  // Đường bay đã ghi và bóng ma trên màn hình cùng dịch theo điểm nhìn mới.
  if(dy&&G.rec&&G.rec.y)for(let i=0;i<G.rec.y.length;i++)G.rec.y[i]+=Math.round(dy*2);
  G.ghostViewY=(G.ghostViewY||0)+dy;

function viewSnapshot(){
  if(!stage.cloneNode||!window.getComputedStyle)return null;
  const box=stage.getBoundingClientRect(),copy=stage.cloneNode(true);
  copy.style.setProperty('--st',window.getComputedStyle(stage).getPropertyValue('--st')||'0px');
  const from=[stage,...stage.querySelectorAll('*')],to=[copy,...copy.querySelectorAll('*')];
  // Snapshot gồm cả canvas và nút/chữ, không giữ ID trùng hoặc phần tử tương tác.
  for(let i=0;i<to.length;i++){
    const source=from[i],target=to[i],style=window.getComputedStyle(source);
    if(source.tagName==='CANVAS')target.getContext('2d').drawImage(source,0,0);
    if(source.id){for(const key of ['position','top','right','bottom','left','width','height','display','visibility','background-color','opacity','transform','z-index','image-rendering','border-radius','box-shadow'])target.style.setProperty(key,style.getPropertyValue(key));target.removeAttribute('id');}
    target.style.animation='none';target.style.pointerEvents='none';
  }
  copy.className='view-snapshot';copy.setAttribute('aria-hidden','true');copy.inert=true;
  Object.assign(copy.style,{position:'fixed',left:box.left+'px',top:box.top+'px',width:box.width+'px',height:box.height+'px',margin:'0',zIndex:'60',transform:'none',opacity:'1'});
  document.body.appendChild(copy);return copy;
}
function animateView(element,keyframes,duration){
  if(element.animate){const animation=element.animate(keyframes,{duration,easing:'cubic-bezier(.22,.8,.2,1)',fill:'both'});VIEW.animations.push(animation);return animation.finished.catch(()=>{});}
  Object.assign(element.style,keyframes[0]);void element.offsetWidth;
  return new Promise(resolve=>{element.style.transition=`transform ${duration}ms ease,opacity ${duration}ms ease`;requestAnimationFrame(()=>Object.assign(element.style,keyframes[keyframes.length-1]));setTimeout(()=>{element.style.transition='';resolve();},duration);});
}
function cancelViewTransition(){
  VIEW.token++;for(const a of VIEW.animations)a.cancel();VIEW.animations=[];
  if(VIEW.snapshot)VIEW.snapshot.remove();VIEW.snapshot=null;VIEW.switching=false;

async function toggleOrientation(){
  if(!VIEW.landscape||VIEW.switching)return;
  const token=++VIEW.token,old=stage.getBoundingClientRect(),entering=!VIEW.portrait;
  VIEW.switching=true;stage.classList.add('view-changing');refreshOrientationUI();
  try{
    VIEW.snapshot=viewSnapshot();VIEW.portrait=entering;resize();draw();
    const next=stage.getBoundingClientRect(),reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const duration=reduce?160:640,angle=reduce?0:(entering?-90:90);
    const fitting=Math.min(next.width/Math.max(1,old.height),next.height/Math.max(1,old.width));
    const promises=[animateView(stage,[{transform:`rotate(${-angle}deg) scale(.92)`,opacity:0},{transform:'rotate(0deg) scale(1)',opacity:1}],duration)];
    if(VIEW.snapshot)promises.push(animateView(VIEW.snapshot,[{transform:'rotate(0deg) scale(1)',opacity:1},{transform:`rotate(${angle}deg) scale(${fitting})`,opacity:0}],duration));
    await Promise.all(promises);
  }finally{
    if(token===VIEW.token){for(const a of VIEW.animations)a.cancel();VIEW.animations=[];
      if(VIEW.snapshot)VIEW.snapshot.remove();VIEW.snapshot=null;stage.style.transform='';stage.style.opacity='';stage.classList.remove('view-changing');VIEW.switching=false;
      last=performance.now();acc=0;refreshOrientationUI();}
  }
}

let last=performance.now(),acc=0;
let perfT=0,perfN=0;
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  // Keep menu scenery moving. A modal must still suspend an active flight.
  const modalBlocksFlight=modern()&&modalOpen()&&['ready','play','dying'].includes(G.state);
  if(!G.paused&&!modalBlocksFlight&&!VIEW.switching&&dt>0){const n=Math.max(1,Math.ceil(dt/STEP-0.01)),h=dt/n;for(let i=0;i<n;i++)update(h,i===n-1?dt:0);}
  if(!(typeof BXS!=='undefined'&&BXS.open))draw();
  {const busy=G.state==='play'||G.state==='ready'||G.state==='dying';if(modalBlocksFlight)runWork(3);else if(!busy)runWork(4);else if(dt<0.02)runWork(1.2);}
  // máy yếu: nếu đang chơi mà trung bình < ~48 khung/giây thì giảm độ phân giải vẽ
  if(smooth()&&G.state==='play'&&!G.paused&&!modalBlocksFlight&&!VIEW.switching&&dt>0){perfT+=dt;perfN++;if(perfN>=150){if(perfT/perfN>0.021&&DPR_CAP>1.01){DPR_CAP=DPR_CAP>1.6?1.5:1;resize();}perfT=0;perfN=0;}}else{perfT=0;perfN=0;}
  requestAnimationFrame(loop);}

   BLINDBOX: 20 loài bán bằng xu, 49 loài chỉ mở bằng Blindbox.
   Mỗi 30 phút có 1 lượt mở miễn phí (không cộng dồn), hoặc mở bằng 30 xu.

const SHOP_SPECIES=ORIG_SPECIES_IDS.map((id,i)=>[id,SPECIES[id].price,i]).sort((a,b)=>a[1]-b[1]||a[2]-b[2]).slice(0,20).map(x=>x[0]);
const BOX_SPECIES=Object.keys(SPECIES).filter(id=>!SHOP_SPECIES.includes(id));
const BOX_SET=new Set(BOX_SPECIES);
const RARE_SET=new Set(['phoenix','lac','peacock','eagle','crane','paradise','rong','kylan','ptero','tri','hornbill','cadu'].filter(id=>BOX_SET.has(id)));
const BOX_PRICE=30,BOX_FREE_MS=30*60*1000,BOX_DUP={common:20,rare:30},BOX_RARE_P=.15;
function isBoxSpecies(id){return BOX_SET.has(id);}
function boxNow(){return Date.now();}
function boxFreeLeft(){const b=save.box;if(!b)return 0;let left=(b.next||0)-boxNow();if(left>BOX_FREE_MS){b.next=boxNow()+BOX_FREE_MS;left=BOX_FREE_MS;}return Math.max(0,left);}
function boxFreeReady(){return boxFreeLeft()<=0;}
function fmtMMSS(ms){const t=Math.ceil(ms/1000),m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
// Bóng đen bí ẩn: đúng hình dáng loài, tô đen toàn thân

// ---------- Vẽ thẻ "vỉ đồ chơi": bìa giấy phía sau + lớp nhựa bọc 3D ----------
const boxArtCache=new Map();
function boxSpeciesArt(id,size){const key=id+'|'+size;let c=boxArtCache.get(key);if(c)return c;
  const old=previewGraphicsMode;previewGraphicsMode='vector';try{const px=Math.max(1,size/BBW);c=renderBird(id,'natural',0,'none','none',0,px);}finally{previewGraphicsMode=old;}
  boxArtCache.set(key,c);return c;}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
const BOX_PALETTES=[['#ffd36e','#ff9b54'],['#9be7ff','#4fa3ff'],['#b8f28a','#43b88a'],['#ffb3d1','#ff6f9f'],['#ffe7a1','#ffbf3f'],['#cdb6ff','#8a6cff']];
const boxCardCache=new Map();
function boxCard(id,w){const key=id+'|'+w;let c=boxCardCache.get(key);if(c)return c;
  const h=Math.round(w*4/3),rare=RARE_SET.has(id),S=SPECIES[id];c=mkCanvas(w,h);const g=c.getContext('2d'),k=w/100;
  // Bìa giấy
  const pal=rare?['#7b4dff','#ff5fa8']:BOX_PALETTES[(BOX_SPECIES.indexOf(id)+6)%6];
  const bg=g.createLinearGradient(0,0,w,h);bg.addColorStop(0,pal[0]);bg.addColorStop(1,pal[1]);
  rr(g,1.5*k,1.5*k,w-3*k,h-3*k,9*k);g.fillStyle=bg;g.fill();g.lineWidth=2.4*k;g.strokeStyle='#3b2a35';g.stroke();
  g.save();rr(g,1.5*k,1.5*k,w-3*k,h-3*k,9*k);g.clip();g.globalAlpha=.16;g.fillStyle='#fff';
  for(let y=-10*k;y<h;y+=14*k)for(let x=((y/(14*k))|0)%2?0:7*k;x<w;x+=14*k){g.beginPath();g.arc(x,y,2.2*k,0,7);g.fill();}
  g.globalAlpha=1;if(rare){g.fillStyle='#ffffff26';for(let i=0;i<5;i++){g.beginPath();g.moveTo(-20*k+i*34*k,h);g.lineTo(10*k+i*34*k,0);g.lineTo(22*k+i*34*k,0);g.lineTo(-8*k+i*34*k,h);g.closePath();g.fill();}}g.restore();
  // Lỗ treo trên đầu vỉ
  g.save();g.globalCompositeOperation='destination-out';rr(g,w/2-13*k,6*k,26*k,7*k,3.5*k);g.fill();g.restore();
  rr(g,w/2-13*k,6*k,26*k,7*k,3.5*k);g.lineWidth=1.4*k;g.strokeStyle='#3b2a3588';g.stroke();
  // Băng tên ở mép dưới
  const by=h-26*k;rr(g,8*k,by,w-16*k,18*k,6*k);g.fillStyle='#fffdf4';g.fill();g.lineWidth=1.6*k;g.strokeStyle='#3b2a35';g.stroke();
  g.fillStyle='#3b2a35';g.textAlign='center';g.textBaseline='middle';let fs=10.5*k;const nm=tr(S.name);g.font=`800 ${fs}px ${FONT}`;while(g.measureText(nm).width>w-24*k&&fs>6*k){fs-=.5*k;g.font=`800 ${fs}px ${FONT}`;}g.fillText(nm,w/2,by+9.5*k);
  // Khay nhựa: bóng đổ, nền trong, hình loài, mặt nhựa phồng có vệt sáng
  const bx=11*k,bt=18*k,bw=w-22*k,bh=by-bt-6*k;
  g.save();rr(g,bx+2*k,bt+3*k,bw,bh,12*k);g.fillStyle='#0000002a';g.fill();g.restore();
  g.save();rr(g,bx,bt,bw,bh,12*k);g.clip();const sky=g.createLinearGradient(0,bt,0,bt+bh);sky.addColorStop(0,'#eaf9ff');sky.addColorStop(1,'#bfe9f5');g.fillStyle=sky;g.fillRect(bx,bt,bw,bh);
  const art=boxSpeciesArt(id,Math.round(bw*1.02));const aw=bw*1.02,ah=aw*BBH/BBW;g.drawImage(art,bx+(bw-aw)/2+bw*.02,bt+(bh-ah)/2+bh*.04,aw,ah);
  const gl=g.createLinearGradient(bx,bt,bx+bw,bt+bh);gl.addColorStop(0,'#ffffff70');gl.addColorStop(.28,'#ffffff10');gl.addColorStop(.62,'#ffffff00');gl.addColorStop(1,'#ffffff30');g.fillStyle=gl;g.fillRect(bx,bt,bw,bh);
  g.globalAlpha=.55;g.fillStyle='#fff';g.beginPath();g.ellipse(bx+bw*.24,bt+bh*.16,bw*.17,bh*.05,-.5,0,7);g.fill();g.globalAlpha=.3;g.beginPath();g.ellipse(bx+bw*.8,bt+bh*.86,bw*.09,bh*.03,-.5,0,7);g.fill();g.restore();
  rr(g,bx,bt,bw,bh,12*k);g.lineWidth=2.2*k;g.strokeStyle='#ffffffd0';g.stroke();rr(g,bx+2.2*k,bt+2.2*k,bw-4.4*k,bh-4.4*k,10*k);g.lineWidth=1*k;g.strokeStyle='#7fb7c955';g.stroke();
  if(rare){g.save();rr(g,1.5*k,1.5*k,w-3*k,h-3*k,9*k);g.clip();g.translate(w-22*k,22*k);g.rotate(Math.PI/4);
    const rb=g.createLinearGradient(0,-8*k,0,8*k);rb.addColorStop(0,'#fff27a');rb.addColorStop(1,'#ffb81f');g.fillStyle=rb;g.fillRect(-40*k,-7.5*k,80*k,15*k);
    g.lineWidth=1.6*k;g.strokeStyle='#3b2a35';g.beginPath();g.moveTo(-40*k,-7.5*k);g.lineTo(40*k,-7.5*k);g.moveTo(-40*k,7.5*k);g.lineTo(40*k,7.5*k);g.stroke();
    g.fillStyle='#7a2a00';g.font=`800 ${8.6*k}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText(L('HIẾM','RARE'),0,.6*k);g.restore();}
  boxCardCache.set(key,c);if(boxCardCache.size>140)boxCardCache.delete(boxCardCache.keys().next().value);return c;}

// ---------- Ảnh nền: lớp họa tiết thẻ nhỏ (nhạt) + ảnh 6 loài chụp chung (nửa trên) ----------
function paintBoxBackground(){const cv2=$('boxBg'),r=$('boxScr').getBoundingClientRect(),dpr=Math.min(2.5,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));if(cv2.width!==w)cv2.width=w;if(cv2.height!==h)cv2.height=h;const g=cv2.getContext('2d'),k=w/r.width;
  g.fillStyle='#f4ecdc';g.fillRect(0,0,w,h);
  // Lớp dưới: thẻ nhỏ xếp so le theo hàng, rất nhạt
  const cw=34*k*u,ch=cw*4/3,gx=cw*.55,gy=ch*.35;g.save();g.globalAlpha=.13;
  for(let row=0,y=-ch*.3;y<h;row++,y+=ch+gy)for(let x=(row%2?-(cw+gx)/2:0)-cw*.2;x<w;x+=cw+gx){const pal=BOX_PALETTES[(row*3+Math.round(x/cw))%6&7]||BOX_PALETTES[0];
    rr(g,x,y,cw,ch,cw*.12);g.fillStyle=pal[1];g.fill();rr(g,x+cw*.14,y+ch*.16,cw*.72,ch*.56,cw*.16);g.fillStyle='#ffffff';g.fill();
    g.fillStyle=pal[1];g.font=`800 ${cw*.36}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText('?',x+cw/2,y+ch*.45);}
  g.restore();
  // Nửa trên: khung ảnh "chụp chung"
  const top=(BXS.layout.safeTop+44)*k*u,phMax=h/2-top-6*k*u,portrait=h>w;let pw=Math.min(w-20*k*u,phMax*1.5),ph=phMax;
  if(portrait){pw=Math.min(pw,w*.7);ph=Math.min(phMax,pw*1.02);}
  const px0=(w-pw)/2,py0=top+4*k*u+(phMax-ph)/2;
  g.save();g.translate(px0+pw/2,py0+ph/2);g.rotate(-.025);g.translate(-pw/2,-ph/2);
  g.fillStyle='#00000030';rr(g,4*k*u,6*k*u,pw,ph,8*k*u);g.fill();
  rr(g,0,0,pw,ph,8*k*u);g.fillStyle='#fffdf6';g.fill();g.lineWidth=2*k*u;g.strokeStyle='#3b2a35';g.stroke();
  const ix=9*k*u,iy=9*k*u,iw=pw-18*k*u,ih=ph-22*k*u;g.save();rr(g,ix,iy,iw,ih,5*k*u);g.clip();
  const sky=g.createLinearGradient(0,iy,0,iy+ih);sky.addColorStop(0,'#7fd4f0');sky.addColorStop(.7,'#d2f2f6');sky.addColorStop(1,'#fff2c9');g.fillStyle=sky;g.fillRect(ix,iy,iw,ih);
  g.globalAlpha=.25;g.fillStyle='#fff';for(let i=0;i<10;i++){g.beginPath();g.moveTo(ix+iw*.5,iy+ih*.95);const a=-Math.PI+i*Math.PI/9.5;g.lineTo(ix+iw*.5+Math.cos(a)*iw,iy+ih*.95+Math.sin(a)*iw);g.lineTo(ix+iw*.5+Math.cos(a+.08)*iw,iy+ih*.95+Math.sin(a+.08)*iw);g.closePath();g.fill();}g.globalAlpha=1;
  g.fillStyle='#8fd16a';g.beginPath();g.ellipse(ix+iw/2,iy+ih*1.02,iw*.75,ih*.22,0,0,7);g.fill();g.fillStyle='#6cb84e';g.beginPath();g.ellipse(ix+iw/2,iy+ih*1.08,iw*.8,ih*.2,0,0,7);g.fill();
  const rnd=mulberry32(77);for(let i=0;i<46;i++){g.fillStyle=['#ff5f7a','#ffd23a','#5ec8ff','#8be36a','#c58cff'][i%5];g.save();g.translate(ix+rnd()*iw,iy+rnd()*ih*.75);g.rotate(rnd()*6);g.fillRect(-2*k*u,-1*k*u,4*k*u,2*k*u);g.restore();}
  const cast=[['kylan',.17,.6,.42,-.06,0],['rong',.5,.48,.48,0,0],['phoenix',.83,.6,.42,.06,0],['heo',.24,.86,.36,-.08,1],['classic',.52,.88,.34,0,1],['lac',.8,.86,.36,.08,1]];
  for(const [id,cx,cy,sz,rot,f] of cast){if(!SPECIES[id])continue;const aw=iw*sz,ah=aw*BBH/BBW,old=previewGraphicsMode;previewGraphicsMode='vector';let a;try{a=renderBird(id,'natural',f?2:0,'none','none',0,Math.max(1,aw/BBW));}finally{previewGraphicsMode=old;}
    g.save();g.translate(ix+iw*cx,iy+ih*cy);g.rotate(rot);g.fillStyle='#0000001c';g.beginPath();g.ellipse(0,ah*.32,aw*.28,ah*.07,0,0,7);g.fill();g.drawImage(a,-aw/2,-ah/2,aw,ah);g.restore();}
  g.restore();
  g.restore();}

// ---------- Thanh cuộn thẻ + con dấu chỉ ----------
const BXS={open:false,spinning:false,order:[],off:0,v:0,v0:0,last:0,raf:0,layout:{},spin:null,lastTick:-1,fx:[],winT:0};
function boxOrder(){const common=BOX_SPECIES.filter(id=>!RARE_SET.has(id)),rare=BOX_SPECIES.filter(id=>RARE_SET.has(id));
  const sh=a=>{const r=mulberry32(20261103);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  return sh(common).concat(sh(rare));}  // các thẻ hiếm nối tiếp nhau thành một cụm
function layoutBox(){const r=$('boxScr').getBoundingClientRect(),Hc=r.height,Wc=r.width;BXS.layout.safeTop=($('probe').offsetHeight||0)/u;
  const stripH=Math.min(Hc*.21,Wc*.34,u*150),top=Hc*.5+Hc*.06,dpr=Math.min(2.5,window.devicePixelRatio||1);
  const sc=$('boxStrip');sc.style.top=top+'px';sc.style.height=stripH+'px';sc.style.width=Wc+'px';sc.width=Math.max(1,Math.round(Wc*dpr));sc.height=Math.max(1,Math.round(stripH*dpr));
  const cardW=Math.round(stripH*.6*dpr)/dpr,cardH=cardW;BXS.layout={...BXS.layout,Wc,Hc,stripH,top,dpr,cardW,cardH,gap:cardW*.12,pitch:cardW*1.12};
  $('boxBtns').style.top=(top+stripH+Hc*.045)+'px';

// Ô loài trên thanh cuộn: ô vuông bo góc màu xanh; loài hiếm có nền sáng và chùm tia vàng phía sau.
const boxTileCache=new Map();
function boxTile(id,sz){const key=id+'|'+sz;let t=boxTileCache.get(key);if(t)return t;const rare=RARE_SET.has(id),c=mkCanvas(sz,sz),g=c.getContext('2d'),r=sz*.17;
  rr(g,sz*.02,sz*.02,sz*.96,sz*.96,r);const bg=g.createLinearGradient(0,0,0,sz);
  if(rare){bg.addColorStop(0,'#6f9cf0');bg.addColorStop(1,'#3f6fd4');}else{bg.addColorStop(0,'#2f55b8');bg.addColorStop(1,'#22409a');}g.fillStyle=bg;g.fill();
  g.save();g.clip();g.fillStyle='#ffffff14';g.fillRect(0,0,sz,sz*.42);g.restore();
  g.lineWidth=sz*.02;g.strokeStyle=rare?'#bcd6ff':'#4b73cf';g.stroke();
  t={base:c,art:boxSpeciesArt(id,Math.round(sz*.98))};boxTileCache.set(key,t);if(boxTileCache.size>160)boxTileCache.delete(boxTileCache.keys().next().value);return t;}
function sparkle(g,x,y,r,a){g.save();g.globalAlpha=a;g.fillStyle='#fff6c4';g.beginPath();g.moveTo(x,y-r);g.quadraticCurveTo(x,y,x+r,y);g.quadraticCurveTo(x,y,x,y+r);g.quadraticCurveTo(x,y,x-r,y);g.quadraticCurveTo(x,y,x,y-r);g.fill();g.restore();}
function drawBoxTile(g,id,x,y,sz,t,glow){const T=boxTile(id,Math.round(sz*BXS.layout.dpr)),rare=RARE_SET.has(id);
  g.drawImage(T.base,x,y,sz,sz);
  if(rare){g.save();rr(g,x+sz*.02,y+sz*.02,sz*.96,sz*.96,sz*.17);g.clip();const cx=x+sz/2,cy=y+sz*.52;
    const rg=g.createRadialGradient(cx,cy,0,cx,cy,sz*.62);rg.addColorStop(0,'rgba(255,240,170,'+(.75+.25*glow)+')');rg.addColorStop(.45,'rgba(255,220,120,'+(.25+.25*glow)+')');rg.addColorStop(1,'rgba(255,220,120,0)');g.fillStyle=rg;g.fillRect(x,y,sz,sz);
    g.translate(cx,cy);g.rotate(t/1000*.35);g.fillStyle='rgba(255,246,200,'+(.16+.18*glow)+')';
    for(let i=0;i<14;i++){g.rotate(Math.PI*2/14);g.beginPath();g.moveTo(0,0);g.lineTo(sz*.9,-sz*.07);g.lineTo(sz*.9,sz*.07);g.closePath();g.fill();}g.restore();}
  g.save();rr(g,x+sz*.02,y+sz*.02,sz*.96,sz*.96,sz*.17);g.clip();const aw=sz*.98,ah=aw*BBH/BBW;g.drawImage(T.art,x+(sz-aw)/2+sz*.02,y+(sz-ah)/2+sz*.05,aw,ah);g.restore();
  if(rare){for(const[dx,dy,r,ph]of[[.16,.2,.09,0],[.84,.3,.07,1.7],[.78,.82,.06,3.1],[.22,.78,.05,4.4]])sparkle(g,x+sz*dx,y+sz*dy,sz*r*(.6+.4*Math.abs(Math.sin(t/600+ph))),.5+.5*Math.abs(Math.sin(t/700+ph)));}}
// Khung thanh cuộn: nền xanh, viền vàng, hai đầu có tai trang trí kèm ngôi sao.
function drawStripFrame(g,Wc,sh,inner){const fy=sh*.13,fh=sh*.74,cap=fh*.36,x0=cap*.62,x1=Wc-cap*.62;
  g.save();for(const [cx,dir] of [[x0,-1],[x1,1]]){rr(g,cx-cap*.55,fy+fh*.18,cap*1.1,fh*.64,cap*.28);g.fillStyle='#2f63c9';g.fill();g.lineWidth=Math.max(2,sh*.02);g.strokeStyle='#f2cf72';g.stroke();
    sparkle(g,cx+dir*cap*.16,fy+fh/2,cap*.26,1);}
  rr(g,x0,fy,x1-x0,fh,fh*.16);const bg=g.createLinearGradient(0,fy,0,fy+fh);bg.addColorStop(0,'#3d78e0');bg.addColorStop(1,'#2a5bc0');g.fillStyle=bg;g.fill();
  g.lineWidth=Math.max(2.5,sh*.026);g.strokeStyle='#f2cf72';g.stroke();rr(g,x0+sh*.03,fy+sh*.03,x1-x0-sh*.06,fh-sh*.06,fh*.13);g.lineWidth=Math.max(1,sh*.008);g.strokeStyle='#ffffff40';g.stroke();g.restore();
