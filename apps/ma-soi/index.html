function stateDigest(s){return fingerprint(JSON.stringify({...s,savedAt:0}));}

function updateSaveWarning(){if(typeof document==='undefined')return;let el=$('savewarning');if(!el)return;el.hidden=saveOK;el.textContent=externalConflict?'Một tab khác đã cập nhật bản lưu. Hãy tải lại trang này để dùng tiến trình mới nhất.':'Trình duyệt chưa cho lưu dữ liệu. Hãy dùng “Xuất bản lưu” trong Cài đặt để giữ tiến trình.';}

const Sound={ctx:null,musicGain:null,fxGain:null,timer:null,init(){try{if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.musicGain=this.ctx.createGain();this.fxGain=this.ctx.createGain();this.musicGain.connect(this.ctx.destination);this.fxGain.connect(this.ctx.destination);this.ambient();}if(this.ctx.state==='suspended')this.ctx.resume();this.update();}catch(e){}},update(){if(!this.ctx)return;this.musicGain.gain.setTargetAtTime(S.settings.music?S.settings.volume*.18:0,this.ctx.currentTime,.3);this.fxGain.gain.setTargetAtTime(S.settings.sfx?S.settings.volume*.45:0,this.ctx.currentTime,.05);},ambient(){let c=this.ctx,buffer=c.createBuffer(1,c.sampleRate*4,c.sampleRate),d=buffer.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){last=(last+Math.random()*.02-.01)/1.005;d[i]=last*4;}let wind=c.createBufferSource();wind.buffer=buffer;wind.loop=true;let filter=c.createBiquadFilter();filter.type='lowpass';filter.frequency.value=400;wind.connect(filter).connect(this.musicGain);wind.start();[110,164.81,220].forEach((f,i)=>{let o=c.createOscillator(),gain=c.createGain(),lfo=c.createOscillator(),depth=c.createGain();o.type='sine';o.frequency.value=f;gain.gain.value=.12/(i+1);lfo.frequency.value=.04+i*.013;depth.gain.value=.035;lfo.connect(depth).connect(gain.gain);o.connect(gain).connect(this.musicGain);o.start();lfo.start();});},tone(type='click'){if(!this.ctx||!S.settings.sfx)return;let c=this.ctx,now=c.currentTime,notes={click:[440],select:[330,440],night:[220,164.81,110],day:[261.63,329.63,392],reveal:[220,277.18,329.63,440],win:[261.63,329.63,392,523.25],lose:[220,196,164.81],death:[130.81,98]}[type]||[440];notes.forEach((f,i)=>{let o=c.createOscillator(),a=c.createGain(),t=now+i*.11;o.type=type==='click'?'sine':'triangle';o.frequency.value=f;a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(.18,t+.015);a.gain.exponentialRampToValueAtTime(.001,t+(type==='click'?.10:.8));o.connect(a).connect(this.fxGain);o.start(t);o.stop(t+1);});}};
Sound.howl=function(){if(!this.ctx||!S.settings.sfx)return;let c=this.ctx,t=c.currentTime;[1,2.005].forEach((mul,i)=>{let o=c.createOscillator(),a=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(145*mul,t);o.frequency.exponentialRampToValueAtTime(205*mul,t+.65);o.frequency.exponentialRampToValueAtTime(177*mul,t+1.8);f.type='lowpass';f.frequency.value=750;a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(.024/(i+1),t+.4);a.gain.linearRampToValueAtTime(.035/(i+1),t+1);a.gain.exponentialRampToValueAtTime(.001,t+2.3);o.connect(f).connect(a).connect(this.fxGain);o.start(t);o.stop(t+2.5);});};

function homeUI(){let c=S.campaign,g=c?.game,canResume=g&&!c.completed;return `<section class="home-main transition-in"><div class="home-art">${landscape('home')}</div><div class="hero-vignette"></div><div class="fog"></div><div class="hero"><span class="kicker">MỘT NGÔI LÀNG. HAI PHE. VÔ VÀN BÍ MẬT.</span><h1>Đêm xuống.<br>Ai còn là người?<span>Lời Nguyền Làng Sương</span></h1><p class="lead">Giữa những gương mặt quen là một lời nói dối.<br>Lắng nghe, suy luận và sống sót qua màn đêm.<br>Một mình bạn. Cả một ngôi làng không dễ tin.</p><div class="actions">${canResume?`<button class="btn" data-action="continue">${icon('play')}Tiếp tục hành trình</button><button class="btn secondary" data-action="setup">Hành trình mới</button>`:`<button class="btn" data-action="setup">${icon('play')}Bước vào màn đêm</button><button class="btn secondary" data-action="help">${icon('book')}Cách chơi</button>`}</div>${canResume?`<div class="resume-hint">${esc(VILLAGES[g.village].name)} · Ván ${c.round}${c.config.length==='finite'?' / '+c.config.rounds:' · Vô tận'} · ${phaseLabel(g)} · ${esc(roleName(human(g).role))}</div>`:''}</div><div class="hero-caption">“Có những con sói<br>chưa từng cần đến nanh.”</div><div class="home-bottom"><div class="feature">${icon('cards')}<h3>Mỗi ván, một số phận</h3><p>6 vai trò · 8–12 người · Cấu hình ngẫu nhiên</p></div><div class="feature">${icon('eye')}<h3>Tin ai là lựa chọn của bạn</h3><p>Tranh luận cùng AI · Sổ tay · Đối chiếu lời khai</p></div><div class="feature">${icon('moon')}<h3>Đêm dài, hành trình còn mãi</h3><p>Chơi ngoại tuyến · Tự động lưu · Chế độ vô tận</p></div></div><div class="version">BẢN 1.0 · MỘT NGƯỜI CHƠI CÙNG AI · KHÔNG CẦN KẾT NỐI MẠNG</div></section>`;}
let setupDraft={name:'Lữ khách',mode:'normal',players:10,length:'finite',rounds:10,difficulty:'normal',trainingRole:'seer',challenge:'mist',reveal:true,noRepeat:true,selfSave:true};
function setupUI(){let d=setupDraft;return `<main class="main"><div class="setup transition-in"><div class="pageintro"><span class="kicker">CHƯƠNG MỚI CỦA BẠN</span><h2>Một chỗ trống bên đống lửa.</h2><p class="muted">Chọn hành trình. Nhận vai. Và đừng vội tin ai.</p></div><div class="setup-grid"><form id="setup-form" class="panel setup-form"><div class="field"><label for="playername">Tên của bạn</label><input id="playername" name="name" maxlength="24" required value="${esc(d.name)}" autocomplete="off"></div><div class="field"><label>Chế độ chơi</label><div class="choicegrid">${[['normal','moon','Hành trình'],['training','eye','Luyện vai'],['challenge','fire','Thử thách']].map(([v,ic,t])=>`<button type="button" class="choice ${d.mode===v?'on':''}" data-action="draft" data-key="mode" data-value="${v}">${icon(ic)}${t}</button>`).join('')}</div></div>${d.mode==='training'?`<div class="field"><label for="trainingRole">Vai muốn luyện</label><select id="trainingRole" name="trainingRole">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${d.trainingRole===k?'selected':''}>${r.name}</option>`).join('')}</select><p class="help">Bạn nhận vai đã chọn. Các nhân vật khác vẫn được chia vai ngẫu nhiên.</p></div>`:''}${d.mode==='challenge'?`<div class="field"><label for="challenge">Thử thách</label><select id="challenge" name="challenge">${Object.entries(CHALLENGES).map(([k,r])=>`<option value="${k}" ${d.challenge===k?'selected':''}>${r.name}</option>`).join('')}</select><p class="help" id="challenge-description">${esc(CHALLENGES[d.challenge].desc)}</p></div>`:`<div class="two"><div class="field"><label for="players">Số người trong làng</label><select id="players" name="players">${[8,10,12].map(n=>`<option value="${n}" ${d.players===n?'selected':''}>${n} người · ${n===12?3:2} Sói</option>`).join('')}</select></div><div class="field"><label for="difficulty">Độ khó AI</label><select id="difficulty" name="difficulty">${[['easy','Dễ · suy luận cảm tính'],['normal','Vừa · biết đối chiếu'],['hard','Khó · phối hợp và giả vai']].map(([k,n])=>`<option value="${k}" ${d.difficulty===k?'selected':''}>${n}</option>`).join('')}</select></div></div>`}<div class="field"><label>Độ dài hành trình</label><div class="choicegrid" style="grid-template-columns:1fr 1fr"><button type="button" class="choice ${d.length==='finite'?'on':''}" data-action="draft" data-key="length" data-value="finite">Tùy chọn số màn</button><button type="button" class="choice ${d.length==='infinite'?'on':''}" data-action="draft" data-key="length" data-value="infinite">∞ &nbsp; Vô tận</button></div></div>${d.length==='finite'?`<div class="field"><label for="rounds">Số màn (mỗi màn là một ván hoàn chỉnh)</label><input id="rounds" type="number" name="rounds" min="1" max="10000" step="1" value="${d.rounds}" required></div>`:'<p class="help" style="margin-bottom:18px">Không giới hạn số ván. Bạn có thể dừng và tiếp tục bất cứ lúc nào.</p>'}${d.mode!=='challenge'?`<details style="margin-bottom:23px"><summary class="gold tiny" style="cursor:pointer">Quy ước bàn chơi</summary><div class="stack" style="margin-top:15px"><label class="checkline"><input type="checkbox" name="reveal" ${d.reveal?'checked':''}>Công khai vai người chết</label><label class="checkline"><input type="checkbox" name="noRepeat" ${d.noRepeat?'checked':''}>Bảo vệ không chọn cùng một người hai đêm liên tiếp</label><label class="checkline"><input type="checkbox" name="selfSave" ${d.selfSave?'checked':''}>Phù thủy được dùng thuốc cứu bản thân</label></div></details>`:''}<button class="btn full" type="submit">${icon('cards')}Bắt đầu hành trình ${icon('arrow')}</button><p class="help" style="text-align:center;margin-top:12px">Vai bí mật · Tự động lưu sau mỗi hành động</p></form><div><div class="setup-art">${landscape('setup')}<div class="caption"><span class="kicker">TRĂNG SẮP LÊN</span><h3 style="margin-top:5px">Một đêm mới đang đợi.</h3></div></div><div class="panel rulesbox"><span class="kicker">TRƯỚC KHI VÀO LÀNG</span><h3 style="margin:8px 0 14px">Luật quen. Những người lạ.</h3><ul><li><strong>Phe Dân</strong> thắng khi loại hết Sói.</li><li><strong>Phe Sói</strong> thắng khi số Sói sống ≥ số người phe Dân sống.</li><li>Hòa phiếu → bỏ phiếu lại một lần. Vẫn hòa → không treo cổ.</li><li>Mỗi đêm Phù thủy dùng tối đa một thuốc. Thuốc độc không bị Bảo vệ chặn.</li><li>Thợ săn trúng độc không được bắn. Các phát súng khác được giải quyết trước khi xét thắng.</li><li>Người chết chỉ quan sát, không phát biểu hay bỏ phiếu.</li></ul><div class="divider"></div><p>AI dùng logic tích hợp và hội thoại theo tình huống. Hãy phát biểu bằng các lựa chọn hành động; không cần nhập hội thoại tự do.</p><button class="btn secondary sm" type="button" data-action="help">${icon('book')}Đọc luật đầy đủ</button></div></div></div></div></main>`;}
function phaseLabel(g){return {prologue:'Mở đầu',role:'Nhận vai',night:'Đêm '+g.day,dawn:'Bình minh '+g.day,discussion:'Hội đồng · Ngày '+g.day,vote:'Bỏ phiếu'+(g.voteRound?' lại':''),verdict:'Kết quả bỏ phiếu',hunt:'Phát súng cuối',end:'Kết thúc'}[g.phase]||'';}
function phaseBar(g){let idx=['prologue','role'].includes(g.phase)?0:g.phase==='night'?1:['dawn','hunt'].includes(g.phase)?2:g.phase==='discussion'?3:4;return `<div class="phasebar">${[['cards','Nhận vai'],['moon','Đêm '+g.day],['sun','Bình minh'],['people','Hội đồng'],['vote','Bỏ phiếu']].map(([ic,n],i)=>`<div class="phasestep ${i===idx?'current':''}">${icon(ic)}<span>${n}</span></div>`).join('')}</div>`;}
function playerSub(g,p){if(g.phase==='prologue'&&p.id===0)return 'Chưa nhận vai';if(!p.alive)return g.rules.reveal?roleName(p.role):'Đã chết · Giấu vai';if(p.id===0)return showRole?roleName(p.role):'Vai bí mật';if(g.phase!=='prologue'&&isWolf(human(g))&&isWolf(p))return 'Đồng đội Sói';let claim=g.claims.filter(c=>c.from===p.id).slice(-1)[0];return claim?'Nhận '+roleName(claim.role):p.job;}
function boardUI(g){let h=human(g),visibleRole=showRole&&g.phase!=='prologue',eligible=g.phase==='night'?nightEligible(g):g.phase==='vote'?voteEligible(g):g.phase==='hunt'?alive(g).map(p=>p.id):[],wolfCount=g.n===12?3:2;return `<div><section class="board"><div class="board-art">${landscape('board',!['night','prologue','role'].includes(g.phase))}</div><div class="fog"></div>${[12,32,59,78].map((x,i)=>`<i class="spark" style="left:${x}%;bottom:${20+i*8}%;animation-delay:${i*1.7}s"></i>`).join('')}<div class="board-content"><div class="board-top"><span class="board-title">${icon('leaf')} &nbsp;QUẢNG TRƯỜNG LÀNG</span><span class="pill ${g.phase==='night'?'active':''}">${icon(g.phase==='night'?'moon':'sun')} ${esc(phaseLabel(g))}</span></div><div class="village-heart">${bonfire()}<p>“${esc(VILLAGES[g.village].line)}”</p><small>${g.phase==='night'?'Chọn một người trong làng để dùng năng lực.':'Chạm vào nhân vật để chọn hoặc xem thông tin.'}</small></div><div class="players">${g.players.map(p=>{let note=g.notes[p.id];return `<button class="player ${p.id===0?'self':''} ${p.alive?'':'dead'} ${selected===p.id?'selected':''}" data-action="select" data-id="${p.id}" aria-label="${esc(p.name)} · ${esc(playerSub(g,p))}${selected===p.id?' · Đang chọn':''}" aria-pressed="${selected===p.id}" ${eligible.includes(p.id)?'style="border-bottom-color:#dfbc7a65"':''}>${note?.flag==='suspect'?'<span class="flag red">?</span>':note?.flag==='trust'?'<span class="flag teal">✓</span>':''}<span class="portrait">${portrait(p)}</span><div class="player-name">${esc(p.name)}</div><div class="player-sub">${esc(playerSub(g,p))}</div>${g.phase==='verdict'&&g.verdict?.tally[p.id]?`<span class="votetag">${g.verdict.tally[p.id]} phiếu</span>`:''}</button>`;}).join('')}</div><div class="board-foot"><span>${g.n} người · ${wolfCount} Sói lúc bắt đầu</span><span>${g.rules.reveal?'Vai người chết công khai':'Vai người chết giữ kín'}</span></div><div class="own-role ${visibleRole?'':'rolehidden'}"><span class="roleicon">${icon(h.alive?(visibleRole?ROLES[h.role].icon:'lock'):'eye')}</span><div><span class="caps muted">${h.alive?'VAI TRÒ CỦA BẠN':'BẠN ĐANG QUAN SÁT'}</span><br><strong>${visibleRole?roleName(h.role):g.phase==='prologue'?'Chưa nhận vai bí mật':'Thân phận được che kín'}</strong><p>${!h.alive?'Bạn đã chết. Tiếp tục quan sát đến khi ván kết thúc.':visibleRole?(team(h)==='wolf'?'Cùng đàn Sói chiếm quyền kiểm soát làng.':'Cùng phe Dân tìm và loại hết Ma Sói.'):'Chỉ bạn biết vai của mình.'}</p></div><button class="iconbtn" data-action="toggle-role" title="${showRole?'Ẩn':'Hiện'} vai" aria-label="${showRole?'Ẩn':'Hiện'} vai">${icon(showRole?'eye':'lock')}</button></div></div></section>${selectedInfo(g)}</div>`;}
function selectedInfo(g){let p=byId(g,selected);if(!p)return `<div class="panel selection-info"><span class="gold">${icon('eye')}</span><div class="info"><strong>Mọi chi tiết đều có thể là manh mối.</strong><p>Chọn một nhân vật để xem lời nhận vai, ghi chú và đánh dấu.</p></div></div>`;let c=g.claims.filter(c=>c.from===p.id).slice(-1)[0],known=human(g).role==='seer'?human(g).known.find(k=>k.target===p.id):null;return `<div class="panel selection-info"><span class="portrait">${portrait(p)}</span><div class="info"><strong>${esc(p.name)} ${p.id===0?'<span class="gold tiny">· Bạn</span>':''}</strong><p>${esc(p.alive?p.job:'Đã chết · '+(g.rules.reveal?roleName(p.role):'Chưa biết vai'))}${known?' · <span class="teal">Bạn đã soi: '+(known.wolf?'Sói':'Không phải Sói')+'</span>':c?' · Nhận '+esc(roleName(c.role)):''}</p></div><button class="btn secondary sm" data-action="note-player" data-id="${p.id}">${icon('book')}Ghi chú</button></div>`;}
function messageUI(g,l){if(l.kind!=='speech')return `<div class="message system ${l.kind==='death'?'death':''}"><div class="syslabel">${l.kind==='death'?'TIN TỪ QUẢN TRÒ':'QUẢN TRÒ'} · NGÀY ${l.day}</div>${esc(l.text)}</div>`;let p=byId(g,l.from);return `<div class="message"><span class="avatar">${portrait(p,30)}</span><div class="bubble"><div class="speaker">${esc(p.name)}${p.id===0?'<span class="badgecount">Bạn</span>':''}<small>Ngày ${l.day}</small></div>${esc(l.text)}</div></div>`;}
function feedUI(g){if(['prologue','role','night'].includes(g.phase)){let title=g.phase==='prologue'?'Có điều gì đó trong sương.':g.phase==='role'?'Một vai trò. Một bí mật.':'Làng đã chìm vào giấc ngủ.',copy=g.phase==='prologue'?VILLAGES[g.village].story:g.phase==='role'?'Nhận vai trước khi đêm đầu tiên bắt đầu. Đừng để người khác nhìn thấy thân phận của bạn.':'Không ai được nói chuyện vào ban đêm. Những gì diễn ra lúc này chỉ được tiết lộ sau khi kết thúc ván.';return `<div class="night-content"><div class="nightseal">${icon(g.phase==='role'?'cards':'moon')}</div><span class="kicker">${g.phase==='night'?'ĐÊM '+g.day:'LỜI DẪN'}</span><div class="phase-title">${title}</div><p>${esc(copy)}</p><p class="quote">“Sự im lặng cũng biết nói dối.”</p></div>`;}
return g.logs.slice(-100).map(l=>messageUI(g,l)).join('');}
function targetText(g){return selected!==null?esc(byId(g,selected)?.name||'Chưa chọn'):'Chưa chọn ai';}
function actionUI(g){let h=human(g),p=byId(g,selected),selectedLiving=p?.alive,choices=g.phase==='night'?nightEligible(g):g.phase==='vote'?voteEligible(g):alive(g).filter(x=>g.phase==='hunt'||x.id!==0).map(x=>x.id),base=`<div class="targethint">${icon('flag')} &nbsp;Đang chọn: <strong>${targetText(g)}</strong></div><div class="mobile-target"><label class="tiny" for="targetpicker">Chọn nhanh nhân vật</label><select id="targetpicker"><option value="">Chưa chọn ai</option>${choices.map(id=>`<option value="${id}" ${selected===id?'selected':''}>${esc(byId(g,id).name)}</option>`).join('')}</select></div>`;
if(g.phase==='prologue')return `<span class="kicker">VÁN ${S.campaign.round} · ${g.n} NGƯỜI</span><h3>Cổng làng đang mở.</h3><p>Đọc quy ước bàn chơi, rồi nhận vai bí mật. Vai của AI cũng được chia ngẫu nhiên cho ván này.</p><button class="btn full" data-action="receive-role">${icon('cards')}Nhận vai bí mật</button><button class="btn secondary full sm" data-action="game-rules">Xem quy ước ván này</button>`;
if(g.phase==='role')return `<span class="kicker">THÂN PHẬN CỦA BẠN</span><h3 class="gold">${roleName(h.role)}</h3><p>${esc(ROLES[h.role].desc)}</p>${isWolf(h)?`<div class="private">Đồng đội: ${g.players.filter(x=>isWolf(x)&&x.id!==0).map(x=>esc(x.name)).join(', ')}.</div>`:''}<button class="btn full" data-action="first-night">${icon('moon')}Đêm đầu tiên bắt đầu</button><button class="btn secondary sm full" data-action="role-card">${icon('cards')}Xem lại thẻ vai</button>`;
if(g.phase==='night'){let n=g.night;if(n.done)return `<span class="kicker">ĐÃ XÁC NHẬN HÀNH ĐỘNG</span><h3>Đợi trời sáng.</h3><div class="private">${esc(n.result||'Bạn đang quan sát.')}</div><button class="btn full" data-action="dawn">${icon('sun')}Bước sang bình minh</button>`;if(!h.alive||['villager','hunter'].includes(h.role))return `<span class="kicker">ĐÊM ${g.day}</span><h3>${h.alive?'Nhắm mắt và lắng nghe.':'Lặng lẽ quan sát.'}</h3><p>${h.alive?'Bạn không có hành động chủ động vào ban đêm. Quản trò sẽ điều hành các vai còn lại.':'Bạn đã chết và không thể tác động lên ván chơi. Vai bí mật của người khác vẫn được giữ kín đến khi kết thúc.'}</p><button class="btn full" data-action="sleep">${icon('sun')}Ngủ đến bình minh</button>`;
if(h.role==='witch'){let victim=byId(g,n.attack),canHeal=h.heal&&victim&&(victim.id!==0||g.rules.selfSave);return `<span class="kicker">PHÙ THỦY THỨC DẬY</span><h3>Một lựa chọn trong đêm.</h3><p>Sói chọn cắn <strong class="red">${esc(victim?.name||'không ai')}</strong>. Bạn không biết người này có được Bảo vệ cứu hay không.</p><div class="private">Thuốc cứu: ${h.heal?'còn 1':'đã hết'} · Thuốc độc: ${h.poison?'còn 1':'đã hết'}<br>Mỗi đêm tối đa một thuốc.${!g.rules.selfSave?' Không được tự cứu.':''}</div>${base}<button class="btn full" data-action="night-action" data-value="heal" ${canHeal?'':'disabled'}>${icon('potion')}Cứu ${esc(victim?.name||'người bị cắn')}</button><button class="btn danger full" data-action="night-action" data-value="poison" ${h.poison&&selectedLiving?'':'disabled'}>Dùng thuốc độc với người đang chọn</button><button class="btn secondary full sm" data-action="night-action" data-value="skip">Giữ lại thuốc</button>`;}
let role=ROLES[h.role],action={wolf:'attack',seer:'inspect',guard:'protect'}[h.role],label={wolf:'Chọn người để cắn',seer:'Soi người đang chọn',guard:'Bảo vệ người đang chọn'}[h.role],eligible=nightEligible(g).includes(selected);let pack=isWolf(h)?`<div class="private">${n.packVotes.filter(v=>v.from!==0).map(v=>esc(byId(g,v.from).name)+' đề nghị cắn '+esc(byId(g,v.target)?.name)).join('<br>')}<br>Bạn đại diện chốt mục tiêu cho đàn đêm nay.</div>`:'';return `<span class="kicker">${role.name.toLocaleUpperCase('vi-VN')} THỨC DẬY</span><h3>${h.role==='wolf'?'Đàn Sói đang chờ.':h.role==='seer'?'Nhìn xuyên màn sương.':'Thắp một ngọn đèn.'}</h3><p>${esc(role.desc)}</p>${h.role==='guard'&&g.rules.noRepeat&&h.lastGuard!==null?`<p class="gold" style="margin-top:8px">Không thể chọn ${esc(byId(g,h.lastGuard).name)} hai đêm liên tiếp.</p>`:''}${pack}${base}<button class="btn full" data-action="night-action" data-value="${action}" ${eligible?'':'disabled'}>${icon(role.icon)}${label}</button>${h.role!=='wolf'?'<button class="btn secondary full sm" data-action="night-action" data-value="skip">Không dùng năng lực đêm nay</button>':''}`;}
if(g.phase==='dawn')return `<span class="kicker">BÌNH MINH NGÀY ${g.day}</span><h3>${g.lastDeaths.length?'Có người đã không trở về.':'Một đêm yên lặng.'}</h3><p>${g.lastDeaths.length?g.lastDeaths.map(d=>esc(byId(g,d.id).name)).join(', ')+' đã chết. Nguyên nhân chi tiết được giữ kín đến cuối ván.':'Không có ai chết. Chưa thể kết luận ai đã dùng năng lực.'}</p><button class="btn full" data-action="discussion">${icon('people')}${h.alive?'Vào hội đồng':'Quan sát hội đồng'}</button>`;
if(g.phase==='discussion'){let canSpeak=h.alive&&g.discussion.humanTurns<3;return `<span class="kicker">THẢO LUẬN · ${h.alive?3-g.discussion.humanTurns+' LƯỢT PHÁT BIỂU CÒN LẠI':'CHẾ ĐỘ QUAN SÁT'}</span><h3>${h.alive?'Bạn tin ai?':'Lắng nghe người ở lại.'}</h3>${h.alive?`<div class="tactics">${[['accuse','Buộc tội'],['defend','Bênh vực'],['question','Chất vấn'],['claim','Nhận vai'],['rebut','Phản bác']].map(([v,t])=>`<button class="tactic ${tactic===v?'on':''}" data-action="tactic" data-value="${v}" ${canSpeak?'':'disabled'}>${t}</button>`).join('')}</div>${tactic==='claim'?`<label for="claimrole" class="tiny">Vai bạn muốn công khai (có thể nói dối)</label><select id="claimrole">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${claimRole===k?'selected':''}>${r.name}</option>`).join('')}</select>${claimRole==='seer'?`<select id="claimverdict" aria-label="Kết quả soi muốn công bố"><option value="wolf" ${claimVerdict==='wolf'?'selected':''}>Người đang chọn là Sói</option><option value="village" ${claimVerdict==='village'?'selected':''}>Người đang chọn không phải Sói</option></select>`:''}`:''}${base}<button class="btn full" data-action="speak" ${canSpeak&&((tactic==='claim'&&claimRole!=='seer')||(selectedLiving&&selected!==0))?'':'disabled'}>${icon('people')}Phát biểu trước hội đồng</button>`:'<p>Bạn không thể phát biểu hoặc bỏ phiếu khi đã chết. Tiếp tục để theo dõi kết quả ván chơi.</p>'}<div class="two" style="gap:8px"><button class="btn secondary sm" data-action="more-discussion" ${g.discussion.batch<3?'':'disabled'}>Nghe thêm</button><button class="btn secondary sm" data-action="start-vote">${icon('vote')}Bỏ phiếu</button></div>`;}
if(g.phase==='vote')return `<span class="kicker">${g.voteRound?'BỎ PHIẾU LẠI · LẦN CUỐI':'QUYẾT ĐỊNH CỦA HỘI ĐỒNG'}</span><h3>${h.alive?'Một phiếu. Một số phận.':'Hội đồng đang quyết định.'}</h3><p>${g.nominees.length?'Chỉ bầu cho: '+g.nominees.map(id=>esc(byId(g,id).name)).join(', ')+'.':'Người nhiều phiếu nhất bị treo cổ. Không được tự bầu mình.'}</p>${h.alive?`${base}<button class="btn full" data-action="vote" ${voteEligible(g).includes(selected)?'':'disabled'}>${icon('vote')}Bỏ phiếu cho người đang chọn</button><button class="btn secondary full sm" data-action="abstain">Bỏ phiếu trắng</button>`:'<button class="btn full" data-action="abstain">Xem kết quả bỏ phiếu</button>'}`;
if(g.phase==='verdict'){let v=g.verdict,max=Math.max(1,...Object.values(v.tally));return `<span class="kicker">KẾT QUẢ BỎ PHIẾU</span><h3>${v.executed!==null?esc(byId(g,v.executed).name)+' bị treo cổ.':v.next==='runoff'?'Chưa có quyết định.':'Không ai bị treo cổ.'}</h3><div class="vote-bars">${Object.entries(v.tally).sort((a,b)=>b[1]-a[1]).map(([id,count])=>`<div class="vote-row"><div class="row between"><span>${esc(byId(g,Number(id)).name)}</span><span class="gold">${count} phiếu</span></div><div class="bartrack"><div class="barfill" style="width:${count/max*100}%"></div></div></div>`).join('')||'<p>Tất cả bỏ phiếu trắng.</p>'}</div><button class="btn full" data-action="after-verdict">${icon(v.next==='runoff'?'vote':'arrow')}${v.next==='runoff'?'Bỏ phiếu lại':'Tiếp tục'}</button><button class="btn secondary full sm" data-action="ballots">Xem từng phiếu</button>`;}
if(g.phase==='hunt')return `<span class="kicker">THỢ SĂN · PHÁT SÚNG CUỐI</span><h3>Một cơ hội cuối cùng.</h3><p>Bạn đã chết nhưng được bắn một người còn sống trước khi quản trò xét thắng. Hãy chọn cẩn thận.</p>${base}<button class="btn danger full" data-action="shoot" ${selectedLiving?'':'disabled'}>${icon('bow')}Bắn người đang chọn</button>`;return '';}
function councilUI(g){return `<section class="panel council"><header class="council-head"><div><span class="kicker">${g.phase==='night'?'CHỈ MÌNH BẠN BIẾT':'NHỮNG LỜI THÌ THẦM'}</span><h3>${['prologue','role','night'].includes(g.phase)?'Lời của quản trò':'Hội đồng làng'}</h3></div><span class="pill"><span class="dot"></span>${g.phase==='night'?'Bí mật':'Ngày '+g.day}</span></header><div class="council-feed" id="feed" role="log" aria-label="Diễn biến ván chơi">${feedUI(g)}</div><div class="actionbox">${actionUI(g)}</div></section>`;}
function gameUI(){let c=S.campaign,g=c?.game;if(!g)return setupUI();if(g.phase==='end')return resultUI(g);let h=human(g),living=alive(g).length;return `<main class="main transition-in"><div class="game-head"><div><span class="kicker">${c.config.mode==='training'?'LUYỆN VAI':c.config.mode==='challenge'?'THỬ THÁCH':'HÀNH TRÌNH'} · VÁN ${String(c.round).padStart(2,'0')}${c.config.length==='finite'?' / '+c.config.rounds:' / ∞'}</span><h2>${esc(VILLAGES[g.village].name)}</h2><span class="muted tiny">${g.phase==='prologue'?'Người lữ khách, chào mừng về làng.':!h.alive?'Bạn đã chết · Tiếp tục quan sát đến cuối ván.':'Mọi lời nói đều có hai mặt.'}</span></div><div class="metrics"><div class="metric"><b class="teal">${String(living).padStart(2,'0')}</b><small>Còn sống</small></div><div class="metric"><b>${String(g.n-living).padStart(2,'0')}</b><small>Đã chết</small></div><div class="metric"><b class="gold">${String(g.day).padStart(2,'0')}</b><small>Ngày trong ván</small></div></div></div>${phaseBar(g)}<div class="tabs" style="margin-top:0">${[['council','people','Bàn chơi'],['journal','book','Sổ tay'],['relations','relations','Quan hệ'],['rules','cards','Luật ván này']].map(([id,ic,t])=>`<button class="tab ${activeTab===id?'on':''}" data-action="tab" data-value="${id}">${icon(ic)} &nbsp;${t}</button>`).join('')}</div>${activeTab==='council'?`<div class="game-grid">${boardUI(g)}${councilUI(g)}</div>`:activeTab==='journal'?journalUI(g):activeTab==='relations'?relationsUI(g):`<section class="panel aux-panel">${rulesUI(g)}</section>`}</main>`;}
function journalUI(g){let h=human(g),privateInfo=h.role==='seer'&&h.known.length?`<div class="private" style="margin:0 0 22px">${icon('lock')} &nbsp;<strong>Kết quả soi riêng của bạn</strong><br>${h.known.map(k=>`Đêm ${k.day}: ${esc(byId(g,k.target).name)} — ${k.wolf?'Sói':'Không phải Sói'}`).join('<br>')}</div>`:isWolf(h)?`<div class="private" style="margin:0 0 22px">${icon('lock')} &nbsp;Đồng đội Sói: ${g.players.filter(p=>isWolf(p)&&p.id!==0).map(p=>esc(p.name)+(p.alive?'':' (đã chết)')).join(', ')}</div>`:'';return `<section class="panel aux-panel"><div class="row between wrap" style="margin-bottom:20px"><div><span class="kicker">CHỈ MÌNH BẠN ĐỌC</span><h2 style="margin:5px 0">Sổ tay bên ngọn nến</h2><p class="muted tiny">Đánh dấu là suy luận của bạn, không phải xác nhận từ quản trò. Ghi chú tự lưu khi nhập.</p></div><button class="btn secondary sm" data-action="tab" data-value="council">${icon('back')}Về bàn chơi</button></div>${privateInfo}<div class="journal-grid">${g.players.map(p=>{let n=g.notes[p.id]||{flag:'unknown',text:''},claims=g.claims.filter(c=>c.from===p.id);return `<article class="notecard" id="note-${p.id}"><div class="row"><span class="portrait">${portrait(p,37)}</span><div><strong>${esc(p.name)} ${p.id===0?'· Bạn':''}</strong><div class="muted tiny">${esc(playerSub(g,p))}</div></div></div>${claims.length?`<p class="tiny muted" style="margin-top:9px">Lời nhận vai: ${claims.map(c=>'Ngày '+c.day+' · '+roleName(c.role)+(c.target!==null?' → '+byId(g,c.target).name+' '+(c.verdict==='wolf'?'là Sói':'không phải Sói'):'')).map(esc).join('<br>')}</p>`:''}<div class="tactics">${[['unknown','Chưa rõ'],['suspect','? Nghi ngờ'],['trust','✓ Tin tưởng']].map(([v,t])=>`<button class="tactic ${n.flag===v?'on':''}" data-action="flag" data-id="${p.id}" data-value="${v}">${t}</button>`).join('')}</div><textarea data-note="${p.id}" maxlength="1000" placeholder="Điều gì khiến bạn chú ý…" aria-label="Ghi chú về ${esc(p.name)}">${esc(n.text)}</textarea></article>`;}).join('')}</div></section>`;}
function relationsUI(g){let edges=g.relations,focus=byId(g,selected),filtered=focus?edges.filter(e=>e.from===focus.id||e.target===focus.id):edges;let W=500,C=250,R=185,points=g.players.map((p,i)=>{let a=i/g.n*Math.PI*2-Math.PI/2;return {x:C+Math.cos(a)*R,y:C+Math.sin(a)*R,p};}),edgeCounts={};for(let e of filtered){let key=e.from+'-'+e.target+'-'+(e.type==='defend'?'defend':e.type==='vote'?'vote':'accuse');edgeCounts[key]=(edgeCounts[key]||0)+1;}let lines=Object.entries(edgeCounts).map(([key,count])=>{let [a,b,type]=key.split('-'),pa=points[Number(a)],pb=points[Number(b)],color=type==='defend'?'#88c8b7':type==='vote'?'#dfbc7a':'#ec9290';return `<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="${color}" stroke-width="${Math.min(4,1+count*.4)}" opacity=".3"/>`;}).join('');let typeText={vote:'bỏ phiếu cho',accuse:'nghi ngờ',defend:'bênh vực',question:'chất vấn',rebut:'phản bác'};return `<section class="panel aux-panel"><div class="row between wrap"><div><span class="kicker">CHỈ TỪ HÀNH ĐỘNG CÔNG KHAI</span><h2 style="margin:5px 0 8px">Ai đang đứng cùng ai?</h2><p class="muted tiny">Vàng: phiếu bầu · Đỏ: chất vấn / nghi ngờ · Xanh: bênh vực. Đường nối thể hiện tương tác, không xác nhận cùng phe.</p></div><button class="btn secondary sm" data-action="clear-select">Xem tất cả</button></div><div class="rel-layout"><div><svg viewBox="0 0 ${W} ${W}" class="relations-svg" role="img" aria-label="Sơ đồ tương tác công khai"><circle cx="250" cy="250" r="185" fill="none" stroke="#ffffff0a" stroke-dasharray="3 9"/>${lines}${points.map(({x,y,p})=>`<g><circle cx="${x}" cy="${y}" r="${selected===p.id?23:19}" fill="${p.alive?'#1c3540':'#15232d'}" stroke="${selected===p.id?'#dfbc7a':'#5c778255'}"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="${p.alive?'#dfbc7a':'#617b87'}" font-size="15">${p.id+1}</text><text x="${x}" y="${y+36}" text-anchor="middle" fill="#b3c2c2" font-size="13">${esc(p.name)}</text></g>`).join('')}</svg><select id="relationfocus" aria-label="Lọc tương tác theo người"><option value="">Tất cả nhân vật</option>${g.players.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><h3 style="margin:20px 0 14px">${focus?'Tương tác của '+esc(focus.name):'Dấu vết của hội đồng'}</h3><div class="relation-list">${filtered.length?filtered.slice(-150).reverse().map(e=>`<div class="relation-item"><strong>${esc(byId(g,e.from).name)}</strong> <span class="${e.type==='defend'?'teal':e.type==='vote'?'gold':'red'}">${typeText[e.type]}</span> <strong>${esc(byId(g,e.target).name)}</strong><small>Ngày ${e.day}</small></div>`).join(''):'<div class="empty">Chưa có tương tác. Hãy bắt đầu cuộc thảo luận.</div>'}</div></div></div></section>`;}
function rulesUI(g=null){let rules=g?.rules||{reveal:true,noRepeat:true,selfSave:true},n=g?.n||10,w=n===12?3:2;return `<span class="kicker">LUẬT ĐƯỢC CÔNG BỐ TRƯỚC VÁN</span><h2 style="margin:7px 0 17px">Luật của Làng Sương</h2><div class="rules-copy"><p><strong>${n} người: ${w} Ma Sói, 1 Tiên tri, 1 Bảo vệ, 1 Phù thủy, 1 Thợ săn và ${n-w-4} Dân làng.</strong> Khi có vai đặc biệt, tất cả vẫn thuộc phe Dân trừ Ma Sói.</p><ol><li><strong>Ban đêm:</strong> các vai hành động bí mật. Bảo vệ chọn người, đàn Sói chốt một mục tiêu, Tiên tri nhận kết quả soi, Phù thủy quyết định dùng tối đa một thuốc. Những hành động hợp lệ đã chọn đều được thực hiện kể cả người dùng năng lực chết trong cùng đêm.</li><li><strong>Thuốc và bảo vệ:</strong> thuốc cứu hoặc Bảo vệ đều ngăn vết cắn; dùng cả hai vẫn sống và thuốc vẫn bị tiêu hao. Thuốc độc giết mục tiêu bất kể có Bảo vệ hay thuốc cứu. Phù thủy chỉ biết mục tiêu cắn, không biết ai được bảo vệ. ${rules.selfSave?'Phù thủy được tự cứu.':'Phù thủy không được tự cứu.'} ${rules.noRepeat?'Bảo vệ không được chọn cùng người hai đêm liên tiếp.':'Bảo vệ được chọn cùng người nhiều đêm liên tiếp.'}</li><li><strong>Ban ngày:</strong> quản trò công bố người chết, không công bố nguyên nhân hay năng lực đã dùng. ${rules.reveal?'Vai người chết được công khai.':'Vai người chết giữ kín đến cuối ván.'} Người sống thảo luận, có thể nói thật hoặc nói dối, kể cả nhận vai khác.</li><li><strong>Bỏ phiếu:</strong> mỗi người sống một phiếu, không tự bầu mình, được bỏ phiếu trắng. Người nhiều phiếu hợp lệ nhất bị treo cổ, không cần quá bán. Hòa cao nhất thì bỏ phiếu lại trong nhóm hòa; vẫn hòa hoặc không có phiếu hợp lệ thì không treo ai.</li><li><strong>Thợ săn:</strong> chết vì cắn, treo cổ hoặc phát súng thì phải chọn bắn một người sống. Chết vì độc không được bắn. Phát súng được giải quyết trước khi xét thắng.</li><li><strong>Thắng / thua:</strong> Dân thắng khi không còn Sói sống. Sói thắng khi số Sói sống bằng hoặc nhiều hơn số người phe Dân sống. Người đã chết vẫn thắng cùng phe của mình; số người sống có thể bằng 0 và khi đó Dân thắng vì không còn Sói.</li><li><strong>Người chết:</strong> không dùng năng lực ở các đêm sau, không phát biểu, không bỏ phiếu. Bạn được tiếp tục theo dõi và chỉ xem toàn bộ bí mật khi ván kết thúc.</li></ol><p><strong>Cách điều khiển:</strong> chọn nhân vật trên bàn, rồi bấm hành động ở bảng bên phải. Ban ngày dùng các lựa chọn buộc tội, bênh vực, chất vấn, nhận vai hoặc phản bác. Có tối đa 3 lượt phát biểu mỗi ngày; “Nghe thêm” mở thêm một vòng ý kiến AI, tối đa 3 vòng.</p><p><strong>AI và độ khó:</strong> AI Dân suy luận từ lời khai, phiếu bầu và vai người chết nếu được công khai. Tiên tri có thông tin soi riêng; Sói biết đồng đội. Độ khó thay đổi độ nhiễu khi suy luận và tần suất Sói giả vai. Không có AI ngôn ngữ hoặc kết nối máy chủ.</p></div><div class="role-reference">${Object.values(ROLES).map(r=>`<article class="role-ref">${icon(r.icon)}<h3>${r.name}</h3><p>${esc(r.desc)}</p></article>`).join('')}</div>`;}
function ballotsUI(g,v){return `<div class="tablewrap"><table><thead><tr><th>Người bỏ phiếu</th><th>Chọn loại</th></tr></thead><tbody>${v.ballots.map(b=>`<tr><td>${esc(byId(g,b.from).name)}</td><td>${b.target===null?'<span class="muted">Phiếu trắng</span>':esc(byId(g,b.target).name)}</td></tr>`).join('')}</tbody></table></div>`;}
function allRolesUI(g){return `<div class="tablewrap"><table><thead><tr><th>Nhân vật</th><th>Vai thật</th><th>Kết cục</th></tr></thead><tbody>${g.players.map(p=>`<tr><td>${esc(p.name)}${p.id===0?' <span class="gold">· Bạn</span>':''}</td><td class="${isWolf(p)?'red':'teal'}">${icon(ROLES[p.role].icon)} &nbsp;${roleName(p.role)}</td><td>${p.alive?'Còn sống':'Ngày '+p.death.day+' · '+({bite:'Sói cắn',poison:'Trúng độc',execution:'Treo cổ',shot:'Thợ săn bắn'}[p.death.cause])}</td></tr>`).join('')}</tbody></table></div>`;}
function replayUI(g){return `<div class="row between wrap" style="margin-bottom:20px"><div><span class="kicker">MỌI BÍ MẬT ĐƯỢC MỞ</span><h2 style="margin-top:5px">Nhìn lại màn sương</h2></div><span class="pill">${g.day} ngày · ${g.logs.length} diễn biến</span></div>${allRolesUI(g)}<div style="margin-top:22px">${Array.from({length:g.day},(_,i)=>i+1).map(day=>{let night=g.audit.find(a=>a.day===day&&a.type==='night'),shots=g.audit.filter(a=>a.day===day&&a.type==='shot'),votes=g.votes.filter(v=>v.day===day),name=id=>id===null?'Không dùng':esc(byId(g,id)?.name||'—');return `<article class="replay-day"><h3>Ngày ${day}</h3>${night?`<p>${icon('moon')} &nbsp;Sói chọn cắn: <strong class="red">${name(night.attack)}</strong></p><p>Bảo vệ chọn: <strong>${name(night.guard)}</strong> · Phù thủy cứu: <strong>${night.heal?name(night.attack):'Không dùng'}</strong> · Thuốc độc: <strong>${name(night.poison)}</strong></p>${night.inspections.map(k=>`<p>${name(k.from)} soi ${name(k.target)} → <span class="${k.wolf?'red':'teal'}">${k.wolf?'Sói':'Không phải Sói'}</span></p>`).join('')}<details><summary>Ý kiến của đàn Sói lúc đầu đêm</summary>${night.packVotes.map(v=>`<p>${name(v.from)} đề nghị cắn ${name(v.target)}.</p>`).join('')}<p class="tiny">Nếu bạn là Sói, mục tiêu cuối cùng do bạn chốt có thể khác đề nghị ban đầu.</p></details>`:''}${shots.map(a=>`<p class="gold">${name(a.from)} (Thợ săn) bắn ${name(a.target)}.</p>`).join('')}${votes.map(v=>`<details><summary>Phiếu bầu ${v.round?'lại':''} · ngày ${day}</summary>${ballotsUI(g,v)}</details>`).join('')}<details><summary>Đọc lại lời khai và thông báo ngày ${day}</summary>${g.logs.filter(l=>l.day===day).map(l=>messageUI(g,l)).join('')}</details></article>`;}).join('')}</div>`;}
function resultUI(g){let c=S.campaign,win=g.outcome.won;return `<main class="main"><div class="result-wrap transition-in"><section class="panel result-hero"><div class="nightseal">${icon(win?'star':g.outcome.winner==='wolf'?'wolf':'sun')}</div><span class="kicker">${c.completed?'HÀNH TRÌNH ĐÃ HOÀN TẤT':'VÁN '+c.round+' ĐÃ KHÉP LẠI'}</span><h2 class="${win?'gold':''}">${win?'Bạn đã chiến thắng.':'Làng vẫn nhớ tên bạn.'}</h2><p>${g.outcome.winner==='wolf'?'Phe Sói chiếm quyền kiểm soát làng.':'Phe Dân đã loại hết Ma Sói.'} Bạn là <strong>${roleName(human(g).role)}</strong>${human(g).alive?' và còn sống đến cuối ván.':', chiến đấu cùng phe đến phút cuối.'}</p><div class="row wrap" style="justify-content:center;margin-top:18px"><span class="pill">${g.day} ngày</span><span class="pill">${alive(g).length} người sống</span><span class="pill">${c.wins} thắng / ${c.round} ván trong hành trình</span></div><div class="actions">${c.completed?'<button class="btn" data-action="setup">'+icon('spark')+'Hành trình mới</button>':'<button class="btn" data-action="next-round">'+icon('arrow')+'Bước vào màn '+(c.round+1)+'</button>'}<button class="btn secondary" data-action="result-tab" data-value="replay">${icon('eye')}Xem lại toàn bộ</button><button class="btn secondary" data-action="nav" data-value="stats">${icon('chart')}Thống kê</button></div></section><div class="tabs"><button class="tab ${activeTab!=='replay'?'on':''}" data-action="result-tab" data-value="roles">Vai trò & kết cục</button><button class="tab ${activeTab==='replay'?'on':''}" data-action="result-tab" data-value="replay">Diễn biến & bí mật</button></div><section class="panel aux-panel">${activeTab==='replay'?replayUI(g):`<span class="kicker">BÊN DƯỚI NHỮNG GƯƠNG MẶT</span><h2 style="margin:6px 0 20px">Sự thật của ngôi làng</h2>${allRolesUI(g)}<p class="help" style="margin-top:18px">Chọn “Diễn biến & bí mật” để đối chiếu hành động đêm, lời khai và từng phiếu bầu.</p>`}</section></div></main>`;}
function statsUI(){let st=S.stats;return `<main class="main transition-in"><div class="pageintro"><span class="kicker">NHỮNG ĐÊM BẠN ĐÃ ĐI QUA</span><h2>Dấu chân trong sương</h2><p class="muted">Thống kê gồm hành trình, luyện vai và thử thách. Giữ tối đa 8 bản xem lại gần nhất.</p></div><div class="stats-grid">${[[st.played,'Ván đã hoàn thành'],[st.played?Math.round(st.won/st.played*100)+'%':'—','Tỷ lệ thắng'],[st.bestStreak,'Chuỗi thắng tốt nhất'],[st.correctVotes,'Phiếu bầu trúng Sói']].map(([v,l])=>`<div class="statcard"><b>${v}</b><small>${l}</small></div>`).join('')}</div><section class="panel aux-panel" style="min-height:0;margin-bottom:24px"><div class="row between wrap"><h2>Những dấu ấn</h2><span class="pill">${st.unlocked.length} / ${ACHIEVEMENTS.length} thành tích</span></div><div class="achievements" style="margin-top:20px">${ACHIEVEMENTS.map(a=>`<article class="achievement ${st.unlocked.includes(a.id)?'unlocked':''}">${icon(a.icon)}<strong>${a.name} ${st.unlocked.includes(a.id)?'✓':''}</strong><p>${a.desc}</p></article>`).join('')}</div></section><div class="setup-grid"><section class="panel aux-panel"><h2 style="margin-bottom:20px">Sáu số phận</h2><div class="tablewrap"><table><thead><tr><th>Vai</th><th>Đã chơi</th><th>Thắng</th></tr></thead><tbody>${Object.entries(ROLES).map(([k,r])=>`<tr><td>${icon(r.icon)} &nbsp;${r.name}</td><td>${st.roleGames[k]||0}</td><td>${st.roleWins[k]||0}</td></tr>`).join('')}</tbody></table></div></section><section class="panel aux-panel"><h2 style="margin-bottom:13px">Nhật ký các ván</h2>${S.history.length?S.history.map((g,i)=>`<div class="history-row"><div><strong>${esc(VILLAGES[g.village].name)}</strong><small>${fmtDate(g.outcome.at)} · ${roleName(human(g).role)} · ${g.day} ngày${g.mode==='training'?' · Luyện vai':g.mode==='challenge'?' · Thử thách':''}</small></div><span class="${g.outcome.won?'teal':'muted'} tiny">${g.outcome.won?'Thắng':'Thua'}</span><button class="btn secondary sm" data-action="history" data-id="${i}">Xem lại</button></div>`).join(''):'<div class="empty">Một đêm đầu tiên đang đợi bạn.</div>'}</section></div></main>`;}
function render(){let g=currentGame();document.body.classList.toggle('day',view==='game'&&g&&!['night','prologue','role'].includes(g.phase));document.body.classList.toggle('reduce',S.settings.reduced||S.settings.speed==='fast');$('app').innerHTML=nav()+`<div class="shell">${header()}${view==='home'?homeUI():view==='setup'?setupUI():view==='stats'?statsUI():gameUI()}</div>`;updateSaveWarning();let feed=$('feed');if(feed&&!['night','prologue','role'].includes(g?.phase))feed.scrollTop=feed.scrollHeight;}
function openModal(title,html,closeable=true){modalReturnFocus=document.activeElement;let root=$('modal-root');root.innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><div class="modal-head"><h2 id="modal-title">${title}</h2>${closeable?'<button class="iconbtn" data-action="close-modal" aria-label="Đóng">'+icon('close')+'</button>':''}</div>${html}</section></div>`;root.dataset.closeable=String(closeable);$('app').inert=true;let dialog=root.querySelector('.modal');dialog.focus();modalClose=closeable?closeModal:null;}
function closeModal(){let root=$('modal-root');root.innerHTML='';$('app').inert=false;modalClose=null;modalReturnFocus?.isConnected&&modalReturnFocus.focus();}
let confirmCallback=null;
function confirmDialog(title,body,callback,button='Xác nhận'){confirmCallback=callback;openModal(title,`<p class="muted" style="font-size:16px">${body}</p><div class="row wrap" style="justify-content:flex-end;margin-top:24px"><button class="btn secondary" data-action="close-modal">Quay lại</button><button class="btn" data-action="confirm">${button}</button></div>`);}
function helpModal(g=null){openModal('Lời của quản trò',rulesUI(g));}
function roleModal(){let g=currentGame(),h=human(g),r=ROLES[h.role];openModal('Đừng để ai nhìn thấy.',`<div class="rolecard"><span class="kicker">${team(h)==='wolf'?'PHE MA SÓI':'PHE DÂN LÀNG'}</span><div>${icon(r.icon)}</div><h3>${r.name}</h3><p>${esc(r.desc)}</p>${isWolf(h)?'<div class="divider"></div><p>Đồng đội: '+g.players.filter(p=>isWolf(p)&&p.id!==0).map(p=>esc(p.name)).join(', ')+'</p>':''}</div><button class="btn full" data-action="close-modal">${icon('check')}Tôi đã nhớ vai</button>`);Sound.tone('reveal');}
function settingsModal(){let st=S.settings;openModal('Bên ngọn nến',`<div class="field"><label for="volume">Âm lượng <span id="volume-value">${Math.round(st.volume*100)}%</span></label><input id="volume" type="range" min="0" max="100" value="${Math.round(st.volume*100)}"></div><div class="stack"><label class="checkline"><input type="checkbox" data-setting="music" ${st.music?'checked':''}>Âm nền: gió đêm và nhạc trầm</label><label class="checkline"><input type="checkbox" data-setting="sfx" ${st.sfx?'checked':''}>Hiệu ứng âm thanh</label><label class="checkline"><input type="checkbox" data-setting="reduced" ${st.reduced?'checked':''}>Giảm chuyển động và hiệu ứng</label><label class="checkline"><input type="checkbox" data-setting="speed" ${st.speed==='fast'?'checked':''}>Đọc nhanh · bỏ hiệu ứng chuyển cảnh</label></div><div class="divider"></div><h3>Giữ lại hành trình</h3><p class="muted tiny" style="margin:10px 0">Game tự lưu trong trình duyệt này. Để chuyển máy hoặc phòng khi xóa dữ liệu, hãy xuất bản lưu JSON. Mở file HTML bằng cùng trình duyệt và hồ sơ để tiếp tục. Chế độ riêng tư có thể không giữ dữ liệu sau khi đóng.</p><div class="two"><button class="btn secondary" data-action="export">${icon('download')}Xuất bản lưu</button><button class="btn secondary" data-action="import">${icon('upload')}Nhập bản lưu</button></div><div class="divider"></div><p class="muted tiny">Một file HTML · Không tài khoản · Không gửi dữ liệu lên mạng.<br>Hãy bấm vào game để trình duyệt cho phép phát âm thanh.</p><button class="btn secondary full sm" data-action="reset">Xóa toàn bộ tiến trình và thống kê</button>`);}
function exportSave(){recordResult();persist();let blob=new Blob([packState(S)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LangSuong_banluu_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã xuất bản lưu. Hãy giữ file JSON cùng file game.');}
function readDraft(){let form=$('setup-form');if(!form)return;let f=new FormData(form);setupDraft.name=String(f.get('name')||'Lữ khách').trim().slice(0,24)||'Lữ khách';if(f.has('players'))setupDraft.players=Number(f.get('players'));if(f.has('difficulty'))setupDraft.difficulty=String(f.get('difficulty'));if(f.has('trainingRole'))setupDraft.trainingRole=String(f.get('trainingRole'));if(f.has('challenge'))setupDraft.challenge=String(f.get('challenge'));if(f.has('rounds'))setupDraft.rounds=Number(f.get('rounds'));if(setupDraft.mode!=='challenge')for(let k of ['reveal','noRepeat','selfSave'])setupDraft[k]=f.has(k);}
function beginCampaign(){let cfg={...setupDraft};if(!Number.isInteger(cfg.rounds)||cfg.rounds<1||cfg.rounds>10000){toast('Số màn phải là số nguyên từ 1 đến 10.000.',true);return;}S.campaign=makeCampaign(cfg);S.campaign.game=makeGame(S.campaign);view='game';activeTab='council';selected=null;commit();window.scrollTo({top:0});}
function changePhase(action){let g=currentGame();if(!g)return;let oldPhase=g.phase;if(action==='receive-role'&&g.phase==='prologue')g.phase='role';else if(action==='first-night'&&g.phase==='role')prepareNight(g);else if(action==='sleep'&&g.phase==='night'&&(!human(g).alive||['villager','hunter'].includes(human(g).role))){g.night.done=true;g.night.result=human(g).alive?'Bạn ngủ đến bình minh.':'Bạn quan sát trong im lặng.';resolveNight(g);}else if(action==='dawn')resolveNight(g);else if(action==='discussion'&&g.phase==='dawn')enterDiscussion(g);else if(action==='start-vote')startVote(g);else if(action==='more-discussion')moreDiscussion(g);else if(action==='after-verdict')advanceVerdict(g);if(g.phase==='nextnight'){g.day++;prepareNight(g);}if(g.phase!==oldPhase)selected=null;commit();if(action==='receive-role')roleModal();else if(g.phase==='end')Sound.tone(g.outcome.won?'win':'lose');else if(g.phase==='night'&&g.phase!==oldPhase){Sound.tone('night');Sound.howl();}else if(g.phase==='dawn'){Sound.tone('day');Sound.bell();}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el||el.disabled)return;Sound.init();let a=el.dataset.action,v=el.dataset.value,id=el.dataset.id!==undefined?Number(el.dataset.id):null,g=currentGame();if(a==='reload'){window.location.reload();return;}if(externalConflict)return;if(a!=='sound')Sound.tone('click');
if(a==='close-modal'){closeModal();return;}if(a==='confirm'){let callback=confirmCallback;confirmCallback=null;closeModal();callback?.();return;}
if(a==='nav'){if(v==='help')helpModal();else if(v==='game'){view=g?'game':'setup';activeTab='council';render();}else if(v==='journal'){if(g&&g.phase!=='end'){view='game';activeTab='journal';render();}else toast('Sổ tay mở khi bạn đang trong một ván chơi.');}else{view=v;render();}window.scrollTo({top:0});return;}
if(a==='setup'){view='setup';render();window.scrollTo({top:0});return;}if(a==='continue'){view='game';activeTab='council';render();return;}if(a==='help'){helpModal();return;}if(a==='game-rules'){helpModal(g);return;}if(a==='settings'){settingsModal();return;}if(a==='sound'){let enabled=S.settings.music||S.settings.sfx;S.settings.music=!enabled;S.settings.sfx=!enabled;Sound.update();persist();render();toast(enabled?'Đã tắt âm thanh.':'Đã bật âm thanh.');return;}
if(a==='draft'){readDraft();setupDraft[el.dataset.key]=v;render();return;}if(a==='tab'){activeTab=v;render();return;}if(a==='result-tab'){activeTab=v;render();return;}if(a==='select'){selected=selected===id?null:id;let feed=$('feed'),scroll=feed?.scrollTop;render();if($('feed')&&scroll!==undefined)$('feed').scrollTop=scroll;Sound.tone('select');return;}if(a==='clear-select'){selected=null;render();return;}if(a==='toggle-role'){showRole=!showRole;render();return;}if(a==='role-card'){roleModal();return;}
if(a==='note-player'){activeTab='journal';render();$('note-'+id)?.scrollIntoView({behavior:S.settings.reduced?'auto':'smooth',block:'center'});$('note-'+id)?.querySelector('textarea')?.focus();return;}if(a==='flag'){let note=g.notes[id]||{text:'',flag:'unknown'};note.flag=v;g.notes[id]=note;persist();let y=window.scrollY;render();window.scrollTo(0,y);return;}
if(a==='tactic'){tactic=v;render();return;}if(a==='speak'){if(humanSpeech(g,tactic,selected,claimRole,claimVerdict))commit();return;}
if(a==='night-action'){if(v==='poison')confirmDialog('Một lọ thuốc. Một quyết định.','Dùng thuốc độc với <strong>'+esc(byId(g,selected)?.name)+'</strong>? Thuốc chỉ có một lần cho cả ván.',()=>{if(nightAction(g,v,selected))commit();},'Dùng thuốc độc');else if(nightAction(g,v,selected))commit();return;}
if(a==='vote'||a==='abstain'){let target=a==='vote'?selected:null;if(human(g).alive&&target!==null)confirmDialog('Chốt lá phiếu?','Bạn chọn treo cổ <strong>'+esc(byId(g,target)?.name)+'</strong>. Phiếu đã chốt không thể đổi.',()=>{if(resolveVote(g,target))commit();},'Chốt phiếu');else if(resolveVote(g,target))commit();return;}
if(a==='shoot'){let target=selected;confirmDialog('Phát súng cuối cùng','Bắn <strong>'+esc(byId(g,target)?.name)+'</strong>? Quyết định này sẽ được thực hiện ngay.',()=>{if(hunterAction(g,target)){if(g.phase==='nextnight'){g.day++;prepareNight(g);}selected=null;commit();Sound.tone(g.phase==='end'?(g.outcome.won?'win':'lose'):'death');}},'Bắn');return;}
if(a==='ballots'){openModal('Từng lá phiếu',ballotsUI(g,g.verdict));return;}
if(['receive-role','first-night','sleep','dawn','discussion','start-vote','more-discussion','after-verdict'].includes(a)){changePhase(a);return;}
if(a==='next-round'){if(!g?.outcome||S.campaign.completed)return;S.campaign.round++;S.campaign.game=makeGame(S.campaign);selected=null;activeTab='council';view='game';commit();window.scrollTo({top:0});return;}
if(a==='history'){let past=S.history[id];if(past)openModal('Nhật ký · '+esc(VILLAGES[past.village].name),replayUI(past));return;}
if(a==='export'){exportSave();return;}if(a==='import'){$('importfile').click();return;}if(a==='reset'){confirmDialog('Xóa toàn bộ dữ liệu?','Hành trình, thống kê và các bản xem lại sẽ bị xóa. Bạn có thể xuất bản lưu trước khi tiếp tục.',()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(BACKUP);}catch(e){}S=freshState();view='home';selected=null;activeTab='council';Sound.update();persist();render();toast('Đã bắt đầu trang mới.');},'Xóa dữ liệu');return;}
});
document.addEventListener('submit',e=>{if(e.target.id!=='setup-form')return;e.preventDefault();readDraft();if(S.campaign&&!S.campaign.completed&&S.campaign.game.phase!=='end')confirmDialog('Mở một hành trình mới?','Ván đang chơi sẽ được thay bằng hành trình mới. Thống kê và các ván đã hoàn thành vẫn được giữ. Bạn có thể xuất bản lưu trong Cài đặt trước khi đổi.',beginCampaign,'Bắt đầu mới');else beginCampaign();});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='targetpicker'){selected=el.value===''?null:Number(el.value);let y=window.scrollY;render();window.scrollTo(0,y);}if(el.id==='claimrole'){claimRole=el.value;render();}if(el.id==='claimverdict')claimVerdict=el.value;if(el.id==='relationfocus'){selected=el.value===''?null:Number(el.value);render();}if(el.id==='challenge'){setupDraft.challenge=el.value;$('challenge-description').textContent=CHALLENGES[el.value].desc;}if(el.dataset.setting){let k=el.dataset.setting;S.settings[k]=k==='speed'?(el.checked?'fast':'normal'):el.checked;Sound.init();Sound.update();persist();render();}if(el.id==='importfile'){let file=el.files?.[0];el.value='';if(!file)return;if(file.size>6000000){toast('Bản lưu quá lớn.',true);return;}file.text().then(text=>{let loaded;try{loaded=unpackState(text);}catch(error){toast('Không nhập được bản lưu: '+error.message,true);return;}confirmDialog('Khôi phục bản lưu?','Bản lưu từ <strong>'+esc(fmtDate(loaded.savedAt||Date.now()))+'</strong> sẽ thay thế toàn bộ tiến trình và thống kê hiện tại.',()=>{S=loaded;view=S.campaign?'game':'home';activeTab='council';selected=null;Sound.update();persist();render();toast('Đã khôi phục hành trình.');},'Khôi phục');}).catch(()=>toast('Không đọc được file bản lưu.',true));}});
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.note!==undefined){let g=currentGame(),id=Number(el.dataset.note);if(!g)return;let note=g.notes[id]||{flag:'unknown',text:''};note.text=el.value.slice(0,1000);g.notes[id]=note;persist();}if(el.id==='volume'){S.settings.volume=Number(el.value)/100;$('volume-value').textContent=el.value+'%';Sound.init();Sound.update();persist();}});
document.addEventListener('keydown',e=>{let root=$('modal-root'),dialog=root.querySelector('.modal');if(!dialog)return;if(e.key==='Escape'&&modalClose){e.preventDefault();modalClose();return;}if(e.key==='Tab'){let nodes=[...dialog.querySelectorAll('button:not(:disabled),input,select,textarea,a[href],summary')].filter(n=>!n.hidden),first=nodes[0],last=nodes.at(-1);if(!first){e.preventDefault();return;}if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('pagehide',()=>persist());
document.addEventListener('visibilitychange',()=>{if(document.hidden){persist();Sound.ctx?.suspend();}else if(Sound.ctx&&Sound.ctx.state==='suspended'){/* resume on the next gesture */}});
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{let latest=unpackState(e.newValue);if(stateDigest(latest)===lastSavedContent)return;externalConflict=true;saveOK=false;updateSaveWarning();openModal('Hành trình vừa được cập nhật','<p class="muted">Một tab khác đã thay đổi bản lưu. Tải lại để tiếp tục đúng tiến trình mới nhất.</p><button class="btn full" data-action="reload">Tải lại bản lưu mới</button>',false);}catch(error){}});
function boot(){load();render();updateSaveWarning();}
boot();
</script>
